<title>BBC26 Trip Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Channel board: one table of channels, dropdown rows, info panels. Orange and blue night theme. Each person keeps one colour. */
:root{
  --bg:#060A14; --org:#FF8A1F; --blu:#2E8BFF; --ink:#F2F5FB; --body:#CFD6E4; --sub:#FFB27A; --nil:#4A5670;
  --line:rgba(120,150,210,.18); --panel:rgba(12,20,38,.86);
  --sf:#7CFF5B; --ar:#4DA3FF; --sh:#FFD21F; --on:#06101E;
  --c:#8791A8;
  --head:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --txt:Aptos,'Segoe UI',Arial,system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-who="SF"]{--c:var(--sf)} :root[data-who="AR"]{--c:var(--ar)} :root[data-who="SH"]{--c:var(--sh)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 600px at 100% 0,rgba(255,138,31,.16),transparent 60%),radial-gradient(900px 700px at 0 100%,rgba(46,139,255,.16),transparent 60%),var(--bg);background-attachment:fixed;color:var(--body);font:15px/1.45 var(--txt);padding-inline:14px;padding-block:0 40px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(46,139,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,139,255,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}
body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none;z-index:90;animation:scan 14s linear infinite}
@keyframes scan{to{background-position:0 60px}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blu)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.mono{font-family:var(--mono)}
.m{color:var(--nil)} .sm{font-size:13px} .ink{color:var(--ink)} .b{font-weight:700;color:var(--ink)}
#app,.navw{max-width:1100px;margin:0 auto;position:relative;z-index:1}
#app{display:flex;flex-direction:column;gap:16px;padding-top:8px}
@media (prefers-reduced-motion:reduce){body:after{animation:none}.st.ongoing,.st.wip{animation:none!important}.glow{animation:none!important}.chev{transition:none!important}}

/* header */
header.top{display:flex;flex-direction:column;gap:6px;padding-top:12px}
header.top .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:700 38px/1 var(--head);color:var(--ink);letter-spacing:.02em;user-select:none;-webkit-user-select:none}
h1 span{background:linear-gradient(90deg,var(--org),var(--blu));-webkit-background-clip:text;background-clip:text;color:transparent}
header.top p{margin:0;color:var(--body)}
.who{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:2px solid var(--c);color:var(--ink);font:700 15px var(--head);letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

/* sticky nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(6,10,20,.94);border-top:3px solid var(--c);border-bottom:1px solid var(--line);margin-inline:-14px;padding-inline:14px}
.navw{display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{min-height:48px;font:700 15px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--body);border-bottom:3px solid transparent;position:relative}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--org)}
.nav .dot{position:absolute;top:10px;margin-left:6px;width:8px;height:8px;border-radius:50%;background:var(--c)}

/* banners and offline */
.off{border:1px dashed var(--org);color:var(--sub);padding:8px;text-align:center;font:600 13px var(--head);letter-spacing:.05em;text-transform:uppercase;background:rgba(255,138,31,.07)}

/* panels */
.ace{border-left:3px solid var(--org);background:linear-gradient(135deg,rgba(255,138,31,.09),rgba(46,139,255,.08));padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ace-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ace-h h3{margin:0;font:700 18px var(--head);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.ace-h span{font-size:12px;color:var(--nil)}
.lede{margin:0;color:var(--body)}
p.big{margin:0;font:700 34px/1.05 var(--head);color:var(--ink)}
.goal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.goal>div{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:rgba(6,10,20,.5)}
.goal .v{font:700 22px var(--head);color:var(--ink)}
.goal .k{font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.msg{border:1px solid rgba(255,138,31,.4);background:linear-gradient(90deg,rgba(255,138,31,.14),rgba(46,139,255,.12));padding:8px 10px}
.fine{font-size:12.5px;color:var(--nil);font-style:italic;margin:0}
.arow{display:flex;align-items:center;gap:8px;min-height:44px;border-top:1px solid var(--line);padding-block:4px;min-width:0}
.arow:first-of-type{border-top:0}
.arow.late .t{color:#FF8A8A}

/* board */
.glow{height:3px;background:linear-gradient(90deg,var(--org),var(--blu),var(--org));background-size:200% 100%;box-shadow:0 0 12px rgba(255,138,31,.55);animation:sweep 6s linear infinite}
@keyframes sweep{to{background-position:200% 0}}
.tw{overflow-x:auto}
table.board{width:100%;border-collapse:collapse;table-layout:fixed}
.board td,.board th{padding:9px 8px;vertical-align:top;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
.board tr.colh th{font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--nil);padding-block:6px}
.board tr.cat{scroll-margin-top:58px}
.board tr.cat th{font:700 22px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:26px 8px 8px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--org),var(--blu)) 1;scroll-margin-top:60px}
.board tr.cat.first th{padding-top:12px}
.board tr.sub td{font:700 16px var(--head);color:var(--sub);letter-spacing:.03em;padding-top:14px}
.board tr.sub.parent{cursor:pointer}
.board tr.sub td.name,.board tr.parent td.name{padding-left:8px}
.board td.name{padding-left:20px;color:var(--ink);font-weight:600}
.board tr.kid td.name{padding-left:34px;box-shadow:inset 2px 0 0 var(--org)}
.board tr.kid{background:rgba(255,138,31,.045)}
.board tr.kid.info td{padding:10px 8px 14px 18px}
.board tr.parent{cursor:pointer}
.board tr.clk{cursor:pointer}
.board tr.pay-SF td.name{box-shadow:inset 3px 0 0 var(--sf)}.board tr.pay-AR td.name{box-shadow:inset 3px 0 0 var(--ar)}.board tr.pay-SH td.name{box-shadow:inset 3px 0 0 var(--sh)}
.board td.oc{color:var(--ink)}
.board td.mono,.mono{font-family:var(--mono);font-size:13.5px}
tr.act td{padding:10px 8px;border-bottom:0}
.tog{display:inline-flex;align-items:center;gap:10px;min-height:40px;font:inherit;font-weight:700;color:inherit;text-align:left}
.chev{width:9px;height:9px;border-right:2px solid var(--org);border-bottom:2px solid var(--org);transform:rotate(-45deg);transition:transform .18s;flex:none;margin-top:-2px}
tr.open .chev{transform:rotate(45deg)}
.nil{color:var(--nil)}
.ed{display:block;width:100%;text-align:left;min-height:34px;padding:4px 0;overflow-wrap:anywhere;color:inherit;font:inherit}
.ed .ph{color:var(--nil)}
.ed-in{width:100%;font:inherit;color:var(--ink);background:#0B1426;border:2px solid var(--c);padding:8px;min-height:44px;border-radius:0}
.val{font-weight:700;color:var(--ink);font-size:15.5px}
.lk{font:600 13px var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--blu);text-decoration:underline;min-height:34px;padding:0 6px;display:inline-flex;align-items:center}
.acts2{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.flash{animation:fl 1.6s ease-out 1}
@keyframes fl{0%{box-shadow:inset 0 0 0 2px var(--c),0 0 14px var(--c)}100%{box-shadow:inset 0 0 0 2px transparent}}
.chg{font-size:12px;color:var(--c);display:inline-flex;align-items:center;gap:4px}
.chg:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pend{font:600 11px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--sub);border:1px dashed var(--sub);padding:0 5px}
.flag{color:#FFD66B;font-size:13px}

/* chips */
.st{--k:#6FC3FF;display:inline-block;font:700 12px/1.2 var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--k);border:1px solid var(--k);border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--k) 14%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--k) 30%,transparent);white-space:nowrap}
button.st{min-height:30px;position:relative}
button.st:after{content:"";position:absolute;inset:-8px -4px}
.st.done{--k:#5CFFA0} .st.ongoing{--k:#6FC3FF;animation:pl 2.4s ease-in-out infinite} .st.wip{--k:#FFD66B;animation:pl 2.4s ease-in-out infinite}
.st.hold{--k:#9AA3B5;box-shadow:none} .st.over{--k:#FF7B7B}
.st.plan,.st.open,.st.tbc{--k:#B8C4E0;border-style:dashed;box-shadow:none}
@keyframes pl{50%{box-shadow:0 0 16px color-mix(in srgb,var(--k) 55%,transparent)}}

/* seals: square, one colour per person */
.seal{display:inline-grid;place-items:center;min-width:30px;height:26px;border:2px solid var(--k);color:var(--k);font:700 12px var(--head);letter-spacing:.04em;flex:none;--k:var(--ink)}
.seal.s-SF{--k:var(--sf)}.seal.s-AR{--k:var(--ar)}.seal.s-SH{--k:var(--sh)}
.seal.on{background:var(--k);color:var(--on)}
.seal.sm{min-width:26px;height:22px;font-size:11px}
.sealbtn{width:44px;height:44px;display:inline-grid;place-items:center;flex:none}
.seals{display:flex;align-items:center;gap:3px;flex-wrap:wrap}

/* buttons */
.btn{min-height:44px;padding:0 16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.04);color:var(--ink);font:700 15px var(--head);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.p{background:var(--c);border-color:var(--c);color:var(--on)}
.btn.s{min-height:36px;padding:0 12px;font-size:14px}
.btn.d{border-style:dashed}
.btn.w{width:100%}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(2,5,12,.7);z-index:100}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:90%;overflow:auto;background:#0A1222;border:1px solid var(--line);border-top:3px solid var(--c);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:700 22px var(--head);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.lab{font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.field input,.field select{font:inherit;color:var(--ink);background:#0B1426;border:1px solid rgba(255,255,255,.28);padding:8px 10px;min-height:44px;width:100%;border-radius:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .p{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--c);color:var(--on);padding:10px 14px;font:700 15px var(--head);letter-spacing:.04em;z-index:120;max-width:calc(100% - 28px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:radial-gradient(700px 500px at 100% 0,rgba(255,138,31,.2),transparent 60%),radial-gradient(700px 500px at 0 100%,rgba(46,139,255,.2),transparent 60%),var(--bg);z-index:110;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.gate>*{width:100%;max-width:380px}
.gate h2{margin:0;font:700 34px/1.05 var(--head);color:var(--ink)}
.gate h2 span{background:linear-gradient(90deg,var(--org),var(--blu));-webkit-background-clip:text;background-clip:text;color:transparent}
.picks{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--k);background:color-mix(in srgb,var(--k) 8%,transparent);min-height:68px;text-align:left;color:var(--ink);--k:var(--ink)}
.pick.s-SF{--k:var(--sf)}.pick.s-AR{--k:var(--ar)}.pick.s-SH{--k:var(--sh)}
.pick .nm{font:700 24px var(--head);letter-spacing:.04em;flex:1}
.pick .seal{height:38px;min-width:50px;font-size:17px}
.pick small{color:var(--nil);font-size:12px}

/* phone: rows stack as cards, labels come from data-l */
@media (max-width:700px){
  h1{font-size:34px}
  .goal{grid-template-columns:1fr 1fr}
  table.board,.board tbody,.board tr,.board td,.board th{display:block;width:100%}
  .board colgroup,.board tr.colh{display:none}
  .board tr.item,.board tr.kid:not(.info),.board tr.sub.parent{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .board tr.item td,.board tr.kid td,.board tr.sub.parent td{border:0;padding:2px 4px}
  .board td.name{grid-column:1;grid-row:1;padding-left:4px}
  .board tr.kid td.name{padding-left:12px;box-shadow:none}
  .board tr.kid:not(.info){box-shadow:inset 2px 0 0 var(--org)}
  .board tr.pay-SF{box-shadow:inset 3px 0 0 var(--sf)!important}.board tr.pay-AR{box-shadow:inset 3px 0 0 var(--ar)!important}.board tr.pay-SH{box-shadow:inset 3px 0 0 var(--sh)!important}
  .board td.stc{grid-column:2;grid-row:1;justify-self:end}
  .board td.when,.board td.notes,.board td.oc{grid-column:1/-1}
  .board td[data-l]:not(.name):not(.stc):before{content:attr(data-l) ": ";font:600 11px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--nil)}
  .board td:empty{display:none}
  .board tr.kid.info td{padding:8px 4px 12px}
  .board tr.cat th{padding-top:24px}
  .board tr.sub:not(.parent) td{padding:12px 4px 4px}
}
@media (max-width:420px){.goal .v{font-size:19px}p.big{font-size:30px}}
</style>

<nav class="nav" id="nav" aria-label="Channels"><div class="navw" id="navw"></div></nav>
<div id="app"></div>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['Pre-trip','Land','Sea','Return','After'];
const PH_NAME={pre:'Pre-trip',d1:'Day 1 Land',d2:'Day 2 Sea',d3:'Day 3 Return',post:'Post-trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions'];
const CH=[['now','Itinerary'],['ledger','Ledger'],['intel','Info']];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtS=s=>{const d=dp(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+'d '+hh+'h':hh?hh+'h '+pad(m%60)+'m':m+'m'}
const byOrder=(a,b)=>((a.order||0)-(b.order||0))||(a.id>b.id?1:-1);

const S={crew:null,trip:null,seen:null,loaded:{},pend:new Set(),liveAt:0,ro:false,editing:0,dirty:false};
COLS.forEach(c=>S[c]={});
const UI={ov:LS.get('bbc26.phase')||'',open:{},base:{now:0,ledger:0,intel:0},focus:null,gateConfirm:null,cur:'now'};
if(!PH_NAME[UI.ov])UI.ov='';
let db=null,user=null,uid=null,live=false;
const T0=Date.now();
const root=document.documentElement;
const app=document.getElementById('app'),navw=document.getElementById('navw'),host=document.getElementById('sheet-host'),toastEl=document.getElementById('toast'),gate=document.getElementById('gate');

function loadCache(){
  try{
    const c=JSON.parse(LS.get(CACHE_KEY)||'null');if(!c)return;
    COLS.forEach(k=>{if(c[k])S[k]=c[k]});
    S.crew=c.crew||null;S.trip=c.trip||null;S.seen=c.seen||null;S.liveAt=c.liveAt||0;
    if(c.uid)uid=c.uid;
    COLS.concat(['crew','trip','seen']).forEach(k=>S.loaded[k]=true);
  }catch(e){}
}
function saveCache(){
  try{const o={crew:S.crew,trip:S.trip,seen:S.seen,liveAt:S.liveAt,uid:uid};COLS.forEach(k=>o[k]=S[k]);LS.set(CACHE_KEY,JSON.stringify(o))}catch(e){}
}

const trip=()=>S.trip||{};
const start=()=>trip().startDate||'2026-10-07';
const end=()=>trip().endDate||addDays(start(),2);
const dayDate=i=>addDays(start(),DAYOFF[i]);
const list=n=>Object.values(S[n]);
function me(){const sl=S.crew&&S.crew.slots;if(!sl||!uid)return null;return CODES.find(c=>sl[c]===uid)||null}
function sealOf(id){if(CODES.indexOf(id)>=0)return id;const sl=S.crew&&S.crew.slots;if(!sl||!id)return null;return CODES.find(c=>sl[c]===id)||null}
function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';

/* ledger data */
function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}

  return ace('Next up',cur?'Now: '+timeStr(cur)+' '+cur.title:'',
    nxt?[h('p',{class:'big mono'},timeStr(nxt)),h('div',{class:'b',style:'font-size:19px'},nxt.title),
      h('div',{class:'mono b',style:'color:var(--sub)'},'in '+inStr(evAt(nxt)-now)),
      q?h('a',{href:mapsUrl(q),target:'_blank',rel:'noopener'},(nxt.place||q)+' (map)'):null,
      nxt.note?h('p',{class:'lede sm'},nxt.note):null,
      nxt.flag?h('div',{class:'msg sm'},'! '+nxt.flag):null]
    :h('p',{class:'lede'},'That is every stop done.'));
}
function itinRows(ph,st){
  const rows=[catRow('now','1. Itinerary',true),colhRow(['Stop','Status','Time','Notes','Place'])];
  const {ev,idx,cur,nxt}=st;
  if(!ev.length){rows.push(subRow('No stops yet'),actRow(h('button',{type:'button',class:'btn d',onclick:()=>stopSheet(null,1)},'+ add stop')));return rows}
  const focus=nxt||cur||ev[ev.length-1];
  const days=[];ev.forEach(s=>{if(days.indexOf(s.day)<0)days.push(s.day)});
  const sOf=s=>{const i=ev.indexOf(s);return i<idx?'past':i===idx?(cur?'cur':'past'):i===idx+1?'nxt':''};
  days.forEach(d=>{
    const stops=ev.filter(s=>s.day===d),key='day'+d,states=stops.map(sOf);
    const dc=states.every(x=>x==='past')?['done','Done']:states.indexOf('cur')>=0?['ongoing','Now']:states.indexOf('nxt')>=0?['wip','Next']:['plan','Planned'];
    rows.push(parentRow(key,d===focus.day,'sub',fmtD(dayDate(d))+' · '+DAYTAG[d],[C('','stc',chip(dc[0],dc[1])),C('When','when',fmtS(dayDate(d))),C(),C()]));
    if(d===1&&ph==='d1')rows.push(infoRow(key,d===focus.day,slackPanel()));
    stops.forEach((s,i)=>{
      const state=states[i],q=s.mapsQuery||s.place;
      const sc=state==='past'?['done','Done']:state==='cur'?['ongoing','Now']:state==='nxt'?['wip','Next']:['plan','Planned'];
      rows.push(kidRow(key,d===focus.day,'',[
        C('','name',h('span',null,s.title),' ',h('button',{type:'button',class:'lk',onclick:()=>stopSheet(s)},'edit')),
        C('','stc',chip(sc[0],sc[1])),
        C('Time','when',editable(s.start||'',v=>upd('itinerary/'+s.id,{start:v,approx:false}),{show:timeStr(s),ph:s.when||'To add',aria:'Edit time',im:'numeric',validate:hmValid,norm:hmNorm,cls:'mono'})),
        C('Notes','notes',s.note?editable(s.note,v=>upd('itinerary/'+s.id,{note:v||null}),{aria:'Edit note'}):null,s.flag?h('div',{class:'flag'},'! '+s.flag):null,ml(pend('itinerary/'+s.id),chg(s,'now'))),
        C('Place','oc',q?h('a',{href:mapsUrl(q),target:'_blank',rel:'noopener'},s.place||q):null)
      ]));
    });
  });
  rows.push(actRow(h('button',{type:'button',class:'btn d',onclick:()=>stopSheet(null,focus.day)},'+ add stop')));
  return rows;
}

/* ---------- channel 2: ledger ---------- */
function ledgerRows(){
  const c=ledgerCalc(),left=c.budget-c.spent,rows=[catRow('ledger','2. Ledger')];
  rows.push(h('tr',{class:'kid info'},h('td',{colspan:5},ace('Summary','MYR, split three ways',
    h('div',{class:'goal'},[['Budget',rm(c.budget)],['Spent',rm(c.spent)],['Left',rm(left)],['Each, on budget',rm(Math.round(c.budget/3))]].map(([k,v])=>h('div',null,h('span',{class:'k'},k),h('span',{class:'v'+(k==='Left'&&left<0?' ':'')},v)))),
    left<0?h('div',{class:'msg sm'},'Over budget by '+rm(-left)):null,
    h('button',{type:'button',class:'btn p w',onclick:()=>spendSheet(null)},'+ Log a spend')))));
  if(c.lines.length){
    rows.push(colhRow(['Line','Status','Spent','Notes','Budget']));
    const cats=[];c.lines.forEach(l=>{if(cats.indexOf(l.category)<0)cats.push(l.category)});
    cats.forEach(cat=>{
      rows.push(subRow(cat));
      c.lines.filter(l=>l.category===cat).forEach(l=>{
        const sp=c.spentBy[l.id]||0,b=l.budget==null?null:+l.budget,ratio=b?sp/b:0;
        const sc=b==null?['tbc','No budget']:ratio>1?['over','Over']:ratio>=.8?['wip','Watch']:sp>0?['ongoing','On track']:['plan','Planned'];
        rows.push(h('tr',{class:'item'},
          C('','name',h('span',null,l.item),' ',h('button',{type:'button',class:'lk',onclick:()=>lineSheet(l)},'edit')),
          C('','stc',chip(sc[0],sc[1])),
          C('Spent','when mono',rm(sp)),
          C('Notes','notes',l.note?h('div',{class:'sm'},l.note):null,ratio>1?h('div',{class:'flag'},'Over by '+rm(sp-b)):ratio>=.8?h('div',{class:'flag'},Math.round(ratio*100)+'% used'):null,ml(pend('ledgerLines/'+l.id),chg(l,'ledger'))),
          C('Budget','oc',editable(b==null?'':rm(b),v=>{const n=v.trim()===''?null:parseFloat(v.replace(/[^\d.]/g,''));upd('ledgerLines/'+l.id,{budget:n==null||isNaN(n)?null:n})},{cls:'mono val',ph:'To add',aria:'Edit budget for '+l.item,im:'decimal'}))));
      });
    });
    rows.push(actRow(h('button',{type:'button',class:'btn d',onclick:()=>lineSheet(null)},'+ add budget line')));
  }else rows.push(subRow('No budget lines yet'),actRow(h('button',{type:'button',class:'btn d',onclick:()=>lineSheet(null)},'+ add budget line')));
  if(c.spends.length){
    rows.push(parentRow('spends',true,'sub','Spends ('+c.spends.length+')',[C('','stc',chip('ongoing',rm(c.spent))),C(),C(),C()]));
    c.spends.forEach(s=>{
      const ln=S.ledgerLines[s.lineId],sp=(s.splitBetween&&s.splitBetween.length)?s.splitBetween:CODES;
      rows.push(kidRow('spends',true,'clk pay-'+s.paidBy,[
        C('','name',h('span',{class:'acts2'},seal(s.paidBy,true,true),h('span',{class:'mono b'},rm(s.amount)))),
        C('','stc',chip('done',sp.length<3?'Split '+sp.length:'Paid')),
        C('When','when mono',whenStr(s.at||0)),
        C('For','notes',(ln?ln.item:'Unassigned')+(s.note?' · '+s.note:'')+(sp.length<3?' · '+sp.join(' '):''),ml(pend('ledgerSpends/'+s.id),chg(s,'ledger'))),
        C('','oc',h('button',{type:'button',class:'lk',onclick:e=>{e.stopPropagation();spendSheet(s)}},'edit'))
      ],{onclick:()=>spendSheet(s)}));
    });
  }
  const sp=list('ledgerSpends'),stl=list('settlements');
  if(sp.length||stl.length){
    const r=settle();
    rows.push(parentRow('settle',true,'sub','Settle up',[C('','stc',chip(r.transfers.length?'wip':'done',r.transfers.length?'Owing':'All square')),C(),C(),C()]));
    rows.push(infoRow('settle',true,ace('Settle up','Minimum transfers',
      r.transfers.length?r.transfers.map(t=>h('div',{class:'arow'},seal(t.from,true,true),h('span',{class:'mono b',style:'flex:1'},'pays '+t.to+' '+rm(t.amount)),h('button',{type:'button',class:'btn s',onclick:()=>markSettled(t)},'Settled'))):h('div',{class:'msg sm'},'All square. Nobody owes anybody.'),
      h('div',{class:'goal',style:'grid-template-columns:repeat(3,1fr)'},CODES.map(k=>h('div',null,seal(k,true,true),h('span',{class:'v mono',style:'font-size:17px'},(r.net[k]>0?'+':'')+rm(r.net[k]))))),
      r.done.length?h('div',null,h('div',{class:'lab'},'Settled ('+r.done.length+')'),r.done.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(x=>h('div',{class:'arow'},h('span',{class:'mono sm',style:'flex:1'},x.from+' paid '+x.to+' '+rm(x.amount)),h('button',{type:'button',class:'btn s d',onclick:()=>del('settlements/'+x.id)},'Undo')))):null)));
  }
  return rows;
}

/* ---------- channel 3: info ---------- */
function infoItem(d){
  const conf=d.status==='Confirmed',due=!conf?dueOf(d):null,kind=d.kind||'text',val=d.value||'';
  const isTbc=/^tbc/i.test(val)||!val,mono=kind==='time'||kind==='phone'||kind==='ref',q=d.mapsQuery||val;
  const acts=[];
  if(!isTbc){
    if(kind==='address')acts.push(h('a',{class:'lk',href:mapsUrl(q),target:'_blank',rel:'noopener'},'map'));
    if(kind==='phone'){acts.push(h('a',{class:'lk',href:'tel:'+val.replace(/[^\d+]/g,'')},'call'));acts.push(h('button',{type:'button',class:'lk',onclick:()=>copy(val)},'copy'))}
    if(kind==='ref')acts.push(h('button',{type:'button',class:'lk',onclick:()=>copy(val)},'copy'));
  }
  return h('tr',{class:'item',id:'r-'+d.id},
    C('','name',h('span',null,d.label),' ',h('button',{type:'button',class:'lk',onclick:()=>intelSheet(d)},'edit')),
    C('','stc',conf?chip('done','Confirmed',()=>upd('intel/'+d.id,{status:'TBC',confirmedBy:null}),'Confirmed. Tap to set back to TBC'):chip(due==='late'?'over':'tbc','TBC',()=>upd('intel/'+d.id,{status:'Confirmed',confirmedBy:me()||uid}),'TBC. Tap to confirm')),
    C('Needed by','when',d.neededBy?h('span',{class:due==='late'?'flag':due==='soon'?'flag':''},(due==='late'?'Overdue ':'')+fmtS(d.neededBy)):(conf&&sealOf(d.confirmedBy)?h('span',{class:'acts2'},'by ',seal(sealOf(d.confirmedBy),true,true)):null)),
    C('Notes','notes',d.note?h('div',{class:'sm'},d.note):null,ml(pend('intel/'+d.id),chg(d,'intel'))),
    C('Detail','oc',editable(val,v=>upd('intel/'+d.id,{value:v}),{cls:'val'+(mono?' mono':'')+(isTbc?' nil':''),ph:'To add',aria:'Edit '+d.label}),acts.length?h('div',{class:'acts2'},acts):null));
}
function decisionRows(d){
  const my=me(),opts=d.options||[],votes=d.votes||{},key='dec-'+d.id;
  const counts=opts.map((_,i)=>CODES.filter(c=>votes[c]===i).length);
  const top=Math.max.apply(null,counts.concat([0])),lead=top>0?counts.indexOf(top):-1,decided=d.decided!=null,due=!decided?dueOf(d):null;
  const rows=[];
  const pr=parentRow(key,!decided,'item',d.question,[
    C('','stc',chip(decided?'done':due==='late'?'over':'open',decided?'Decided':'Open')),
    C('Needed by','when',d.neededBy?fmtS(d.neededBy):null),
    C('Notes','notes',ml(pend('decisions/'+d.id),chg(d,'intel'))),
    C('Leading','oc',decided?opts[d.decided]:(lead>=0?opts[lead]:nilSp('No votes yet')))]);
  pr.id='r-'+d.id;rows.push(pr);
  opts.forEach((t,i)=>{
    const mine=my&&votes[my]===i,vs=CODES.filter(c=>votes[c]===i);
    rows.push(kidRow(key,!decided,'clk',[
      C('','name',h('span',{class:mine?'b':null},(mine?'(x) ':'( ) ')+t)),
      C('','stc',decided&&d.decided===i?chip('done','Chosen'):mine?chip('ongoing','Your vote'):i===lead&&!decided?chip('wip','Leading'):null),
      C(),C(),
      C('Votes','oc',vs.length?h('span',{class:'seals'},vs.map(c=>seal(c,true,true))):nilSp('No votes'))
    ],{onclick:()=>{
      if(decided){toast('Already decided. Reopen to vote');return}
      if(!my){toast('Pick who you are in settings');return}
      upd('decisions/'+d.id,{votes:{[my]:mine?null:i}});
    }}));
  });
  rows.push(kidRow(key,!decided,'',[C('','name',decided?h('button',{type:'button',class:'btn s',onclick:()=>upd('decisions/'+d.id,{decided:null})},'Reopen'):(lead>=0?h('button',{type:'button',class:'btn s p',onclick:()=>upd('decisions/'+d.id,{decided:lead})},'Mark decided'):h('span',{class:'nil sm'},'Tap an option to vote'))),C(),C(),C(),C()]));
  return rows;
}
function infoRows(){
  const cards=list('intel').sort(byOrder),decs=list('decisions'),gs=GROUPS.slice(),rows=[catRow('intel','3. Info')];
  cards.concat(decs).forEach(d=>{if(d.group&&gs.indexOf(d.group)<0)gs.push(d.group)});
  let any=false;
  rows.push(colhRow(['Item','Status','Needed by','Notes','Detail']));
  gs.forEach(g=>{
    const cs=cards.filter(d=>d.group===g),ds=decs.filter(d=>d.group===g);
    if(!cs.length&&!ds.length)return;any=true;
    rows.push(subRow(g));
    cs.forEach(d=>rows.push(infoItem(d)));
    ds.forEach(d=>decisionRows(d).forEach(r=>rows.push(r)));
  });
  if(!any)rows.push(subRow('Nothing here yet. Add flight details, booking numbers, phone numbers and addresses.'));
  rows.push(actRow(h('button',{type:'button',class:'btn d',onclick:()=>intelSheet(null)},'+ add info')));
  return rows;
}

/* ---------- page ---------- */
function offlineBars(){
  if(isOffline())return [h('div',{class:'off',role:'status'},'Offline · '+(S.liveAt?'showing last update from '+clockHM(S.liveAt):'nothing saved yet'))];
  if(S.ro)return [h('div',{class:'off'},'View only · ask Soff for Contributor access')];
  return [];
}
function attentionPanel(){
  const items=attentionItems();
  if(!items.length)return null;
  return ace('Needs attention',items.length+' open',items.slice(0,4).map(i=>h('button',{type:'button',class:'arow'+(i.s==='late'?' late':''),style:'width:100%;text-align:left',onclick:()=>goInfo(i.id)},
    chip(i.s==='late'?'over':'wip',i.s==='late'?'Overdue':'Due soon'),h('span',{class:'t',style:'flex:1'},i.label),h('span',{class:'sm mono'},fmtS(i.neededBy)))),
    items.length>4?h('span',{class:'fine'},'+'+(items.length-4)+' more in Info'):null);
}
function goInfo(id){UI.focus=id;const d=S.decisions[id];if(d)UI.open['dec-'+id]=true;render()}
function jump(k){const el=document.getElementById('ch-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function header(ph,legend){
  const w=me();
  const t=h('h1',null,h('span',null,'BBC26'),' board');
  let lp=null;const clr=()=>{clearTimeout(lp);lp=null};
  t.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{lp=null;phaseSheet()},650)});
  ['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>t.addEventListener(ev,clr));
  return h('header',{class:'top'},
    h('div',{class:'row1'},t,h('button',{type:'button',class:'who','aria-label':'Settings',onclick:settingsSheet},w?[seal(w,true,true),NAME[w]]:'Who are you?')),
    h('p',null,'Road trip, hike and a dive day to Tenggol Island, Wed 7 to Fri 9 Oct 2026. '+PH_NAME[ph]+'.'+(UI.ov?' (preview)':'')),
    legend.length?h('div',{class:'legend'},legend):null);
}
function renderNav(){
  navw.replaceChildren(...CH.map(([k,t])=>h('button',{type:'button','aria-current':UI.cur===k?'true':'false',onclick:()=>jump(k)},t,chanDot(k)?h('span',{class:'dot','aria-label':'New changes'}):null)));
}
function renderGate(){
  const need=uid&&!S.ro&&S.loaded.crew&&!me()&&!!db;
  gate.hidden=!need;
  if(!need){gate.replaceChildren();return}
  const sl=(S.crew&&S.crew.slots)||{};
  gate.replaceChildren(h('div',{class:'lab'},'BBC26 trip board'),h('h2',null,'Who are ',h('span',null,'you'),'?'),
    h('div',{class:'picks'},CREW.map(x=>{
      const taken=sl[x.c]&&sl[x.c]!==uid,sure=UI.gateConfirm===x.c;
      return h('button',{type:'button',class:'pick s-'+x.c,onclick:()=>{if(taken&&!sure){UI.gateConfirm=x.c;renderGate();return}bind(x.c)}},
        seal(x.c,true),h('span',{class:'nm'},x.n),h('small',null,sure?'tap again to take over':taken?'in use':'tap to pick'));
    })),
    h('div',{class:'fine'},'One time only on this phone. Change it later in settings.'));
}
function render(){
  if(S.editing>0){S.dirty=true;return}
  S.dirty=false;
  const ph=phase(),w=me();
  if(w)root.dataset.who=w;else delete root.dataset.who;
  const y=window.scrollY;
  used.clear();
  const st=itState();
  const rows=[].concat(itinRows(ph,st),ledgerRows(),infoRows());
  const legend=Array.from(used.entries()).map(([l,c])=>h('span',{class:'st '+c},l));
  const cg=h('colgroup',null,['25%','12%','14%','27%','22%'].map(wd=>h('col',{style:'width:'+wd})));
  app.replaceChildren(...[].concat(offlineBars(),header(ph,legend),attentionPanel(),nextPanel(st),
    h('div',{class:'tw'},h('div',{class:'glow'}),h('table',{class:'board'},cg,h('tbody',null,rows)))).flat(Infinity).filter(Boolean));
  window.scrollTo(0,y);
  renderNav();renderGate();
  if(UI.focus){const f=document.getElementById('r-'+UI.focus);UI.focus=null;if(f){f.scrollIntoView({block:'center'});f.classList.add('flash')}}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}
function onScroll(){
  let cur='now';
  CH.forEach(([k])=>{const el=document.getElementById('ch-'+k);if(el&&el.getBoundingClientRect().top<=90)cur=k});
  if(cur!==UI.cur){UI.cur=cur;navw.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',CH[i][0]===cur?'true':'false'))}
}

async function boot(){
  loadCache();
  if(S.loaded.seen)CH.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);
  render();
  addEventListener('scroll',onScroll,{passive:true});
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.pick')[+e.key-1];if(b)b.click()}});
  const C0=window.claude;
  try{user=C0&&C0.use?await C0.use('user'):null}catch(e){user=null}
  try{db=C0&&C0.use?await C0.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  render();
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.seenInit){S.seenInit=true;S.loaded.seen=true;CH.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);setTimeout(markSeen,2500)}
    sched();
  },err('seen'));
}
boot();
})();
</script>
