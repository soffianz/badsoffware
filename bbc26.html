<title>BBC26 Trip App</title>
<style>
/* MS-DOS look: black screen, monospace everywhere, double-line panels, inverse-video bars. One colour per person. */
:root{
  --bg:#000; --fg:#C8C8C8; --hi:#fff; --mute:#8A8A8A; --hair:#3C3C3C; --soft:#141414;
  --sf:#55FF55; --sf-on:#000; --ar:#6F8FFF; --ar-on:#000; --sh:#FFFF55; --sh-on:#000;
  --none:#B0B0B0; --none-on:#000;
  --c:var(--none); --on:var(--none-on);
  --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#E4E4DC; --fg:#111; --hi:#000; --mute:#555; --hair:#9A9A92; --soft:#D2D2CA;
  --sf:#0B7A2E; --sf-on:#fff; --ar:#1F45C8; --ar-on:#fff; --sh:#B89600; --sh-on:#000;
  --none:#555; --none-on:#fff; color-scheme:light;
}
:root[data-who="SF"]{--c:var(--sf);--on:var(--sf-on)}
:root[data-who="AR"]{--c:var(--ar);--on:var(--ar-on)}
:root[data-who="SH"]{--c:var(--sh);--on:var(--sh-on)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--mono);padding-inline:14px;padding-block:0 84px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--hi)}
::selection{background:var(--c);color:var(--on)}
:focus-visible{outline:2px dashed var(--c);outline-offset:2px}
.mono{font-family:var(--mono)}
.m{color:var(--mute)} .sm{font-size:13px} .b{font-weight:700;color:var(--hi)}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:10px}

.bar{display:flex;align-items:center;gap:10px;background:var(--c);color:var(--on);padding:8px 10px;user-select:none;-webkit-user-select:none}
.bar b{font-weight:700;color:inherit}
.bar .ph{flex:1;text-transform:uppercase;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{font-weight:700;min-height:36px;padding:0 4px}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.off{border:3px double var(--fg);padding:6px 8px;font-size:13px;text-align:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

.box{border:3px double var(--fg);position:relative;padding:16px 12px 12px;margin-top:6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box.main{border-color:var(--c)}
.cap{position:absolute;top:-12px;left:8px;background:var(--bg);padding:0 6px;font-weight:700;text-transform:uppercase;color:var(--hi);max-width:90%}
.box.main .cap{color:var(--c)}
.rw{display:flex;align-items:center;gap:8px;min-width:0}
.g{flex:1;min-width:0}
hr{border:0;border-top:1px dashed var(--hair);margin:0;width:100%}

.btn{min-height:44px;padding:0 8px;text-transform:uppercase;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--hi)}
.btn:before{content:"[\00a0"} .btn:after{content:"\00a0]"}
.btn.p{background:var(--c);color:var(--on)}
.btn.s{min-height:36px}
.btn.d{color:var(--mute)}
.btn.w{width:100%}
.lk{text-decoration:underline;min-height:36px;padding:0 6px;display:inline-flex;align-items:center;color:var(--hi);font-size:13px}
.tag{font-weight:700;text-transform:uppercase;white-space:nowrap;font-size:13px;color:var(--hi)}
.tag.x{background:var(--hi);color:var(--bg);padding:0 4px}
.tag.c{background:var(--c);color:var(--on);padding:0 4px}
.pend{font-size:12px;color:var(--bg);background:var(--mute);padding:0 4px}
.chg{font-size:12px;color:var(--c)}
.chg:before{content:"* "}

.seal{display:inline-grid;place-items:center;min-width:30px;height:26px;border:2px solid var(--fg);font-weight:700;font-size:12px;flex:none}
.seal.s-SF{border-color:var(--sf);color:var(--sf)} .seal.s-AR{border-color:var(--ar);color:var(--ar)} .seal.s-SH{border-color:var(--sh);color:var(--sh)}
.seal.on.s-SF{background:var(--sf);color:var(--sf-on)} .seal.on.s-AR{background:var(--ar);color:var(--ar-on)} .seal.on.s-SH{background:var(--sh);color:var(--sh-on)}
.seal.sm{min-width:26px;height:22px;font-size:11px}
.sealbtn{width:44px;height:44px;display:inline-grid;place-items:center;flex:none}
.seals{display:flex;align-items:center;gap:3px}

.ed{display:block;width:100%;text-align:left;min-height:40px;padding:6px 0;overflow-wrap:anywhere;color:inherit;font:inherit}
.ed .ph{color:var(--mute)}
.ed-in{width:100%;font:inherit;color:var(--hi);background:var(--bg);border:2px solid var(--c);caret-color:var(--c);padding:8px;min-height:44px;border-radius:0}

/* timeline */
.next .t{font-size:34px;line-height:1;font-weight:700;color:var(--hi)}
.next .n{font-size:19px;line-height:1.25;font-weight:700;color:var(--hi)}
.tl{border-left:2px dotted var(--mute);margin:6px 0 4px 8px}
.ev{position:relative;padding:0 0 16px 20px;display:flex;flex-direction:column;gap:2px}
.ev:before{content:"\25A1";position:absolute;left:-.62em;top:0;width:1.2em;text-align:center;background:var(--bg);color:var(--fg);line-height:1.5}
.ev.past{color:var(--mute)} .ev.past:before{content:"\25A0";color:var(--mute)}
.ev.cur:before{content:"\25BA";color:var(--c)}
.ev.nxt:before{content:"\25A1";color:var(--c);font-weight:700}
.ev .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .tm{font-weight:700}
.ev .tm .ed{display:inline-block;width:auto;min-width:56px;padding:6px 0}
.ev .ttl{font-weight:700;color:var(--hi)} .ev.past .ttl{color:var(--mute)}
.ev .ed.nt{color:var(--mute);font-size:13px;min-height:0;padding:2px 0}
details.day>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary:after{content:"[+]"} details.day[open]>summary:after{content:"[-]"}

/* ledger + info */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>div{display:flex;flex-direction:column;gap:2px}
.grid2 .v{font-size:20px;font-weight:700;color:var(--hi)}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:0 6px;align-items:center;padding-block:4px;border-top:1px dashed var(--hair)}
.ln:first-of-type{border-top:0}
.ln .bud{width:auto;min-width:80px;text-align:right;font-weight:700}
.ln .sub{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.bar2{height:10px;border:2px solid var(--mute);flex:1 1 70px;min-width:60px}.bar2 i{display:block;height:100%;background:var(--c)}
.bar2.hot i{background:var(--hi)}
.spend{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-top:1px dashed var(--hair)}
.spend:first-of-type{border-top:0}
.spend .a{font-weight:700;color:var(--hi);font-size:16px}
.card{display:flex;flex-direction:column;gap:4px}
.card .l{text-transform:uppercase;display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.kv{font-size:22px;line-height:1.2;font-weight:700;color:var(--hi);overflow-wrap:anywhere}
.kv.long{font-size:17px}.kv.tbc{color:var(--mute)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;padding:4px 6px}
.opt.mine{background:var(--soft);color:var(--c)}
.opt.dim{color:var(--mute)}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bal div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.empty{text-align:center;padding:18px 6px;display:flex;flex-direction:column;gap:8px;align-items:center}
.att{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border-top:1px dashed var(--hair);padding:6px 0}
.att .mono{white-space:nowrap}
.att:first-of-type{border-top:0}
.att.late{color:var(--hi);font-weight:700}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--bg);border-top:3px double var(--fg);padding:0 0 env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.tab{min-height:52px;font-weight:700;letter-spacing:.04em;color:var(--fg)}
.tab[aria-current="page"]{background:var(--c);color:var(--on)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border:3px double var(--c);border-bottom:0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:15px;text-transform:uppercase;background:var(--c);color:var(--on);padding:4px 8px}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.lab{font-weight:700;text-transform:uppercase;font-size:12px;color:var(--mute)}
.field input,.field select,.field textarea{font:inherit;color:var(--hi);background:var(--bg);border:2px solid var(--fg);caret-color:var(--c);padding:8px 10px;min-height:44px;width:100%;border-radius:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .p{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--c);color:var(--on);padding:8px 12px;font-weight:700;z-index:60;max-width:calc(100% - 28px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:left}
.gate>*{width:100%;max-width:360px}
.gate h1{margin:0;font-size:22px;text-transform:uppercase;color:var(--hi)}
.picks{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:3px double var(--fg);min-height:64px;text-align:left}
.pick.s-SF{border-color:var(--sf)}.pick.s-AR{border-color:var(--ar)}.pick.s-SH{border-color:var(--sh)}
.pick .seal{height:34px;min-width:44px;font-size:15px}
.pick small{color:var(--mute);font-size:12px;text-align:right}
</style>

<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['Pre-trip','Land','Sea','Return','After'];
const PH_NAME={pre:'Pre-trip',d1:'Day 1 Land',d2:'Day 2 Sea',d3:'Day 3 Return',post:'Post-trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions'];
const TABS=[['now','ITINERARY'],['ledger','LEDGER'],['intel','INFO']];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+'d '+hh+'h':hh?hh+'h '+pad(m%60)+'m':m+'m'}
const byOrder=(a,b)=>((a.order||0)-(b.order||0))||(a.id>b.id?1:-1);

const S={crew:null,trip:null,seen:null,loaded:{},pend:new Set(),liveAt:0,ro:false,editing:0,dirty:false};
COLS.forEach(c=>S[c]={});
const UI={tab:LS.get('bbc26.tab')||'now',ov:LS.get('bbc26.phase')||'',openDays:{},settled:false,base:{},focus:null,gateConfirm:null};
if(!TABS.some(t=>t[0]===UI.tab))UI.tab='now';
if(!PH_NAME[UI.ov])UI.ov='';
let db=null,user=null,uid=null,live=false;
const T0=Date.now();
const root=document.documentElement;
const app=document.getElementById('app'),tabsEl=document.getElementById('tabs'),host=document.getElementById('sheet-host'),toastEl=document.getElementById('toast'),gate=document.getElementById('gate');
{if(LS.get('bbc26.theme')==='light')root.dataset.theme='light'}

function loadCache(){
  try{
    const c=JSON.parse(LS.get(CACHE_KEY)||'null');if(!c)return;
    COLS.forEach(k=>{if(c[k])S[k]=c[k]});
    S.crew=c.crew||null;S.trip=c.trip||null;S.seen=c.seen||null;S.liveAt=c.liveAt||0;
    if(c.uid)uid=c.uid;
    COLS.concat(['crew','trip','seen']).forEach(k=>S.loaded[k]=true);
  }catch(e){}
}
function saveCache(){
  try{const o={crew:S.crew,trip:S.trip,seen:S.seen,liveAt:S.liveAt,uid:uid};COLS.forEach(k=>o[k]=S[k]);LS.set(CACHE_KEY,JSON.stringify(o))}catch(e){}
}

const trip=()=>S.trip||{};
const start=()=>trip().startDate||'2026-10-07';
const end=()=>trip().endDate||addDays(start(),2);
const dayDate=i=>addDays(start(),DAYOFF[i]);
const list=n=>Object.values(S[n]);
function me(){const sl=S.crew&&S.crew.slots;if(!sl||!uid)return null;return CODES.find(c=>sl[c]===uid)||null}
function sealOf(id){if(CODES.indexOf(id)>=0)return id;const sl=S.crew&&S.crew.slots;if(!sl||!id)return null;return CODES.find(c=>sl[c]===id)||null}
function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';
  if(today===addDays(s,1))return 'd2';
  if(today<=end())return 'd3';
  return 'post';
}
const isOffline=()=>!navigator.onLine||!db&&(Date.now()-T0>3000)||(Date.now()-T0>6000&&!live);

function dueOf(d){
  if(!d.neededBy)return null;
  const diff=Date.parse(d.neededBy+'T23:59:59Z')-clock();
  return diff<0?'late':diff<=48*3600e3?'soon':null;
}
function attentionItems(){
  const out=[];
  list('intel').forEach(d=>{if(d.status==='TBC'){const s=dueOf(d);if(s)out.push({id:d.id,label:d.label,neededBy:d.neededBy,s})}});
  list('decisions').forEach(d=>{if(d.decided==null){const s=dueOf(d);if(s)out.push({id:d.id,label:d.question,neededBy:d.neededBy,s})}});
  return out.sort((a,b)=>(a.s===b.s?0:a.s==='late'?-1:1)||(a.neededBy>b.neededBy?1:-1));
}

const docsOf={
  now:()=>list('itinerary').concat(S.trip?[Object.assign({id:'trip'},S.trip)]:[]),
  ledger:()=>list('ledgerLines').concat(list('ledgerSpends'),list('settlements')),
  intel:()=>list('intel').concat(list('decisions'))
};
const others=d=>d&&uid&&d.updatedAt&&d.updatedBy&&d.updatedBy!=='seed'&&d.updatedBy!==uid&&d.updatedBy!==me();
const unseen=(d,tab)=>others(d)&&d.updatedAt>(UI.base[tab]||0);
function tabUnseen(tab){
  if(!uid||!S.loaded.seen||tab===UI.tab)return false;
  const at=(S.seen&&S.seen.tabs&&S.seen.tabs[tab])||0;
  return docsOf[tab]().some(d=>others(d)&&d.updatedAt>at);
}
function chg(d,tab){return unseen(d,tab)?h('span',{class:'chg'},(sealOf(d.updatedBy)||'Someone')+' · '+ago(d.updatedAt)):null}
const pend=p=>S.pend.has(p)?h('span',{class:'pend'},'not saved yet'):null;
function markSeen(tab){
  if(!uid||!db||S.ro)return;
  enqueue('data/users/'+uid+'/seen',async()=>{
    const ref=db.doc('data/users/'+uid+'/seen'),v={tabs:{[tab]:Date.now()}};
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  },true);
}
function openTab(t){
  if(t===UI.tab&&UI.base[t]!==undefined)return;
  const old=UI.tab;
  if(old!==t&&S.loaded.seen)markSeen(old);
  UI.tab=t;LS.set('bbc26.tab',t);
  UI.base[t]=(S.seen&&S.seen.tabs&&S.seen.tabs[t])||0;
  if(S.loaded.seen)markSeen(t);
}

const Q={};
function enqueue(path,fn,quiet){
  const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{if(!quiet)toast(e&&e.code==='invalid_argument'?'Not saved. You may only have view access.':'Not saved. Check your signal and try again.')});
  Q[path]=p;return p;
}
function guard(){
  if(!db){toast("Can't connect. Changes are paused.");return false}
  if(S.ro){toast('View only. Ask Soff for Contributor access.');return false}
  return true;
}
const stamp=()=>({updatedBy:uid,updatedAt:Date.now()});
function upd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).update(Object.assign({},data,stamp())))}
function setd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).set(Object.assign({},data,stamp())))}
function del(path){if(!guard())return;return enqueue(path,()=>db.doc(path).delete())}
function upsert(path,data){
  if(!guard())return;
  return enqueue(path,async()=>{
    const ref=db.doc(path),v=Object.assign({},data,stamp());
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  });
}

let tT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function copy(v){
  const ok=()=>toast('Copied');
  const fb=()=>{try{const t=h('textarea',{value:v,style:'position:fixed;opacity:0'});document.body.append(t);t.select();document.execCommand('copy');t.remove();ok()}catch(e){toast('Select the text to copy it')}};
  try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}
}
const seal=(c,on,sm)=>h('span',{class:'seal s-'+c+(on?' on':'')+(sm?' sm':''),title:NAME[c]},c);
const cap=t=>h('span',{class:'cap'},t);
function editable(value,save,o){
  o=o||{};
  const b=h('button',{class:'ed '+(o.cls||''),type:'button','aria-label':o.aria||null},value?(o.show||value):h('span',{class:'ph'},o.ph||'add'));
  b.addEventListener('click',()=>{
    S.editing++;
    const inp=h('input',{class:'ed-in '+(o.cls||''),type:'text',value:value||'',placeholder:o.ph||'',inputmode:o.im||null,autocomplete:'off'});
    let done=false;
    const fin=commit=>{
      if(done)return;done=true;S.editing--;
      if(commit){
        const v=inp.value.trim();
        if(v!==(value||'')){const r=o.validate?o.validate(v):true;if(r!==true)toast(r);else save(o.norm?o.norm(v):v)}
      }
      render();
    };
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fin(true)}else if(e.key==='Escape'){fin(false)}});
    inp.addEventListener('blur',()=>fin(true));
    b.replaceWith(inp);inp.focus();inp.select();
  });
  return b;
}
const hmValid=v=>v===''||(/^\d{1,2}:\d{2}$/.test(v)&&pm(v)<1440)?true:'Use HH:MM, like 07:40';
const hmNorm=v=>{const m=pm(v);return m==null?'':hmOf(m)};

function closeSheet(){host.replaceChildren();document.removeEventListener('keydown',escClose)}
function escClose(e){if(e.key==='Escape')closeSheet()}
function openSheet(o){
  closeSheet();
  const vals={},els=[];
  (o.fields||[]).forEach(f=>{
    vals[f.k]=f.value;
    const id='sf-'+f.k;let ctl;
    if(f.t==='seal1'||f.t==='sealN'){
      ctl=h('div',{class:'seals',style:'gap:4px;flex-wrap:wrap'});
      const draw=()=>{ctl.replaceChildren(...CODES.map(c=>{
        const on=f.t==='seal1'?vals[f.k]===c:(vals[f.k]||[]).includes(c);
        return h('button',{type:'button',class:'sealbtn','aria-pressed':on?'true':'false','aria-label':NAME[c],onclick:()=>{
          if(f.t==='seal1')vals[f.k]=c;
          else{const a=(vals[f.k]||[]).slice(),i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);vals[f.k]=CODES.filter(x=>a.includes(x))}
          draw();
        }},seal(c,on));
      }))};
      draw();els.push(h('div',{class:'field'},h('span',{class:'lab'},f.label),ctl));return;
    }
    if(f.t==='select'){
      ctl=h('select',{id});
      f.options.forEach(([v,t])=>{const op=h('option',{value:v},t);if(String(v)===String(f.value))op.selected=true;ctl.append(op)});
      ctl.addEventListener('change',()=>vals[f.k]=ctl.value);
    }else{
      ctl=h('input',{id,type:f.t==='date'?'date':'text',value:f.value==null?'':f.value,placeholder:f.ph||'',inputmode:f.im||null,autocomplete:'off',enterkeyhint:'done'});
      ctl.addEventListener('input',()=>vals[f.k]=ctl.value);
    }
    els.push(h('div',{class:'field'},h('label',{class:'lab',for:id},f.label),ctl));
  });
  let armed=false;
  const delBtn=o.onDelete?h('button',{type:'button',class:'btn d',onclick:()=>{if(!armed){armed=true;delBtn.textContent='Tap again to delete';return}closeSheet();o.onDelete()}},'Delete'):null;
  const save=()=>{const err=o.validate?o.validate(vals):null;if(err){toast(err);return}closeSheet();o.onSave(vals)};
  const sheet=h('div',{class:'sheet',role:'dialog','aria-label':o.title},
    h('h2',null,o.title),o.node||null,
    els.length?h('div',{class:'fields'},els):null,
    h('div',{class:'acts'},h('button',{type:'button',class:'btn',onclick:closeSheet},o.onSave?'Cancel':'Close'),delBtn,
      o.onSave?h('button',{type:'button',class:'btn p',onclick:save},o.saveLabel||'Save'):null));
  host.append(h('div',{class:'scrim',onclick:closeSheet}),sheet);
  document.addEventListener('keydown',escClose);
  sheet.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&o.onSave){e.preventDefault();save()}});
  if(o.focus!==false){const f=sheet.querySelector('input,select');if(f)setTimeout(()=>f.focus(),60)}
}

function events(){return list('itinerary').filter(s=>s.day!=null).sort((a,b)=>(a.day-b.day)||byOrder(a,b))}
function lateFor(s){return s.day===1?(trip().lateBy||0):0}
function evAt(s,endToo){
  let m=pm(endToo?s.end:s.start);
  if(m==null){const w=(s.when||'').toLowerCase();m=w.indexOf('night')>=0?1260:w.indexOf('even')>=0?1080:w.indexOf('mid')>=0?720:540}
  return Date.parse(dayDate(s.day)+'T00:00:00Z')+(m+lateFor(s))*6e4;
}
const timeStr=s=>s.start?((s.approx?'~':'')+hmOf(pm(s.start)+lateFor(s))+(s.end?'-'+hmOf(pm(s.end)+lateFor(s)):'')):(s.when||'time tbc');
function state(){
  const ev=events(),now=clock();
  let idx=-1;ev.forEach((s,i)=>{if(evAt(s)<=now)idx=i});
  const curActive=idx>=0&&!(ev[idx].end&&evAt(ev[idx],true)<now);
  return {ev,idx,cur:curActive?ev[idx]:null,nxt:ev[idx+1]||null,now};
}

/* LEDGER */
function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}
const markSettled=t=>setd('settlements/'+newId(),{from:t.from,to:t.to,amount:t.amount,settled:true});

  if(c.lines.length){
    const cats=[];c.lines.forEach(l=>{if(cats.indexOf(l.category)<0)cats.push(l.category)});
    cats.forEach(cat=>out.push(h('section',{class:'box'},cap(cat),c.lines.filter(l=>l.category===cat).map(l=>{
      const sp=c.spentBy[l.id]||0,b=l.budget==null?null:+l.budget,ratio=b?sp/b:0;
      const hot=b&&ratio>=.8;
      return h('div',{class:'ln'},
        h('span',{class:'b'},l.item),
        editable(b==null?'':rm(b),v=>{const n=v.trim()===''?null:parseFloat(v.replace(/[^\d.]/g,''));upd('ledgerLines/'+l.id,{budget:n==null||isNaN(n)?null:n})},{cls:'bud',ph:'set budget',aria:'Edit budget for '+l.item,im:'decimal'}),
        h('button',{type:'button',class:'lk',onclick:()=>lineSheet(l)},'edit'),
        h('div',{class:'sub'},
          b?h('div',{class:'bar2'+(hot?' hot':'')},h('i',{style:'width:'+Math.min(100,Math.round(ratio*100))+'%'})):null,
          h('span',{class:ratio>1?'b':''},rm(sp)+' spent'),
          ratio>1?h('span',{class:'tag'},'[OVER BY '+rm(sp-b)+']'):hot?h('span',{class:'tag'},'['+Math.round(ratio*100)+'% USED]'):null,
          pend('ledgerLines/'+l.id),chg(l,'ledger')),
        l.note?h('div',{class:'sub'},l.note):null);
    }))));
    out.push(h('button',{type:'button',class:'btn d w',onclick:()=>lineSheet(null)},'+ add budget line'));
  }else{
    out.push(h('div',{class:'box empty'},cap('Budget'),h('b',null,'No budget lines yet'),h('span',{class:'m'},'Add the first line, then log spends against it.'),h('button',{type:'button',class:'btn',onclick:()=>lineSheet(null)},'+ add budget line')));
  }
  if(c.spends.length)out.push(h('section',{class:'box'},cap('Spends'),c.spends.map(s=>{
    const ln=S.ledgerLines[s.lineId],sp=(s.splitBetween&&s.splitBetween.length)?s.splitBetween:CODES;
    return h('button',{type:'button',class:'spend',onclick:()=>spendSheet(s)},
      seal(s.paidBy,true),
      h('div',{style:'min-width:0'},h('div',{class:'a'},rm(s.amount)),h('div',{class:'sm m',style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},(ln?ln.item:'Unassigned')+(s.note?' · '+s.note:'')+(sp.length<3?' · split '+sp.join(' '):''))),
      h('div',{style:'text-align:right'},h('div',{class:'sm mono m'},whenStr(s.at||0)),pend('ledgerSpends/'+s.id),chg(s,'ledger')));
  })));
  return out.concat(settleBox());
}

/* INFO */
function intelCard(d){
  const conf=d.status==='Confirmed',due=!conf?dueOf(d):null,kind=d.kind||'text',val=d.value||'';
  const isTbc=/^tbc/i.test(val)||!val,mono=kind==='time'||kind==='phone'||kind==='ref',q=d.mapsQuery||val;
  const acts=[];
  if(!isTbc){
    if(kind==='address')acts.push(h('a',{class:'lk',href:mapsUrl(q),target:'_blank',rel:'noopener'},'map'));
    if(kind==='phone'){acts.push(h('a',{class:'lk',href:'tel:'+val.replace(/[^\d+]/g,'')},'call'));acts.push(h('button',{type:'button',class:'lk',onclick:()=>copy(val)},'copy'))}
    if(kind==='ref')acts.push(h('button',{type:'button',class:'lk',onclick:()=>copy(val)},'copy'));
  }
  const tagTxt=conf?'[CONFIRMED]':'[TBC]';
  return h('article',{class:'card',id:'card-'+d.id},
    h('div',{class:'l'},h('span',null,d.label),
      h('button',{type:'button',class:'tag',style:'min-height:36px;padding:0 4px','aria-label':'Status '+tagTxt+'. Tap to change',onclick:()=>upd('intel/'+d.id,{status:conf?'TBC':'Confirmed',confirmedBy:conf?null:uid})},tagTxt)),
    editable(val,v=>upd('intel/'+d.id,{value:v}),{cls:'kv'+(mono?' mono':'')+(val.length>26?' long':'')+(isTbc?' tbc':''),ph:'add value',aria:'Edit '+d.label}),
    d.note?h('div',{class:'sm m'},d.note):null,
    h('div',{class:'rw',style:'flex-wrap:wrap;gap:4px 8px'},
      conf&&sealOf(d.confirmedBy)?h('span',{class:'rw sm',style:'gap:4px'},'by',seal(sealOf(d.confirmedBy),true,true)):null,
      d.neededBy?h('span',{class:'tag'+(due==='late'?' x':'')},'['+(due==='late'?'OVERDUE ':'DUE ')+fmtD(d.neededBy).toUpperCase()+']'):null,
      acts,pend('intel/'+d.id),chg(d,'intel'),
      h('button',{type:'button',class:'lk',style:'margin-left:auto',onclick:()=>intelSheet(d)},'edit')));
}
function intelSheet(d){
  const isNew=!d;
  openSheet({
    title:isNew?'Add info':'Edit info',
    fields:[
      {k:'label',label:'Label',value:d?d.label:'',ph:'Flight number'},
      {k:'group',label:'Group',t:'select',options:GROUPS.map(g=>[g,g]),value:d?d.group:'Getting there'},
      {k:'kind',label:'Kind',t:'select',options:KINDS,value:d?(d.kind||'text'):'text'},
      isNew?{k:'value',label:'Value',value:'TBC'}:null,
      {k:'neededBy',label:'Needed by',t:'date',value:d?d.neededBy||'':''},
      {k:'note',label:'Note',value:d?d.note||'':'',ph:'One line'}
    ].filter(Boolean),
    validate:v=>!(v.label||'').trim()?'Add a label':null,
    onSave:v=>{
      const base={label:v.label.trim(),group:v.group,kind:v.kind,neededBy:v.neededBy||null,note:(v.note||'').trim()||null};
      if(isNew)setd('intel/'+newId(),Object.assign(base,{value:(v.value||'TBC').trim()||'TBC',status:'TBC',order:Date.now()}));
      else upd('intel/'+d.id,base);
    },
    onDelete:isNew?null:()=>del('intel/'+d.id)
  });
}
function decisionCard(d){
  const my=me(),opts=d.options||[],votes=d.votes||{};
  const counts=opts.map((_,i)=>CODES.filter(c=>votes[c]===i).length);
  const top=Math.max.apply(null,counts.concat([0])),lead=top>0?counts.indexOf(top):-1,decided=d.decided!=null,due=!decided?dueOf(d):null;
  return h('article',{class:'card',id:'card-'+d.id},
    h('div',{class:'l'},h('span',null,'Decision'),h('span',{class:'tag'},decided?'[DECIDED]':'[OPEN]')),
    h('div',{class:'kv long'},d.question),
    opts.map((t,i)=>{
      const mine=my&&votes[my]===i;
      return h('button',{type:'button',class:'opt'+(mine?' mine':'')+(decided&&d.decided!==i?' dim':''),'aria-pressed':mine?'true':'false',onclick:()=>{
        if(decided){toast('Already decided. Reopen to vote');return}
        if(!my){toast('Pick who you are in settings');return}
        upd('decisions/'+d.id,{votes:{[my]:mine?null:i}});
      }},h('span',{class:'mono'},(decided?d.decided===i:mine)?'(x)':'( )'),h('span',{class:'g'+(i===lead&&!decided?' b':'')},t),h('span',{class:'seals'},CODES.filter(c=>votes[c]===i).map(c=>seal(c,true,true))));
    }),
    h('div',{class:'rw',style:'flex-wrap:wrap'},
      decided?h('button',{type:'button',class:'btn s',onclick:()=>upd('decisions/'+d.id,{decided:null})},'Reopen')
        :(lead>=0?h('button',{type:'button',class:'btn s p',onclick:()=>upd('decisions/'+d.id,{decided:lead})},'Mark decided: '+opts[lead]):null),
      d.neededBy?h('span',{class:'tag'+(due==='late'?' x':'')},'[DUE '+fmtD(d.neededBy).toUpperCase()+']'):null,
      pend('decisions/'+d.id),chg(d,'intel')));
}
function viewIntel(){
  const cards=list('intel').sort(byOrder),decs=list('decisions'),gs=GROUPS.slice(),out=[attention()];
  cards.concat(decs).forEach(d=>{if(d.group&&gs.indexOf(d.group)<0)gs.push(d.group)});
  let any=false;
  gs.forEach(g=>{
    const cs=cards.filter(d=>d.group===g),ds=decs.filter(d=>d.group===g);
    if(!cs.length&&!ds.length)return;any=true;
    out.push(h('section',{class:'box'+(g===gs[0]?' main':'')},cap(g),cs.map((d,i)=>[i?h('hr'):null,intelCard(d)]),ds.map(d=>[h('hr'),decisionCard(d)])));
  });
  if(!any)out.push(h('div',{class:'box empty'},cap('Info'),h('b',null,'Nothing here yet'),h('span',{class:'m'},'Add flight details, booking numbers, phone numbers and addresses.')));
  out.push(h('button',{type:'button',class:'btn d w',onclick:()=>intelSheet(null)},'+ add info'));
  return out;
}

function renderGate(){
  const need=uid&&!S.ro&&S.loaded.crew&&!me()&&!!db;
  gate.hidden=!need;
  if(!need){gate.replaceChildren();return}
  const sl=(S.crew&&S.crew.slots)||{};
  gate.replaceChildren(h('div',{class:'m'},'C:\\BBC26>'),h('h1',null,'Who are you?',h('span',{class:'cur'},'_')),
    h('div',{class:'picks'},CREW.map((x,i)=>{
      const taken=sl[x.c]&&sl[x.c]!==uid,sure=UI.gateConfirm===x.c;
      return h('button',{type:'button',class:'pick s-'+x.c,onclick:()=>{if(taken&&!sure){UI.gateConfirm=x.c;renderGate();return}bind(x.c)}},
        h('span',{class:'m'},(i+1)+'.'),seal(x.c,true),h('span',{class:'g b'},x.n.toUpperCase()),h('small',null,sure?'tap again to take over':taken?'in use':'tap to pick'));
    })),
    h('div',{class:'sm m'},'One time only on this phone. Change it later in settings.'));
}

const VIEWS={now:viewNow,ledger:viewLedger,intel:viewIntel};
function render(){
  if(S.editing>0){S.dirty=true;return}
  S.dirty=false;
  const ph=phase(),w=me();
  if(w)root.dataset.who=w;else delete root.dataset.who;
  const y=window.scrollY;
  app.replaceChildren(...[].concat(offlineBars(),header(ph),VIEWS[UI.tab](ph)).flat(Infinity).filter(Boolean));
  window.scrollTo(0,y);
  tabsEl.replaceChildren(...TABS.map(([k,t])=>h('button',{type:'button',class:'tab',role:'tab','aria-current':UI.tab===k?'page':null,onclick:()=>{if(k!==UI.tab){openTab(k);window.scrollTo(0,0);render()}}},t+(tabUnseen(k)?' *':''))));
  renderGate();
  if(UI.focus){const f=document.getElementById('card-'+UI.focus);UI.focus=null;if(f)f.scrollIntoView({block:'center'})}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}

async function boot(){
  loadCache();
  UI.base[UI.tab]=S.loaded.seen?((S.seen&&S.seen.tabs&&S.seen.tabs[UI.tab])||0):0;
  render();
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  const C=window.claude;
  try{user=C&&C.use?await C.use('user'):null}catch(e){user=null}
  try{db=C&&C.use?await C.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  render();
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.pick')[+e.key-1];if(b)b.click()}});
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.loaded.seen){S.loaded.seen=true;UI.base[UI.tab]=(S.seen&&S.seen.tabs&&S.seen.tabs[UI.tab])||0;markSeen(UI.tab)}
    sched();
  },err('seen'));
}
boot();
})();
