<title>BBC26 Trip Dashboard</title>
<style>
/* Plain, high-contrast phone dashboard. Light by default, dark follows the phone. Green-blue accent, clear status colours. */
:root{
  --bg:#F5F8F6; --card:#FFFFFF; --ink:#10201A; --ink2:#43554D; --line:#D3DDD8;
  --accent:#0B6B58; --on:#FFFFFF; --link:#1456B8;
  --ok:#17692F; --ok-bg:#DFF2E4; --now:#0F4FA8; --now-bg:#DCEAFE; --warn:#7F4A00; --warn-bg:#FFE9C2; --bad:#A01F1F; --bad-bg:#FBDFDF; --mute:#42524B; --mute-bg:#E6ECE9;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411; --card:#13201B; --ink:#EBF5F0; --ink2:#AFC1B8; --line:#2A3C33;
    --accent:#3FD1AC; --on:#06150F; --link:#8DBBFF;
    --ok:#93E3AA; --ok-bg:#16391F; --now:#A5CBFF; --now-bg:#133060; --warn:#F5C777; --warn-bg:#3C2A0A; --bad:#FFA3A3; --bad-bg:#4B1717; --mute:#B4C6BD; --mute-bg:#22332B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411; --card:#13201B; --ink:#EBF5F0; --ink2:#AFC1B8; --line:#2A3C33;
  --accent:#3FD1AC; --on:#06150F; --link:#8DBBFF;
  --ok:#93E3AA; --ok-bg:#16391F; --now:#A5CBFF; --now-bg:#133060; --warn:#F5C777; --warn-bg:#3C2A0A; --bad:#FFA3A3; --bad-bg:#4B1717; --mute:#B4C6BD; --mute-bg:#22332B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 84px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-top:8px}

.off{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--warn-bg);color:var(--warn);padding:10px 12px;font-weight:600;font-size:15px;margin-inline:-16px;text-align:center}

header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px}
h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em;user-select:none;-webkit-user-select:none}
header.top p{margin:4px 0 0;color:var(--ink2);font-size:16px}
.who{min-height:44px;padding:0 14px;border:2px solid var(--accent);color:var(--accent);font-weight:700;border-radius:6px;display:inline-flex;align-items:center;flex:none}

h2{margin:0;font-size:20px;line-height:1.2;font-weight:800}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sech span{color:var(--ink2);font-size:14px}
section{display:flex;flex-direction:column;min-width:0}
h3{margin:0;font-size:16px;font-weight:700}

.box{border:2px solid var(--line);border-left:6px solid var(--accent);background:var(--card);padding:14px 16px;border-radius:4px;display:flex;flex-direction:column;gap:8px}
.box.bad{border-left-color:var(--bad)}
.lbl{font-size:14px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:32px;line-height:1.1;font-weight:800}
.mid{font-size:20px;line-height:1.25;font-weight:700}
.sec2{color:var(--ink2)}
.sm{font-size:14px}

.row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px;align-items:flex-start;cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.tm{flex:none;width:76px;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ttl{font-weight:700}
.stt{flex:none;align-self:flex-start}
.row.past{opacity:.62}
.row.nxt{background:var(--now-bg);margin-inline:-16px;padding-inline:16px;border-left:6px solid var(--now);padding-left:10px}
.row.cur{background:var(--ok-bg);margin-inline:-16px;padding-inline:16px;border-left:6px solid var(--ok);padding-left:10px}

.day{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.day .n{flex:1}
.day .cnt{font-weight:500;color:var(--ink2);font-size:14px}
.chev{width:10px;height:10px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg);flex:none;transition:transform .15s}
.day[aria-expanded="true"] .chev{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

.pill{display:inline-block;font-size:13px;font-weight:700;line-height:1.2;padding:3px 9px;border-radius:4px;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.now{background:var(--now-bg);color:var(--now)} .pill.next{background:transparent;color:var(--now);box-shadow:inset 0 0 0 2px var(--now)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button.pill{min-height:32px;display:inline-flex;align-items:center;position:relative}
button.pill:after{content:"";position:absolute;inset:-8px -6px}
.note{color:var(--ink2);font-size:15px}
.flag{color:var(--warn);font-weight:600;font-size:15px}
.chg{font-size:13px;color:var(--now);font-weight:600}
.chg:before{content:"\25CF\00a0"}
.pend{font-size:13px;color:var(--warn);font-weight:700}
.lnk{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:6px 0;margin:-6px 0}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:2px}
.links button,.links a{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px;display:inline-flex;align-items:center}

.btn{min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:6px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:var(--card);text-align:center}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.s{min-height:44px;padding:0 14px}
.btn.w{width:100%}
.btn.d{border-color:var(--line);color:var(--ink2)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.acts .p{flex:1}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4>div{border:2px solid var(--line);background:var(--card);padding:10px 12px;border-radius:4px;display:flex;flex-direction:column;gap:2px}
.grid4 .v{font-size:22px;font-weight:800}
.grid4 .v.bad{color:var(--bad)}
.bar{height:10px;border-radius:5px;background:var(--mute-bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.badge{flex:none;width:36px;height:36px;border-radius:50%;background:var(--mute-bg);color:var(--ink);display:inline-grid;place-items:center;font-weight:800;font-size:14px}
.amt{font-weight:800;font-size:18px}
.item .vv{font-size:20px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;min-height:32px;display:block;padding:2px 0}
.item .vv.tbc{color:var(--ink2);font-weight:600}
.item{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .top b{font-size:15px;color:var(--ink2);font-weight:700}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 10px;border:2px solid var(--line);border-radius:4px;width:100%;background:var(--card)}
.opt.mine{border-color:var(--accent)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink2);flex:none}
.opt.mine .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.opt.dim{opacity:.6}
.stack{display:flex;flex-direction:column;gap:8px}
.empty{padding:18px 0;color:var(--ink2)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{min-height:58px;font-weight:700;font-size:16px;color:var(--ink2);text-align:center;position:relative;border-top:4px solid transparent;margin-top:-2px}
.tab[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--now);margin-left:6px;vertical-align:middle}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--card);border-top:4px solid var(--accent);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;flex-direction:column;gap:14px}
.sheet h2{border:0;padding:0}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>span.lab{font-weight:700;font-size:15px}
.field input,.field select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink2);border-radius:4px;padding:10px 12px;min-height:48px;width:100%}
.names{display:flex;gap:8px;flex-wrap:wrap}
.nb{min-height:48px;padding:0 16px;border:2px solid var(--ink2);border-radius:4px;font-weight:700}
.nb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;font-weight:600;border-radius:6px;z-index:120;max-width:calc(100% - 32px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:110;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.gate>*{width:100%;max-width:420px;margin-inline:auto}
.gate h2{font-size:32px;border:0;padding:0}
.pick{display:flex;align-items:center;gap:16px;min-height:68px;padding:12px 16px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font-size:22px;font-weight:800;width:100%}
.pick .badge{width:44px;height:44px;font-size:16px;background:var(--accent);color:var(--on)}
.pick small{margin-left:auto;font-size:14px;font-weight:500;color:var(--ink2);text-align:right}
</style>

<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['Before','Land','Sea','Return','After'];
const PH_NAME={pre:'Before the trip',d1:'Day 1, Land',d2:'Day 2, Sea',d3:'Day 3, Return',post:'After the trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions'];
const TABS=[['now','Itinerary'],['ledger','Ledger'],['intel','Info']];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const rmn=n=>{n=Math.round((+n||0)*100)/100;return Number.isInteger(n)?String(n):n.toFixed(2)};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtS=s=>{const d=dp(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+', '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+' d '+hh+' h':hh?hh+' h '+m%60+' min':m+' min'}
const byOrder=(a,b)=>((a.order||0)-(b.order||0))||(a.id>b.id?1:-1);

const S={crew:null,trip:null,seen:null,loaded:{},pend:new Set(),liveAt:0,ro:false};
COLS.forEach(c=>S[c]={});
const UI={tab:LS.get('bbc26.tab')||'now',ov:LS.get('bbc26.phase')||'',open:{},base:{now:0,ledger:0,intel:0},focus:null,gateConfirm:null};
if(!TABS.some(t=>t[0]===UI.tab))UI.tab='now';
if(!PH_NAME[UI.ov])UI.ov='';
let db=null,user=null,uid=null,live=false;
const T0=Date.now();
const root=document.documentElement;
const app=document.getElementById('app'),tabsEl=document.getElementById('tabs'),host=document.getElementById('sheet-host'),toastEl=document.getElementById('toast'),gate=document.getElementById('gate');
{const th=LS.get('bbc26.theme');if(th==='light'||th==='dark')root.dataset.theme=th}

function loadCache(){
  try{
    const c=JSON.parse(LS.get(CACHE_KEY)||'null');if(!c)return;
    COLS.forEach(k=>{if(c[k])S[k]=c[k]});
    S.crew=c.crew||null;S.trip=c.trip||null;S.seen=c.seen||null;S.liveAt=c.liveAt||0;
    if(c.uid)uid=c.uid;
    COLS.concat(['crew','trip','seen']).forEach(k=>S.loaded[k]=true);
  }catch(e){}
}
function saveCache(){
  try{const o={crew:S.crew,trip:S.trip,seen:S.seen,liveAt:S.liveAt,uid:uid};COLS.forEach(k=>o[k]=S[k]);LS.set(CACHE_KEY,JSON.stringify(o))}catch(e){}
}

const trip=()=>S.trip||{};
const start=()=>trip().startDate||'2026-10-07';
const end=()=>trip().endDate||addDays(start(),2);
const dayDate=i=>addDays(start(),DAYOFF[i]);
const list=n=>Object.values(S[n]);
function me(){const sl=S.crew&&S.crew.slots;if(!sl||!uid)return null;return CODES.find(c=>sl[c]===uid)||null}
function sealOf(id){if(CODES.indexOf(id)>=0)return id;const sl=S.crew&&S.crew.slots;if(!sl||!id)return null;return CODES.find(c=>sl[c]===id)||null}
const who=id=>{const c=sealOf(id);return c?NAME[c]:'Someone'};
function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';
  if(today===addDays(s,1))return 'd2';
  if(today<=end())return 'd3';
  return 'post';
}
const isOffline=()=>!navigator.onLine||!db&&(Date.now()-T0>3000)||(Date.now()-T0>6000&&!live);
function dueOf(d){
  if(!d.neededBy)return null;
  const diff=Date.parse(d.neededBy+'T23:59:59Z')-clock();
  return diff<0?'late':diff<=48*3600e3?'soon':null;
}
function attentionItems(){
  const out=[];
  list('intel').forEach(d=>{if(d.status==='TBC'){const s=dueOf(d);if(s)out.push({id:d.id,label:d.label,neededBy:d.neededBy,s})}});
  list('decisions').forEach(d=>{if(d.decided==null){const s=dueOf(d);if(s)out.push({id:d.id,label:d.question,neededBy:d.neededBy,s})}});
  return out.sort((a,b)=>(a.s===b.s?0:a.s==='late'?-1:1)||(a.neededBy>b.neededBy?1:-1));
}

/* changes by other people */
const docsOf={
  now:()=>list('itinerary').concat(S.trip?[Object.assign({id:'trip'},S.trip)]:[]),
  ledger:()=>list('ledgerLines').concat(list('ledgerSpends'),list('settlements')),
  intel:()=>list('intel').concat(list('decisions'))
};
const others=d=>d&&uid&&d.updatedAt&&d.updatedBy&&d.updatedBy!=='seed'&&d.updatedBy!==uid&&d.updatedBy!==me();
const unseen=(d,ch)=>others(d)&&d.updatedAt>(UI.base[ch]||0);
const chanDot=ch=>ch!==UI.tab&&S.loaded.seen&&docsOf[ch]().some(d=>unseen(d,ch));
const chg=(d,ch)=>unseen(d,ch)?h('div',{class:'chg'},who(d.updatedBy)+' changed this '+ago(d.updatedAt)):null;
const pend=p=>S.pend.has(p)?h('div',{class:'pend'},'Not saved yet'):null;
function markSeen(){
  if(!uid||!db||S.ro)return;
  enqueue('data/users/'+uid+'/seen',async()=>{
    const ref=db.doc('data/users/'+uid+'/seen'),t=Date.now(),v={tabs:{now:t,ledger:t,intel:t}};
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  },true);
}

const Q={};
function enqueue(path,fn,quiet){
  const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{if(!quiet)toast(e&&e.code==='invalid_argument'?'Not saved. You may only have view access.':'Not saved. Check your signal and try again.')});
  Q[path]=p;return p;
}
function guard(){
  if(!db){toast("Can't connect. Changes are paused.");return false}
  if(S.ro){toast('View only. Ask Soff for Contributor access.');return false}
  return true;
}
const stamp=()=>({updatedBy:uid,updatedAt:Date.now()});
function upd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).update(Object.assign({},data,stamp())))}
function setd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).set(Object.assign({},data,stamp())))}
function del(path){if(!guard())return;return enqueue(path,()=>db.doc(path).delete())}
function upsert(path,data){
  if(!guard())return;
  return enqueue(path,async()=>{
    const ref=db.doc(path),v=Object.assign({},data,stamp());
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  });
}

let tT;

/* ---------- ledger data ---------- */
function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}
const markSettled=t=>setd('settlements/'+newId(),{from:t.from,to:t.to,amount:t.amount,settled:true});

              b!=null?h('div',{class:'bar '+k},h('i',{style:'width:'+Math.min(100,Math.round(ratio*100))+'%'})):h('div',{class:'sm sec2'},'No budget set. Tap to add one.'),
              ratio>1?h('div',{class:'flag',style:'color:var(--bad)'},'Over budget by '+rm(sp-b)):ratio>=.8?h('div',{class:'flag'},Math.round(ratio*100)+'% of budget used'):null,
              l.note?h('div',{class:'note'},l.note):null,pend('ledgerLines/'+l.id),chg(l,'ledger')));
        })]),
      h('div',{style:'height:14px'}),addBtn('Add a budget line',()=>lineSheet(null))));
  }else out.push(h('section',null,secH('Budget lines'),h('div',{class:'empty'},'No budget lines yet.'),addBtn('Add a budget line',()=>lineSheet(null))));
  if(c.spends.length)out.push(h('section',null,secH('Spends',c.spends.length+' logged · '+rm(c.spent)),
    c.spends.map(s=>{
      const l=S.ledgerLines[s.lineId],sp=(s.splitBetween&&s.splitBetween.length)?s.splitBetween:CODES;
      return h('div',Object.assign({class:'row'},tap(()=>spendSheet(s))),
        h('span',{class:'badge',title:NAME[s.paidBy]},s.paidBy),
        h('div',{class:'bd'},h('div',{class:'amt'},rm(s.amount)),h('div',null,(l?l.item:'Unassigned')+(s.note?', '+s.note:'')),h('div',{class:'sm sec2'},NAME[s.paidBy]+' paid · '+whenStr(s.at||0)+(sp.length<3?' · split '+sp.map(x=>NAME[x]).join(' and '):'')),pend('ledgerSpends/'+s.id),chg(s,'ledger')));
    })));
  if(list('ledgerSpends').length||list('settlements').length){
    const r=settle();
    out.push(h('section',null,secH('Settle up'),
      h('div',{style:'margin-top:12px;display:flex;flex-direction:column;gap:10px'},
        r.transfers.length?r.transfers.map(t=>h('div',{class:'box'},h('div',{class:'mid'},NAME[t.from]+' pays '+NAME[t.to]+' '+rm(t.amount)),h('div',{class:'acts'},h('button',{type:'button',class:'btn s',onclick:()=>markSettled(t)},'Mark as settled')))):h('div',{class:'box'},h('div',{class:'mid'},'All square. Nobody owes anybody.')),
        h('div',{class:'sm sec2'},'Balances: '+CODES.map(k=>NAME[k]+' '+(r.net[k]>0?'+':'')+rm(r.net[k])).join(' · '))),

  }
  return out;
}

/* ---------- info tab ---------- */
function infoItem(d){
  const conf=d.status==='Confirmed',due=!conf?dueOf(d):null,kind=d.kind||'text',val=d.value||'';
  const isTbc=/^tbc/i.test(val)||!val,q=d.mapsQuery||val;
  const links=[];
  if(!isTbc){
    if(kind==='address')links.push(h('a',{href:mapsUrl(q),target:'_blank',rel:'noopener'},'Open map'));
    if(kind==='phone'){links.push(h('a',{href:'tel:'+val.replace(/[^\d+]/g,'')},'Call'));links.push(h('button',{type:'button',onclick:()=>copy(val)},'Copy'))}
    if(kind==='ref')links.push(h('button',{type:'button',onclick:()=>copy(val)},'Copy'));
  }
  links.push(h('button',{type:'button',onclick:()=>intelSheet(d)},'Edit details'));
  return h('div',{class:'item',id:'S-'+d.id},
    h('div',{class:'top'},h('b',null,d.label),
      conf?pill('ok','Confirmed',()=>upd('intel/'+d.id,{status:'TBC',confirmedBy:null}),'Confirmed. Tap to set back to to be confirmed'):pill(due==='late'?'bad':'mute','To be confirmed',()=>upd('intel/'+d.id,{status:'Confirmed',confirmedBy:me()||uid}),'To be confirmed. Tap to mark confirmed')),
    h('button',{type:'button',class:'vv'+(isTbc?' tbc':''),'aria-label':'Edit '+d.label,onclick:()=>quick(d.label,val,v=>upd('intel/'+d.id,{value:v}),{label:'Value'})},isTbc&&!val?'Tap to add':val),
    d.note?h('div',{class:'note'},d.note):null,
    d.neededBy&&!conf?h('div',{class:due?'flag':'sm sec2',style:due==='late'?'color:var(--bad)':null},(due==='late'?'Overdue. Was needed by ':'Needed by ')+fmtD(d.neededBy)):null,
    conf&&sealOf(d.confirmedBy)?h('div',{class:'sm sec2'},'Confirmed by '+NAME[sealOf(d.confirmedBy)]):null,
    h('div',{class:'links'},links),pend('intel/'+d.id),chg(d,'intel'));
}
function decisionItem(d){
  const my=me(),opts=d.options||[],votes=d.votes||{};
  const counts=opts.map((_,i)=>CODES.filter(c=>votes[c]===i).length);
  const top=Math.max.apply(null,counts.concat([0])),lead=top>0?counts.indexOf(top):-1,decided=d.decided!=null,due=!decided?dueOf(d):null;
  return h('div',{class:'item',id:'S-'+d.id},
    h('div',{class:'top'},h('b',null,'Vote'),decided?pill('ok','Decided'):pill(due==='late'?'bad':'mute','Open')),
    h('div',{class:'mid'},d.question),
    h('div',{class:'stack'},opts.map((t,i)=>{
      const mine=my&&votes[my]===i,vs=CODES.filter(c=>votes[c]===i);
      return h('button',{type:'button',class:'opt'+(mine?' mine':'')+(decided&&d.decided!==i?' dim':''),'aria-pressed':mine?'true':'false',onclick:()=>{
        if(decided){toast('Already decided. Reopen to vote');return}
        if(!my){toast('Pick who you are in Settings');return}
        upd('decisions/'+d.id,{votes:{[my]:mine?null:i}});
      }},h('span',{class:'dot'}),h('span',{style:'flex:1'},h('b',null,t),vs.length?h('span',{class:'sm sec2'},' · '+vs.map(c=>NAME[c]).join(', ')):null),
        decided&&d.decided===i?pill('ok','Chosen'):(i===lead&&!decided?pill('now','Leading'):null));
    })),
    h('div',{class:'acts'},decided?h('button',{type:'button',class:'btn s',onclick:()=>upd('decisions/'+d.id,{decided:null})},'Reopen vote'):(lead>=0?h('button',{type:'button',class:'btn s p',onclick:()=>upd('decisions/'+d.id,{decided:lead})},'Mark the leading option as decided'):h('span',{class:'sm sec2'},'Tap an option to vote.'))),
    d.neededBy?h('div',{class:'sm sec2'},'Needed by '+fmtD(d.neededBy)):null,pend('decisions/'+d.id),chg(d,'intel'));
}
function viewIntel(){
  const cards=list('intel').sort(byOrder),decs=list('decisions'),gs=GROUPS.slice(),out=[attentionBox()];
  cards.concat(decs).forEach(d=>{if(d.group&&gs.indexOf(d.group)<0)gs.push(d.group)});
  let any=false;
  gs.forEach(g=>{
    const cs=cards.filter(d=>d.group===g),ds=decs.filter(d=>d.group===g);
    if(!cs.length&&!ds.length)return;any=true;
    out.push(h('section',null,secH(g),cs.map(infoItem),ds.map(decisionItem)));
  });
  if(!any)out.push(h('section',null,secH('Info'),h('div',{class:'empty'},'Nothing here yet. Add flights, booking numbers, phone numbers and addresses.')));
  out.push(addBtn('Add info',()=>intelSheet(null)));
  return out;
}

/* ---------- page ---------- */
function goInfo(id){UI.tab='intel';LS.set('bbc26.tab','intel');UI.focus=id;render()}
function header(ph){
  const w=me();
  const t=h('h1',null,'BBC26');
  let lp=null;const clr=()=>{clearTimeout(lp);lp=null};
  t.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{lp=null;phaseSheet()},650)});
  ['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>t.addEventListener(ev,clr));
  return h('header',{class:'top'},h('div',null,t,h('p',null,PH_NAME[ph]+(UI.ov?' (preview)':'')+' · Tenggol Island trip, 7 to 9 Oct')),
    h('button',{type:'button',class:'who','aria-label':'Settings',onclick:settingsSheet},w?NAME[w]:'Who are you?'));
}
function offBar(){
  if(isOffline())return h('div',{class:'off',role:'status'},'Offline. '+(S.liveAt?'Showing the last update from '+clockHM(S.liveAt)+'.':'Nothing saved on this phone yet.'));
  if(S.ro)return h('div',{class:'off'},'View only. Ask Soff for Contributor access.');
  return null;
}
function renderTabs(){
  tabsEl.replaceChildren(...TABS.map(([k,t])=>h('button',{type:'button',class:'tab','aria-current':UI.tab===k?'true':'false',onclick:()=>{if(k!==UI.tab){UI.tab=k;LS.set('bbc26.tab',k);window.scrollTo(0,0);render()}}},t,chanDot(k)?h('span',{class:'dot','aria-label':'New changes'}):null)));
}
function renderGate(){
  const need=uid&&!S.ro&&S.loaded.crew&&!me()&&!!db;
  gate.hidden=!need;
  if(!need){gate.replaceChildren();return}
  const sl=(S.crew&&S.crew.slots)||{};
  gate.replaceChildren(h('div',{class:'lbl'},'BBC26 trip dashboard'),h('h2',null,'Who are you?'),
    h('div',{class:'stack'},CREW.map(x=>{
      const taken=sl[x.c]&&sl[x.c]!==uid,sure=UI.gateConfirm===x.c;
      return h('button',{type:'button',class:'pick',onclick:()=>{if(taken&&!sure){UI.gateConfirm=x.c;renderGate();return}bind(x.c)}},
        h('span',{class:'badge'},x.c),x.n,h('small',null,sure?'Tap again to take over':taken?'Already in use':''));
    })),
    h('div',{class:'sec2'},'You only pick once on this phone. You can change it later in Settings.'));
}
const VIEWS={now:viewNow,ledger:viewLedger,intel:viewIntel};
function render(){
  const ph=phase(),y=window.scrollY;
  app.replaceChildren(...[].concat(offBar(),header(ph),VIEWS[UI.tab](ph)).flat(Infinity).filter(Boolean));
  window.scrollTo(0,y);
  renderTabs();renderGate();
  if(UI.focus){const f=document.getElementById('S-'+UI.focus);UI.focus=null;if(f){f.scrollIntoView({block:'center'})}}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}

async function boot(){
  loadCache();
  if(S.loaded.seen)TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);
  render();
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.pick')[+e.key-1];if(b)b.click()}});
  const C0=window.claude;
  try{user=C0&&C0.use?await C0.use('user'):null}catch(e){user=null}
  try{db=C0&&C0.use?await C0.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  render();
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.seenInit){S.seenInit=true;S.loaded.seen=true;TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);setTimeout(markSeen,2500)}
    sched();
  },err('seen'));
}
boot();
})();
