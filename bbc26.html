<title>BBC26 Trip Dashboard</title>
<style>
/* Code editor look: line numbers, syntax colours, folding. Matrix green and blue on near black. */
:root{
  --bg:#03100A; --bar:#06190F; --gut:#05130C; --gfg:#2A6A4E; --hi:#0A2D20; --edge:#0E3A28;
  --fg:#86DDAE; --tag:#1CFF8F; --atr:#3DD3FF; --str:#B4FFD6; --num:#5CE3FF; --cm:#3F8467; --pn:#2E7A5B; --dim:#6AAE92;
  --on:#03100A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--mono);padding-block:0 56px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--atr);outline-offset:1px}
i{font-style:normal}
@media (prefers-reduced-motion:reduce){.cur:after{animation:none!important}}

/* file tabs */
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;background:var(--bar);border-bottom:1px solid var(--edge)}
.tab{flex:1;min-width:0;min-height:44px;padding:0 6px;font-size:12.5px;color:var(--cm);border-top:2px solid transparent;border-right:1px solid var(--edge);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tab:last-child{border-right:0}
.tab[aria-current="true"]{background:var(--bg);color:var(--tag);border-top-color:var(--tag)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--atr);margin-left:6px;vertical-align:middle}

/* code */
.code{max-width:760px;margin:0 auto;padding-block:6px}
.ln{display:flex;align-items:stretch;min-height:22px}
.ln.hit{min-height:40px;cursor:pointer}
.ln.hi{background:var(--hi)}
.no{width:40px;flex:none;text-align:right;padding:1px 9px 0 0;color:var(--gfg);background:var(--gut);user-select:none;-webkit-user-select:none}
.ln.hit .no,.ln.hit .tx,.ln.hit .fd{padding-top:8px;padding-bottom:8px}
.ln.hi .no{color:var(--tag)}
.ln.chg .no{box-shadow:inset 3px 0 0 var(--atr)}
.fd{width:18px;flex:none;text-align:center;color:var(--gfg);background:var(--gut);user-select:none;padding-top:1px}
.ln.hit .fd{padding-top:8px}
.tx{flex:1;min-width:0;padding:1px 16px 1px calc(var(--i)*2ch + 6px);overflow-wrap:anywhere;word-break:break-word}
.cur:after{content:"\2588";color:var(--tag);margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.flash{animation:fl 1.6s ease-out 1}
@keyframes fl{0%{background:#14604A}100%{background:transparent}}

/* syntax */
.p{color:var(--pn)} .t{color:var(--tag)} .a{color:var(--atr)} .s{color:var(--str)} .c{color:var(--cm);font-style:italic} .x{color:var(--fg)} .n{color:var(--num)}
.v{color:var(--str);text-decoration:underline dotted;text-decoration-color:var(--cm);text-underline-offset:4px;padding:9px 0;margin:-9px 0;display:inline;font:inherit}
.act{color:var(--num);text-decoration:underline;text-underline-offset:4px;padding:9px 2px;margin:-9px 0}
.st-done,.st-confirmed,.st-ontrack,.st-allsquare,.st-chosen{color:var(--tag)}
.st-now,.st-ongoing{background:var(--tag);color:var(--on);padding:0 3px}
.st-next,.st-leading,.st-watch,.st-tight,.st-owing{color:var(--num)}
.st-planned,.st-tbc,.st-open,.st-nobudget,.st-decided{color:var(--dim)}
.st-over,.st-late,.st-overdue{background:var(--atr);color:var(--on);padding:0 3px}
.al{color:var(--on)}

/* status bar */
.sb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bar);border-top:1px solid var(--edge);color:var(--cm);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px env(safe-area-inset-bottom,0px);min-height:calc(40px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
.sb.warn{background:var(--atr);color:var(--on);font-weight:700}
.sb button{color:var(--tag);min-height:40px;padding:0 4px}
.sb.warn button{color:var(--on)}
.sb .mid{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sheet (command palette) */
.scrim{position:fixed;inset:0;background:rgba(0,6,3,.72);z-index:100}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bar);border-top:2px solid var(--tag);padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:inherit;color:var(--cm);font-style:italic}
.sheet h2:before{content:"// "}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.lab{color:var(--atr);font-size:12.5px}
.lab:after{content:":"}
.field input,.field select{font:inherit;color:var(--str);background:var(--bg);border:1px solid var(--edge);padding:8px 10px;min-height:44px;width:100%;border-radius:0;caret-color:var(--tag)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .p{flex:1}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--edge);color:var(--tag);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--bg)}
.btn:before{content:"[\00a0"}.btn:after{content:"\00a0]"}
.btn.p{background:var(--tag);color:var(--on);border-color:var(--tag)}
.btn.d{color:var(--cm)}
.btn.w{width:100%}
.sealbtn{min-width:56px;min-height:44px;border:1px solid var(--edge);color:var(--dim);display:inline-grid;place-items:center}
.sealbtn[aria-pressed="true"]{background:var(--tag);color:var(--on);border-color:var(--tag)}
.seals{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--tag);color:var(--on);padding:8px 12px;font-weight:700;z-index:120;max-width:calc(100% - 28px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:110;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;justify-content:center}
.gate .code{width:100%}
.gate .ln.hit{min-height:56px;font-size:16px}
</style>

<nav class="tabsbar" id="tabs" aria-label="Files"></nav>
<main class="code" id="code"></main>
<footer class="sb" id="sb"></footer>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['pre-trip','land','sea','return','after'];
const PH_NAME={pre:'Pre-trip',d1:'Day 1 Land',d2:'Day 2 Sea',d3:'Day 3 Return',post:'Post-trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions'];
const FILES=[['now','itinerary.html'],['ledger','ledger.html'],['intel','info.html']];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rmn=n=>{n=Math.round((+n||0)*100)/100;return Number.isInteger(n)?String(n):n.toFixed(2)};
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtS=s=>{const d=dp(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+'d '+hh+'h':hh?hh+'h '+pad(m%60)+'m':m+'m'}
const byOrder=(a,b)=>((a.order||0)-(b.order||0))||(a.id>b.id?1:-1);

const S={crew:null,trip:null,seen:null,loaded:{},pend:new Set(),liveAt:0,ro:false};
COLS.forEach(c=>S[c]={});
const UI={tab:LS.get('bbc26.tab')||'now',ov:LS.get('bbc26.phase')||'',open:{},base:{now:0,ledger:0,intel:0},focus:null,gateConfirm:null,row:1};
if(!FILES.some(f=>f[0]===UI.tab))UI.tab='now';
if(!PH_NAME[UI.ov])UI.ov='';
let db=null,user=null,uid=null,live=false;
const T0=Date.now();
const codeEl=document.getElementById('code'),tabsEl=document.getElementById('tabs'),sbEl=document.getElementById('sb'),host=document.getElementById('sheet-host'),toastEl=document.getElementById('toast'),gate=document.getElementById('gate');

function loadCache(){
  try{
    const c=JSON.parse(LS.get(CACHE_KEY)||'null');if(!c)return;
    COLS.forEach(k=>{if(c[k])S[k]=c[k]});
    S.crew=c.crew||null;S.trip=c.trip||null;S.seen=c.seen||null;S.liveAt=c.liveAt||0;
    if(c.uid)uid=c.uid;
    COLS.concat(['crew','trip','seen']).forEach(k=>S.loaded[k]=true);
  }catch(e){}
}
function saveCache(){
  try{const o={crew:S.crew,trip:S.trip,seen:S.seen,liveAt:S.liveAt,uid:uid};COLS.forEach(k=>o[k]=S[k]);LS.set(CACHE_KEY,JSON.stringify(o))}catch(e){}
}

const trip=()=>S.trip||{};
const start=()=>trip().startDate||'2026-10-07';
const end=()=>trip().endDate||addDays(start(),2);
const dayDate=i=>addDays(start(),DAYOFF[i]);
const list=n=>Object.values(S[n]);
function me(){const sl=S.crew&&S.crew.slots;if(!sl||!uid)return null;return CODES.find(c=>sl[c]===uid)||null}
function sealOf(id){if(CODES.indexOf(id)>=0)return id;const sl=S.crew&&S.crew.slots;if(!sl||!id)return null;return CODES.find(c=>sl[c]===id)||null}
function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';
  if(today===addDays(s,1))return 'd2';
  if(today<=end())return 'd3';
  return 'post';
}
const isOffline=()=>!navigator.onLine||!db&&(Date.now()-T0>3000)||(Date.now()-T0>6000&&!live);
function dueOf(d){
  if(!d.neededBy)return null;
  const diff=Date.parse(d.neededBy+'T23:59:59Z')-clock();
  return diff<0?'late':diff<=48*3600e3?'soon':null;
}
function attentionItems(){
  const out=[];
  list('intel').forEach(d=>{if(d.status==='TBC'){const s=dueOf(d);if(s)out.push({id:d.id,label:d.label,neededBy:d.neededBy,s})}});
  list('decisions').forEach(d=>{if(d.decided==null){const s=dueOf(d);if(s)out.push({id:d.id,label:d.question,neededBy:d.neededBy,s})}});
  return out.sort((a,b)=>(a.s===b.s?0:a.s==='late'?-1:1)||(a.neededBy>b.neededBy?1:-1));
}

/* change awareness */
const docsOf={
  now:()=>list('itinerary').concat(S.trip?[Object.assign({id:'trip'},S.trip)]:[]),
  ledger:()=>list('ledgerLines').concat(list('ledgerSpends'),list('settlements')),
  intel:()=>list('intel').concat(list('decisions'))
};
const others=d=>d&&uid&&d.updatedAt&&d.updatedBy&&d.updatedBy!=='seed'&&d.updatedBy!==uid&&d.updatedBy!==me();
const unseen=(d,ch)=>others(d)&&d.updatedAt>(UI.base[ch]||0);
const chanDot=ch=>ch!==UI.tab&&S.loaded.seen&&docsOf[ch]().some(d=>unseen(d,ch));
function markSeen(){
  if(!uid||!db||S.ro)return;
  enqueue('data/users/'+uid+'/seen',async()=>{
    const ref=db.doc('data/users/'+uid+'/seen'),t=Date.now(),v={tabs:{now:t,ledger:t,intel:t}};
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  },true);
}

const Q={};
function enqueue(path,fn,quiet){
  const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{if(!quiet)toast(e&&e.code==='invalid_argument'?'Not saved. You may only have view access.':'Not saved. Check your signal and try again.')});
  Q[path]=p;return p;
}
function guard(){
  if(!db){toast("Can't connect. Changes are paused.");return false}
  if(S.ro){toast('View only. Ask Soff for Contributor access.');return false}
  return true;
}
const stamp=()=>({updatedBy:uid,updatedAt:Date.now()});
function upd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).update(Object.assign({},data,stamp())))}
function setd(path,data){if(!guard())return;return enqueue(path,()=>db.doc(path).set(Object.assign({},data,stamp())))}
function del(path){if(!guard())return;return enqueue(path,()=>db.doc(path).delete())}
function upsert(path,data){
  if(!guard())return;
  return enqueue(path,async()=>{
    const ref=db.doc(path),v=Object.assign({},data,stamp());
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  });
}

let tT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function copy(v){
  const ok=()=>toast('Copied');
  const fb=()=>{try{const t=h('textarea',{value:v,style:'position:fixed;opacity:0'});document.body.append(t);t.select();document.execCommand('copy');t.remove();ok()}catch(e){toast('Select the text to copy it')}};
  try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}
}

/* ---------- sheets ---------- */
function closeSheet(){host.replaceChildren();document.removeEventListener('keydown',escClose)}
function escClose(e){if(e.key==='Escape')closeSheet()}
function openSheet(o){
  closeSheet();
  const vals={},els=[];
  (o.fields||[]).forEach(f=>{
    vals[f.k]=f.value;
    const id='sf-'+f.k;let ctl;
    if(f.t==='seal1'||f.t==='sealN'){
      ctl=h('div',{class:'seals'});
      const draw=()=>{ctl.replaceChildren(...CODES.map(c=>{
        const on=f.t==='seal1'?vals[f.k]===c:(vals[f.k]||[]).includes(c);
        return h('button',{type:'button',class:'sealbtn','aria-pressed':on?'true':'false','aria-label':NAME[c],onclick:()=>{
          if(f.t==='seal1')vals[f.k]=c;
          else{const a=(vals[f.k]||[]).slice(),i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);vals[f.k]=CODES.filter(x=>a.includes(x))}
          draw();
        }},c);
      }))};
      draw();els.push(h('div',{class:'field'},h('span',{class:'lab'},f.label),ctl));return;
    }
    if(f.t==='select'){
      ctl=h('select',{id});
      f.options.forEach(([v,t])=>{const op=h('option',{value:v},t);if(String(v)===String(f.value))op.selected=true;ctl.append(op)});
      ctl.addEventListener('change',()=>vals[f.k]=ctl.value);
    }else{
      ctl=h('input',{id,type:f.t==='date'?'date':'text',value:f.value==null?'':f.value,placeholder:f.ph||'',inputmode:f.im||null,autocomplete:'off',enterkeyhint:'done'});
      ctl.addEventListener('input',()=>vals[f.k]=ctl.value);
    }
    els.push(h('div',{class:'field'},h('label',{class:'lab',for:id},f.label),ctl));
  });
  let armed=false;
  const delBtn=o.onDelete?h('button',{type:'button',class:'btn d',onclick:()=>{if(!armed){armed=true;delBtn.textContent='tap again to delete';return}closeSheet();o.onDelete()}},'delete'):null;
  const save=()=>{const err=o.validate?o.validate(vals):null;if(err){toast(err);return}closeSheet();o.onSave(vals)};
  const sheet=h('div',{class:'sheet',role:'dialog','aria-label':o.title},
    h('h2',null,o.title),o.node||null,
    els.length?h('div',{class:'fields'},els):null,
    h('div',{class:'acts'},h('button',{type:'button',class:'btn',onclick:closeSheet},o.onSave?'cancel':'close'),delBtn,
      o.onSave?h('button',{type:'button',class:'btn p',onclick:save},o.saveLabel||'save'):null));
  host.append(h('div',{class:'scrim',onclick:closeSheet}),sheet);
  document.addEventListener('keydown',escClose);
  sheet.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&o.onSave){e.preventDefault();save()}});
  if(o.focus!==false){const f=sheet.querySelector('input,select');if(f)setTimeout(()=>f.focus(),60)}
}
function quick(title,value,save,o){
  o=o||{};
  openSheet({title:title,fields:[{k:'v',label:o.label||'value',value:value||'',im:o.im,ph:o.ph}],
    validate:v=>{if(!o.validate)return null;const r=o.validate((v.v||'').trim());return r===true?null:r},
    onSave:v=>{const t=(v.v||'').trim();if(t!==(value||''))save(o.norm?o.norm(t):t)}});
}
const hmValid=v=>v===''||(/^\d{1,2}:\d{2}$/.test(v)&&pm(v)<1440)?true:'Use HH:MM, like 07:40';
const hmNorm=v=>{const m=pm(v);return m==null?'':hmOf(m)};
function phaseSheet(){
  const opts=[['','auto (device clock)']].concat(Object.keys(PH_NAME).map(k=>[k,PH_NAME[k].toLowerCase()]));
  openSheet({title:'preview a phase',focus:false,node:h('div',{class:'fields'},opts.map(([k,t])=>h('button',{type:'button',class:'btn w'+(UI.ov===k?' p':''),onclick:()=>{UI.ov=k;LS.set('bbc26.phase',k);closeSheet();render()}},t)))});
}
function settingsSheet(){
  const meC=me();
  const taken=c=>{const sl=S.crew&&S.crew.slots;return sl&&sl[c]&&sl[c]!==uid};
  openSheet({title:'settings',focus:false,node:h('div',{class:'fields'},
    h('div',{class:'lab'},'you are'),
    h('div',{class:'acts'},CODES.map(c=>h('button',{type:'button',class:'btn'+(meC===c?' p':''),onclick:()=>{closeSheet();bind(c)}},c+' '+NAME[c].toLowerCase()+(taken(c)?' *':'')))),
    h('div',{class:'c'},'* used by someone else. picking it moves it to you.'))});
}
function bind(c){
  if(!uid){toast('Cannot tell who you are here');return}
  const sl=(S.crew&&S.crew.slots)||{},slots={};
  CODES.forEach(k=>{if(sl[k]===uid&&k!==c)slots[k]=null});
  slots[c]=uid;UI.gateConfirm=null;
  upsert('crew/members',{slots});
}

/* ---------- data helpers ---------- */
function events(){return list('itinerary').filter(s=>s.day!=null).sort((a,b)=>(a.day-b.day)||byOrder(a,b))}
function lateFor(s){return s.day===1?(trip().lateBy||0):0}
function evAt(s,endToo){
  let m=pm(endToo?s.end:s.start);
  if(m==null){const w=(s.when||'').toLowerCase();m=w.indexOf('night')>=0?1260:w.indexOf('even')>=0?1080:w.indexOf('mid')>=0?720:540}
  return Date.parse(dayDate(s.day)+'T00:00:00Z')+(m+lateFor(s))*6e4;
}
const timeStr=s=>s.start?((s.approx?'~':'')+hmOf(pm(s.start)+lateFor(s))+(s.end?'-'+hmOf(pm(s.end)+lateFor(s)):'')):(s.when||'tbc');
function itState(){
  const ev=events(),now=clock();
  let idx=-1;ev.forEach((s,i)=>{if(evAt(s)<=now)idx=i});
  const curActive=idx>=0&&!(ev[idx].end&&evAt(ev[idx],true)<now);
  return {ev,idx,cur:curActive?ev[idx]:null,nxt:ev[idx+1]||null,now};
}

      else upd('itinerary/'+s.id,Object.assign(data,{approx:data.start===s.start?!!s.approx:false}));

  });

function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}
const markSettled=t=>setd('settlements/'+newId(),{from:t.from,to:t.to,amount:t.amount,settled:true});

        const mine=my&&votes[my]===i,vs=CODES.filter(c=>votes[c]===i);
        ln(3,[open('option',[['votes',vs.join(' ')||'-'],mine?['you','yes']:null,decided&&d.decided===i?['chosen','yes',null,'st-chosen']:null,i===lead&&!decided?['lead','yes',null,'st-leading']:null]),text(t),close('option')],{hit:true,onclick:()=>{
          if(decided){toast('Already decided. Reopen to vote');return}
          if(!my){toast('Pick who you are in settings');return}
          upd('decisions/'+d.id,{votes:{[my]:mine?null:i}});
        }});
      });
      ln(3,[open('button'),decided?text('reopen vote',()=>upd('decisions/'+d.id,{decided:null})):(lead>=0?text('mark decided',()=>upd('decisions/'+d.id,{decided:lead})):h('i',{class:'c'},'tap an option to vote')),close('button')],{hit:true});
      ln(2,close('vote'));
    });
    ln(1,close('section'));
  });
  if(!any)ln(1,cm('nothing here yet. add flights, bookings, numbers and addresses.'));
  ln(1,[open('button'),text('add info',()=>intelSheet(null)),close('button')],{hit:true});
  ln(0,close('info'));
}

/* ---------- painting ---------- */
function paint(into,lines,opt){
  let n=0;
  into.replaceChildren(...lines.map(l=>{
    n++;
    const row=h('div',{class:'ln'+(l.hi?' hi':'')+(l.onclick||l.fold||l.hit?' hit':'')+(l.chg?' chg':''),'data-n':n,id:l.id?'L-'+l.id:null},
      h('span',{class:'no'},n),
      h('span',{class:'fd'},l.fold?(l.fold.open?'▾':'▸'):''),
      h('div',{class:'tx'+(l.cursor?' cur':''),style:'--i:'+l.ind},l.nodes));
    if(l.fold)row.addEventListener('click',e=>{if(e.target.closest('a,button'))return;UI.open[l.fold.key]=!l.fold.open;render()});
    else if(l.onclick)row.addEventListener('click',l.onclick);
    return row;
  }));
}
function renderTabs(){
  tabsEl.replaceChildren(...FILES.map(([k,t])=>h('button',{type:'button',class:'tab','aria-current':UI.tab===k?'true':'false',onclick:()=>{if(k!==UI.tab){UI.tab=k;LS.set('bbc26.tab',k);UI.row=1;window.scrollTo(0,0);render()}}},t,chanDot(k)?h('span',{class:'dot','aria-label':'new changes'}):null)));
}
function renderSb(){
  const off=isOffline();
  sbEl.className='sb'+(off?' warn':'');
  let lp=null;
  const w=me();
  if(off){sbEl.replaceChildren(h('span',{class:'mid'},'OFFLINE · '+(S.liveAt?'showing last update from '+clockHM(S.liveAt):'nothing saved yet')),h('button',{type:'button','aria-label':'Settings',onclick:settingsSheet},'['+(w||'?')+']'));return}
  const left=h('span',null,'Ln '+UI.row+', Col 1');
  const midTxt=S.ro?'view only':S.pend.size?'● not saved yet':'saved';
  sbEl.replaceChildren(left,h('span',{class:'mid'},midTxt+(UI.ov?' · preview':'')),h('button',{type:'button','aria-label':'Settings',onclick:settingsSheet},'['+(w||'?')+'] html'));
  left.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{lp=null;phaseSheet()},650)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>left.addEventListener(ev,()=>{clearTimeout(lp);lp=null}));
}
function goInfo(id){UI.tab='intel';LS.set('bbc26.tab','intel');UI.focus=id;if(S.decisions[id])UI.open['dec-'+id]=true;render()}
function renderGate(){
  const need=uid&&!S.ro&&S.loaded.crew&&!me()&&!!db;
  gate.hidden=!need;
  if(!need){gate.replaceChildren();return}
  const sl=(S.crew&&S.crew.slots)||{};
  const save=LN;LN=[];
  ln(0,cm('BBC26 trip dashboard'));
  ln(0,cm('who is opening this? tap your name. one time only.'));
  ln(0,open('login'));
  CREW.forEach(x=>{
    const taken=sl[x.c]&&sl[x.c]!==uid,sure=UI.gateConfirm===x.c;
    ln(1,[open('user',[['id',x.c]]),text(x.n),close('user'),taken?[' ',cm(sure?'tap again to take over':'in use')]:null],{hit:true,onclick:()=>{if(taken&&!sure){UI.gateConfirm=x.c;renderGate();return}bind(x.c)}});
  });
  ln(0,close('login'));
  LN[LN.length-1].cursor=true;
  const box=h('div',{class:'code'});
  paint(box,LN);gate.replaceChildren(box);LN=save;
}
const VIEWS={now:viewNow,ledger:viewLedger,intel:viewIntel};
function render(){
  const ph=phase();
  const y=window.scrollY;
  LN=[];VIEWS[UI.tab](ph);
  paint(codeEl,LN);
  window.scrollTo(0,y);
  renderTabs();renderSb();renderGate();
  if(UI.focus){const f=document.getElementById('L-'+UI.focus);UI.focus=null;if(f){f.scrollIntoView({block:'center'});f.classList.add('flash')}}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}

async function boot(){
  loadCache();
  if(S.loaded.seen)FILES.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);
  render();
  codeEl.addEventListener('click',e=>{const r=e.target.closest('.ln');if(r){UI.row=+r.dataset.n;const l=sbEl.firstChild;if(l&&!sbEl.classList.contains('warn'))l.textContent='Ln '+UI.row+', Col 1'}});
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.ln.hit')[+e.key-1];if(b)b.click()}});
  const C0=window.claude;
  try{user=C0&&C0.use?await C0.use('user'):null}catch(e){user=null}
  try{db=C0&&C0.use?await C0.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  render();
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.seenInit){S.seenInit=true;S.loaded.seen=true;FILES.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);setTimeout(markSeen,2500)}
    sched();
  },err('seen'));
}
boot();
})();
</script>
