<title>BBCGPT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Readable terminal: sans for words, mono only for times, amounts, plates and the prompt. Environment colour lives only in the horizon, progress bar, dividers and prompt path. */
@property --env{syntax:'<color>';inherits:true;initial-value:#A7B4C8}
:root{
  --bg:#06110E; --surface:#0C1E19; --line:#1F3D33; --line-2:#2E5A4B;
  --text:#E6F4EE; --text-2:#B9D6CA; --text-3:#9FC2B4;
  --mint:#7CF2C4; --on-mint:#04130E; --amber:#FFC857; --alert:#FF9C8F;
  --env:#A7B4C8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;letter-spacing:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--sans);padding-inline:16px;padding-block:0 190px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--mint)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
h1,h2,h3{margin:0}
.mo{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{font-size:14px;color:var(--text-3);margin-top:2px}
.dim{color:var(--text-3)}

#top,main{max-width:600px;margin-inline:auto}
#top{padding-top:14px}
.pr{font:500 13px/1.2 var(--mono);color:var(--mint)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.trow h1{font:600 22px/1.25 var(--sans);user-select:none;-webkit-user-select:none}
.who{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);font-weight:500;font-size:14px;white-space:nowrap}
.hz{position:relative;height:28px;margin-top:10px;border-bottom:1px solid var(--env);transition:--env 600ms}
.hz svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--env);stroke-width:1.5;opacity:0;transition:opacity 600ms}
.hz svg.on{opacity:.7}
.hz path{vector-effect:non-scaling-stroke}
.pg{display:flex;gap:3px;margin-top:10px;height:4px}
.sg{position:relative;height:4px;border-radius:2px;padding:0;min-width:6px}
.sg i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.sg:after{content:"";position:absolute;inset:-20px 0}
@media (prefers-reduced-motion:reduce){.hz,.hz svg{transition:none}}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.off{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--amber);color:var(--on-mint);padding:10px 12px;font-weight:600;text-align:center;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sect-h h2{font:600 18px/1.3 var(--sans)}
.sect-h .ct{font-size:14px;color:var(--text-3)}

/* hero */
.hero .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--text-3)}
.hero .cd{font:500 15px var(--mono);color:var(--mint);white-space:nowrap}
.hero .time{font:700 52px/1.05 var(--mono);color:var(--amber);margin-top:8px;font-variant-numeric:tabular-nums}
.hero .time.txt{font:700 32px/1.15 var(--sans)}
.hero h2{font:600 21px/1.3 var(--sans);margin-top:6px}
.badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.plate{font:700 14px var(--mono);color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:2px 10px}
.asg{font-size:14px;color:var(--text-2)}
.addr{color:var(--text-2);margin-top:10px}
.note{margin-top:6px}
.flag{margin-top:6px;color:var(--amber);font-weight:500}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);color:var(--text);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;background:transparent}
.btn.p{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.btn.w{width:100%}
.btn.d{color:var(--text-2)}
.btn.s{min-height:44px}
.lk{display:inline-flex;align-items:center;min-height:44px;color:var(--mint);font-weight:600;text-decoration:none;padding-right:16px}

/* itinerary */
.dh{font:500 14px var(--mono);color:var(--mint);padding:18px 0 4px}
.mdv{font:500 14px var(--mono);padding:14px 0 2px;text-align:center}
.st{border-top:1px solid var(--line)}
.st.nxt{background:rgba(255,200,87,.09);border-left:3px solid var(--amber);border-radius:0 12px 12px 0;padding-left:10px;margin-inline:-4px 0}
.st.cur{border-left:3px solid var(--mint);padding-left:10px}
.sr{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;width:100%;min-height:56px;padding:12px 0}
.sr .tm{font:500 15px/1.5 var(--mono);color:var(--text-3)}
.sr .tm.lbl{font:500 13px/1.4 var(--sans)}
.st.nxt .tm{color:var(--amber)}
.sr .ttl{display:block;font:500 16px/1.4 var(--sans);color:var(--text)}
.sr .pl{display:block;font-size:14px;color:var(--text-3)}
.sr .ck{color:var(--mint);font-size:16px}
.st.done{opacity:.5}
.ex{margin-left:64px;padding:0 0 14px}
.ex .btns{margin-top:10px}
.ex .fb{font-size:14px;margin-top:4px}
.more{display:block;width:100%;min-height:48px;text-align:center;color:var(--mint);font-weight:600;margin-top:6px}

/* ledger + info */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile .k{font-size:13px;color:var(--text-3)}
.tile .v{font:700 22px/1.3 var(--mono);color:var(--text);overflow-wrap:anywhere}
.tile .v.bad{color:var(--alert)}
.card h3{font:600 18px/1.3 var(--sans)}
.li{padding:14px 0;border-top:1px solid var(--line)}
.card h3+.li{border-top:0;padding-top:8px}
.lr{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lr .nm{font:500 16px/1.4 var(--sans)}
.amt{font:500 16px var(--mono);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.o i{background:var(--alert)}
.over{color:var(--alert)}
.badge{flex:none;width:36px;height:36px;border-radius:50%;background:var(--line);display:inline-grid;place-items:center;font-weight:600;font-size:13px}
.sp{display:flex;gap:12px;align-items:flex-start}
.sp .bd{flex:1;min-width:0}
.it{padding:14px 0;border-top:1px solid var(--line)}
.card h3+.it{border-top:0;padding-top:8px}
.it .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.it .lb{font-size:14px;color:var(--text-3)}
.it .vv{font:600 17px/1.4 var(--sans);margin-top:2px;overflow-wrap:anywhere}
.it .vv.tbc{color:var(--text-2);font-weight:500}
.pil{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--line-2);color:var(--text-2)}
.pil.ok{background:rgba(124,242,196,.14);border-color:transparent;color:var(--mint)}
.pil.bad{background:rgba(255,156,143,.15);border-color:transparent;color:var(--alert)}
.links{display:flex;flex-wrap:wrap;margin-top:2px}
.opt{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 0;border-top:1px solid var(--line)}
.opt .rb{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-3);flex:none}
.opt.mine .rb{border-color:var(--mint);background:radial-gradient(var(--mint) 0 40%,transparent 45%)}
.opt.dim{opacity:.6}
.empty{padding:6px 0;color:var(--text-2)}
.ar{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:52px;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.card h3+.ar{border-top:0}
.ar .pil{flex:none}

/* tab bar, chat */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--text-3);text-align:center;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--mint)}
.tab .nd{position:absolute;top:10px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--mint)}
.cpill{position:fixed;left:16px;right:16px;max-width:568px;margin-inline:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:48px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);color:var(--text-2);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px;z-index:39}
.cpill svg{width:20px;height:20px;stroke:var(--mint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chat{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line-2);padding:10px 12px;display:flex;gap:8px;z-index:41;max-width:640px;margin-inline:auto}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:0 14px;min-height:48px}
.chat input::placeholder{color:var(--text-3)}
.chat .btn{min-width:76px}
.icb{width:44px;min-height:48px;display:inline-grid;place-items:center;color:var(--text-2);font-size:20px}
.chatp{position:fixed;left:0;right:0;margin-inline:auto;width:100%;max-width:640px;bottom:calc(132px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:16px 16px 0 0;padding:6px 16px 14px;z-index:39;display:flex;flex-direction:column;gap:12px}
.ch-h{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-6px;background:var(--surface);padding-block:4px;font:500 13px var(--mono);color:var(--mint);z-index:1}
.cm{white-space:pre-wrap;overflow-wrap:anywhere}
.cm.me{color:var(--mint)}
.cm.cf{border:1px solid var(--amber);border-radius:12px;padding:10px 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* sheets, toast, gate */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:600 20px/1.3 var(--sans)}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:14px;color:var(--text-3)}
.field input,.field select{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:0 14px;min-height:48px;width:100%}
.names{display:flex;gap:10px;flex-wrap:wrap}
.nb{min-height:48px;padding:0 18px;border:1px solid var(--line-2);border-radius:12px;font-weight:500}
.nb[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;z-index:120;max-width:calc(100% - 32px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:110;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.gate>*{width:100%;max-width:420px;margin-inline:auto}
.gate .pr{font-size:13px}
.gate h2{font:600 28px/1.25 var(--sans)}
.pick{display:flex;align-items:center;gap:16px;min-height:68px;padding:12px 18px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);font:600 20px var(--sans);width:100%}
.pick .badge{width:44px;height:44px;background:var(--mint);color:var(--on-mint);font-size:15px}
.pick small{margin-left:auto;font:400 14px var(--sans);color:var(--text-3);text-align:right}

.chg{color:var(--mint)}.pend{color:var(--amber)}

.own{font-size:14px;color:var(--text-2);margin-top:2px}
.own.no{color:var(--amber)}
.rd .bar{margin-top:10px}
.rd .tl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rd .big{font:700 22px var(--mono)}
.cp{display:grid;grid-template-columns:20px 1fr;gap:0 12px;padding:10px 0;border-top:1px solid var(--line)}
.cp .dt{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--text-3)}
.cp .dt.ok{background:var(--mint)}.cp .dt.low{background:var(--amber)}.cp .dt.bad{background:var(--alert)}
.cp .ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cp .bf{font:500 14px var(--mono)}
.cp .bf.low{color:var(--amber)}.cp .bf.bad{color:var(--alert)}.cp .bf.ok{color:var(--mint)}
.dr{display:block;font:500 12px var(--mono);color:var(--text-3);text-align:right}
.dr.late{color:var(--amber)}
.vs{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;font-size:14px;align-items:baseline}
.vs .h{color:var(--text-3);font-size:13px}
.vs .mo{font-size:14px}
.dg{padding:8px 0;border-top:1px solid var(--line)}
.why{margin-top:4px;color:var(--text-2)}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.abt h3{font:600 15px var(--sans);color:var(--mint);margin-top:6px}
.abt p{margin:2px 0 8px;color:var(--text-2)}
.fb{padding:10px 0;border-top:1px solid var(--line)}
.field textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;min-height:96px;width:100%}
.ph{display:block;width:calc(100% + 40px);margin:-20px -20px 14px;max-width:none;aspect-ratio:16/9;object-fit:cover;border-radius:15px 15px 0 0;background:var(--line)}
.ph.sm{width:100%;margin:0 0 12px;border-radius:12px}
</style>

<header id="top">
  <div class="pr" id="pr">bbc26 ~/urban</div>
  <div class="trow"><h1 id="ttl">BBCGPT</h1><button type="button" class="who" id="who" aria-label="Settings">Pick who you are</button></div>
  <div class="hz" id="hz" aria-hidden="true"></div>
  <div class="pg" id="pg" role="group" aria-label="Trip progress"></div>
</header>
<main id="app"></main>
<div class="chatp" id="chatp" hidden></div>
<form class="chat" id="chat" autocomplete="off" hidden><button type="button" class="icb" id="chat-x" aria-label="Close chat">&#10005;</button><input id="chat-in" type="text" placeholder="Ask or tell me what changed" enterkeyhint="send" aria-label="Message BBCGPT" disabled><button type="submit" id="chat-go" class="btn p" disabled>Send</button></form>
<button type="button" class="cpill" id="chat-pill" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask BBCGPT or tell it what changed</button>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['Before','Land','Sea','Return','After'];
const PH_NAME={pre:'Before the trip',d1:'Day 1, Land',d2:'Day 2, Sea',d3:'Day 3, Return',post:'After the trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions','feedback'];
const TABS=[['now','Itinerary'],['ledger','Ledger'],['intel','Info']];
const ICONS={now:'<path d="M12 3a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/><circle cx="12" cy="9" r="2"/>',ledger:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',intel:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
const BARS=['lime','rose','blue','amber','teal'];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const n0=x=>{x=Math.round((+x||0)*100)/100;return x.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(x)?0:2,maximumFractionDigits:2})};
const n2=x=>(Math.round((+x||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtS=s=>{const d=dp(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+' d '+hh+' h':hh?hh+' h '+m%60+' min':m+' min'}

function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';
  if(today===addDays(s,1))return 'd2';
  if(today<=end())return 'd3';
  return 'post';
}

function enqueue(path,fn,quiet){

}

/* ---------- itinerary data ---------- */
function events(){return list('itinerary').filter(s=>s.day!=null).sort((a,b)=>(a.day-b.day)||byOrder(a,b))}
function lateFor(s){return s.day===1?(trip().lateBy||0):0}
function evAt(s,endToo){
  let m=pm(endToo?s.end:s.start);
  if(m==null){const w=(s.when||'').toLowerCase();m=w.indexOf('night')>=0?1260:w.indexOf('even')>=0?1080:w.indexOf('mid')>=0?720:540}
  return Date.parse(dayDate(s.day)+'T00:00:00Z')+(m+lateFor(s))*6e4;
}
const timeStr=s=>s.start?((s.approx?'~':'')+hmOf(pm(s.start)+lateFor(s))+(s.end?'-'+hmOf(pm(s.end)+lateFor(s)):'')):(s.when||'TBC');
function itState(){
  const ev=events(),now=clock();
  let idx=-1;ev.forEach((s,i)=>{if(evAt(s)<=now)idx=i});
  const curActive=idx>=0&&!(ev[idx].end&&evAt(ev[idx],true)<now);
  return {ev,idx,cur:curActive?ev[idx]:null,nxt:ev[idx+1]||null,now};
}
/* ---------- ledger data ---------- */
function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}

const isDone=(s)=>!!s.done;
function pendingStop(st){
  const {ev,now}=st,pend=ev.filter(s=>!isDone(s));
  return pend.find(s=>(s.end?evAt(s,true):evAt(s)+3600e3)>=now)||pend[0]||null;
}
/* env at a given stop: latest milestone at or before it, else the first milestone, else urban */
function envOf(ev,s){
  const i=s?ev.indexOf(s):-1;let e=null;
  for(let k=Math.min(Math.max(i,0),ev.length-1);k>=0;k--)if(ev[k].milestone&&ENVS[ev[k].env]){e=ev[k].env;break}
  if(!e){const m=ev.find(x=>x.milestone&&ENVS[x.env]);e=m?m.env:'urban'}
  return e;
}
function legs(ev){
  const ms=ev.map((s,i)=>s.milestone&&ENVS[s.env]?i:-1).filter(i=>i>=0);
  if(!ms.length)return [{env:'urban',from:0,to:ev.length}];
  return ms.map((i,k)=>({env:ev[i].env,from:k===0?0:i,to:k+1<ms.length?ms[k+1]:ev.length,sid:ev[i].id}));
}

const CODEIN=v=>CODES.indexOf(v)>=0;
function chatToolList(ans){
  const note=t=>{ans.log.push(t);renderChat()};
  return [
    {name:'save_doc',description:'Create or update one record in the trip database. Fields are merged into the record if it exists, otherwise a new record is created. Use null to clear a field. Returns a short confirmation or an error.',
     inputSchema:{type:'object',properties:{collection:{type:'string',enum:WRITABLE},id:{type:'string',description:'An existing id from the data, or a new short lowercase id (letters, digits, dashes). Use trip for meta.'},fields:{type:'object',description:'Fields to set'}},required:['collection','id','fields']},
     async execute(input){
       const col=String(input.collection||''),id=String(input.id||''),f=input.fields;
       if(WRITABLE.indexOf(col)<0)throw new Error('Not allowed to write '+col);
       if(!/^[A-Za-z0-9_-]{1,60}$/.test(id))throw new Error('Bad id. Use letters, digits and dashes only.');
       if(!f||typeof f!=='object'||Array.isArray(f))throw new Error('fields must be an object');
       const fields={};for(const k in f){if(k!=='updatedBy'&&k!=='updatedAt'&&k!=='id')fields[k]=f[k]}
       if(col==='meta'){
         if(id!=='trip')throw new Error('meta only has the record trip');
         Object.keys(fields).forEach(k=>{if(['lateBy','checkInTime','startDate','endDate'].indexOf(k)<0)delete fields[k]});
         if(!Object.keys(fields).length)throw new Error('Nothing to save. Allowed: lateBy, checkInTime, startDate, endDate');
         if('lateBy' in fields)fields.lateBy=Math.max(0,Math.round(+fields.lateBy||0));
         await writeDoc('meta/trip',fields);note('Saved trip settings');return 'Saved meta/trip';
       }
       const exists=!!S[col][id];
       ['start','end'].forEach(k=>{if(fields[k]!=null&&fields[k]!==''&&pm(fields[k])==null)throw new Error(k+' must be HH:MM, 24 hour')});
       if(fields.status==='Confirmed'&&!fields.confirmedBy)fields.confirmedBy=me()||uid||null;
       if(fields.status==='TBC')fields.confirmedBy=null;
       if('paidBy' in fields&&!CODEIN(fields.paidBy))throw new Error('paidBy must be SF, AR or SH');
       if('splitBetween' in fields&&(!Array.isArray(fields.splitBetween)||!fields.splitBetween.length||!fields.splitBetween.every(CODEIN)))throw new Error('splitBetween must be a non-empty list of SF, AR, SH');
       if('amount' in fields&&!(+fields.amount>0))throw new Error('amount must be a number above 0');
       if(!exists){
         if(col==='itinerary'){if(!fields.title||!(fields.day>=0&&fields.day<=4))throw new Error('New itinerary stop needs title and day 0 to 4');fields.day=Math.round(fields.day);if(fields.order==null)fields.order=Math.max.apply(null,events().filter(x=>x.day===fields.day).map(x=>x.order||0).concat([0]))+1}
         else if(col==='intel'){if(!fields.label||fields.value==null||!fields.group)throw new Error('New info needs label, value and group');if(!fields.kind)fields.kind='text';if(!fields.status)fields.status='TBC';if(fields.order==null)fields.order=Date.now()}
         else if(col==='ledgerLines'){if(!fields.item)throw new Error('New budget line needs item');if(!fields.category)fields.category='Other';if(!('budget' in fields))fields.budget=null;if(fields.order==null)fields.order=Math.max.apply(null,list('ledgerLines').map(x=>x.order||0).concat([0]))+1}
         else if(col==='ledgerSpends'){if(!(+fields.amount>0)||!CODEIN(fields.paidBy))throw new Error('New spend needs amount and paidBy');fields.amount=Math.round(+fields.amount*100)/100;if(fields.lineId==null)fields.lineId='';if(!fields.splitBetween)fields.splitBetween=CODES.slice();if(!fields.at)fields.at=Date.now()}
         else if(col==='settlements'){if(!CODEIN(fields.from)||!CODEIN(fields.to)||fields.from===fields.to||!(+fields.amount>0))throw new Error('New settlement needs from, to (different) and amount');fields.amount=Math.round(+fields.amount*100)/100;if(fields.settled==null)fields.settled=true}
         else if(col==='decisions'){if(!fields.question||!Array.isArray(fields.options)||fields.options.length<2)throw new Error('New decision needs question and 2 or more options');if(!fields.group)fields.group='Getting home';if(!fields.votes)fields.votes={}}
       }
       await writeDoc(col+'/'+id,fields);
       const nm=(S[col][id]&&(S[col][id].title||S[col][id].label||S[col][id].item||S[col][id].question))||fields.title||fields.label||fields.item||fields.question||id;
       note((exists?'Updated ':'Added ')+col+': '+nm);
       return (exists?'Updated ':'Added ')+col+'/'+id;
     }},
    {name:'delete_doc',description:'Ask to delete one record. This does not delete anything yet: the user must tap Confirm in the chat panel. Only use when the user clearly asked to remove something.',
     inputSchema:{type:'object',properties:{collection:{type:'string',enum:['itinerary','intel','decisions','ledgerLines','ledgerSpends','settlements']},id:{type:'string'}},required:['collection','id']},
     async execute(input){
       const col=String(input.collection||''),id=String(input.id||''),d=(S[col]||{})[id];
       if(['itinerary','intel','decisions','ledgerLines','ledgerSpends','settlements'].indexOf(col)<0||!d)throw new Error('No such record');
       PENDDEL.push({col:col,id:id,label:d.title||d.label||d.item||d.question||(d.amount?rm(d.amount)+' spend':id)});renderChat();
       return 'Queued. Nothing is deleted yet. Tell the user to tap Confirm in the panel.';
     }}
  ];
}
function renderChat(){
  chatLayout();
  if(!UI.chatOpen||(!MSGS.length&&!PENDDEL.length)){chatp.hidden=true;return}
  chatp.hidden=false;
  const near=chatp.scrollHeight-chatp.scrollTop-chatp.clientHeight<80;
  chatp.replaceChildren(...[
    h('div',{class:'ch-h'},h('span',null,'> bbcgpt'),h('span',{class:'acts'},
      MSGS.length&&!chatBusy?h('button',{type:'button',class:'lk',onclick:()=>{MSGS.length=0;TURNS.length=0;PENDDEL.length=0;UI.chatOpen=false;renderChat()}},'clear'):null,
      h('button',{type:'button',class:'lk',onclick:()=>{UI.chatOpen=false;renderChat()}},'close'))),
    MSGS.map(m=>m.role==='user'?h('div',{class:'cm me'},'> '+m.text):h('div',{class:'cm ai'},m.log.map(l=>h('div',{class:'dim'},'✓ '+l)),m.text?h('div',{class:'tx'},m.text):(m.pending?h('div',{class:'dim'},'Thinking...'):null))),
    PENDDEL.map((p,i)=>h('div',{class:'cm cf'},'Delete "'+p.label+'" for good?',h('div',{class:'acts',style:'margin-top:6px'},
      h('button',{type:'button',class:'btn s',onclick:()=>{
        if(!guard())return;
        enqueue(p.col+'/'+p.id,()=>db.doc(p.col+'/'+p.id).delete());
        MSGS.push({role:'ai',text:'Deleted "'+p.label+'".',log:[]});PENDDEL.splice(PENDDEL.indexOf(p),1);renderChat()}},'Confirm'),
      h('button',{type:'button',class:'btn s d',onclick:()=>{PENDDEL.splice(PENDDEL.indexOf(p),1);renderChat()}},'Keep it'))))
  ].flat(Infinity).filter(Boolean));
  if(near)chatp.scrollTop=chatp.scrollHeight;
}
const CHAT_ERR={not_granted:'Chat needs permission to use Claude. Reload this page and allow it.',sampling_disabled:'Claude is not available on this account.',rate_limited:'Too many requests or your usage limit is reached. Try again in a bit.',session_expired:'Sign in again, then retry.',refused:'Claude declined that one. Try rewording it.',empty_completion:'Claude sent nothing back. Try rewording it.',prompt_too_large:'Too much data to send. Try a shorter message.',upstream_error:'Connection problem. Try again.'};
async function sendChat(text){
  text=(text||'').trim();
  if(!text||chatBusy||!sampleFn)return;
  UI.chatOpen=true;chatBusy=true;chatCtl=new AbortController();
  TURNS.push({role:'user',content:text});MSGS.push({role:'user',text:text});
  const ans={role:'ai',text:'',log:[],pending:true};MSGS.push(ans);
  chatSync();renderChat();
  let hist=TURNS.slice(-8);while(hist.length&&hist[0].role!=='user')hist.shift();
  try{
    const o={modelTier:'default',signal:chatCtl.signal,onText:u=>{ans.text=u.text;renderChat()}};
    if(chatTools)o.tools=chatToolList(ans);
    const r=await sampleFn([{role:'user',content:chatRules()}].concat(hist),o);
    ans.text=r.text;TURNS.push({role:'assistant',content:r.text});
  }catch(e){
    if(e&&e.text)ans.text=e.text;
    if(!e||e.code!=='cancelled')ans.text=(ans.text?ans.text+'\n\n':'')+(CHAT_ERR[e&&e.code]||'Something went wrong. Try again.');
    else ans.text=(ans.text?ans.text+'\n\n':'')+'Stopped.';
    if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared')){sampleFn=null;chatSync()}
  }finally{chatBusy=false;ans.pending=false;chatSync();renderChat();render()}
}
function chatSync(){
  chatLayout();
  chatIn.disabled=chatBusy||!sampleFn;
  chatGo.textContent=chatBusy?'Stop':'Send';chatGo.disabled=!sampleFn;
  chatIn.placeholder=chatBusy?'Working...':'Ask or tell me what changed';
}
chatF.addEventListener('submit',e=>{
  e.preventDefault();
  if(chatBusy){if(chatCtl)chatCtl.abort();return}
  const t=chatIn.value;chatIn.value='';sendChat(t);
});
const chatPill=document.getElementById('chat-pill');
function chatLayout(){chatF.hidden=!UI.chatOpen;chatPill.hidden=UI.chatOpen||!sampleFn}
function openChat(){UI.chatOpen=true;renderChat();setTimeout(()=>chatIn.focus(),30)}
chatPill.addEventListener('click',openChat);
document.getElementById('chat-x').addEventListener('click',()=>{UI.chatOpen=false;renderChat()});

/* ---------- page ---------- */
function goInfo(id){UI.tab='intel';LS.set('bbc26.tab','intel');UI.focus=id;render()}
function offBar(){
  if(isOffline())return h('div',{class:'off',role:'status'},'Offline. '+(S.liveAt?'Showing the last update from '+clockHM(S.liveAt)+'.':'Nothing saved on this phone yet.'));
  return null;
}
function renderTabs(){
  tabsEl.replaceChildren(...TABS.map(([k,t])=>{
    const b=h('button',{type:'button',class:'tab','aria-current':UI.tab===k?'true':'false',onclick:()=>{if(k!==UI.tab){UI.tab=k;LS.set('bbc26.tab',k);window.scrollTo(0,0);render()}}},
      h('span',{class:'ic'}),t,chanDot(k)?h('i',{class:'nd','aria-label':'New changes'}):null);
    b.firstChild.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px">'+ICONS[k]+'</svg>';
    return b;
  }));
}
function renderGate(){
  const need=uid&&!S.ro&&S.loaded.crew&&!me()&&!!db;
  gate.hidden=!need;
  if(!need){gate.replaceChildren();return}
  const sl=(S.crew&&S.crew.slots)||{};
  gate.replaceChildren(h('div',{class:'pr'},'bbc26 ~/'),h('h2',null,'Who are you?'),
    h('div',{class:'stack'},CREW.map((x,i)=>{
      const taken=sl[x.c]&&sl[x.c]!==uid,sure=UI.gateConfirm===x.c;
      return h('button',{type:'button',class:'pick',onclick:()=>{if(taken&&!sure){UI.gateConfirm=x.c;renderGate();return}bind(x.c)}},
        h('span',{class:'badge'},x.c),x.n,h('small',null,sure?'tap again to take over':taken?'already in use':''));
    })),
    h('div',{class:'dim'},'You only pick once on this phone. You can change it later in Settings.'));
}
const VIEWS={now:viewNow,ledger:viewLedger,intel:viewIntel};
function render(){
  const ph=phase(),y=window.scrollY,st=itState(),tgt=pendingStop(st);
  renderTop(st,tgt);
  app.replaceChildren(...[].concat(offBar(),sampleFn?null:h('div',{class:'sub'},'Read only here. To change anything, tell Claude in your own chat.'),VIEWS[UI.tab](ph,st,tgt),h('div',{class:'foot'},h('button',{type:'button',class:'lk',onclick:aboutSheet},'About BBCGPT'),h('button',{type:'button',class:'lk',onclick:feedbackSheet},'Suggest a change'))).flat(Infinity).filter(Boolean));
  window.scrollTo(0,y);
  renderTabs();renderGate();chatLayout();
  if(UI.focus){const f=document.getElementById('S-'+UI.focus);UI.focus=null;if(f)f.scrollIntoView({block:'center'})}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}

async function boot(){
  loadCache();
  if(S.loaded.seen)TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);
  render();
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.pick')[+e.key-1];if(b)b.click()}});
  const C0=window.claude;
  try{user=C0&&C0.use?await C0.use('user'):null}catch(e){user=null}
  try{db=C0&&C0.use?await C0.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  try{sampleFn=C0&&C0.use?await C0.use('sample'):null}catch(e){sampleFn=null}
  if(sampleFn){try{const lim=await sampleFn.limits();chatTools=!!(lim&&lim.tools)}catch(e){chatTools=false}}
  chatSync();
  render();
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.seenInit){S.seenInit=true;S.loaded.seen=true;TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);setTimeout(markSeen,2500)}
    sched();
  },err('seen'));
}
boot();
})();
