<title>BBCGPT</title>
<style>
/* Compact monospace tables, coloured group bars, totals in the header row, dashed dividers. Dark by default, light in Settings. */
:root{
  --bg:#050F0C; --panel:#08160F; --line:#1D4236; --dash:#1E4A3A;
  --fg:#FFE23F; --dim:#D8BD3A; --head:#7FD8FF; --hi:#FFF37A;
  --lime:#8DBB3A; --rose:#C2506F; --blue:#6F96E8; --amber:#D8A24A; --teal:#3DB89C;
  --ok:#9BFFB0; --warn:#FF9E8F; --amb:#FFA94D; --acc:#3DB89C; --on:#04110C;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F8F5; --panel:#FFFFFF; --line:#BCD2C6; --dash:#CBDCD3;
  --fg:#2E2600; --dim:#6B5A12; --head:#1B4FB5; --hi:#000000;
  --lime:#5E8A12; --rose:#A02D50; --blue:#3B5FC4; --amber:#A8710F; --teal:#187E6A;
  --ok:#1C7A44; --warn:#A83A2E; --amb:#8A4B00; --acc:#187E6A; --on:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--mono);padding-inline:16px;padding-block:0 64px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--head)}
:focus-visible{outline:2px solid var(--head);outline-offset:1px}
main{max-width:640px;margin:0 auto;border-inline:1px solid var(--line);padding:0 8px 8px;min-height:60vh}

.off{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--amb);color:var(--bg);padding:6px 10px;font-weight:700;text-align:center;margin-inline:-8px}
.hd{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.hd b{color:var(--hi);font-size:15px;user-select:none;-webkit-user-select:none}
.hd .ph{flex:1;min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{min-height:44px;padding:0 4px;color:var(--head);font-weight:700}
.pt{color:var(--head);font-size:14px;margin:20px 0 8px}
.pt:before{content:"> "}
.pt span{color:var(--dim);font-size:12px;margin-left:8px}
.dim{color:var(--dim)} .hi{color:var(--hi)} .head{color:var(--head)} .ok{color:var(--ok)} .warn{color:var(--warn)} .amb{color:var(--amb)}
.r{text-align:right;font-variant-numeric:tabular-nums}

/* group blocks */
.grp{border-left:5px solid var(--c,var(--lime));margin-top:18px}
.c-lime{--c:var(--lime)}.c-rose{--c:var(--rose)}.c-blue{--c:var(--blue)}.c-amber{--c:var(--amber)}.c-teal{--c:var(--teal)}
.gh,.rw{display:grid;column-gap:8px;align-items:start;padding:8px 6px 8px 10px;min-width:0}
.gh{color:var(--head);border-bottom:1px solid var(--line);position:relative;min-height:40px;align-items:center;width:100%}
.gh:after{content:"";position:absolute;left:0;bottom:-1px;width:34%;height:1px;background:var(--c)}
.rw{border-top:1px dashed var(--dash);min-height:40px}
.rw.go{cursor:pointer}
.rw:first-of-type{border-top:0}
.rw.static{cursor:default}
.rw>div{min-width:0;overflow-wrap:anywhere}
.mk{color:var(--head)}
.n{color:var(--dim)}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.sub a{color:var(--head)}
.t-it .gh,.t-it .rw{grid-template-columns:10.5ch minmax(0,1fr) auto}
.t-led .gh,.t-led .rw{grid-template-columns:1.6ch minmax(0,1fr) 8.4ch 8.4ch 8.4ch;column-gap:5px;font-size:12px}
.t-led .x{grid-column:2/-1}
.t-sp .rw{grid-template-columns:3ch minmax(0,1fr) auto}
.row-now{background:rgba(141,187,58,.14)}
.row-nxt{background:rgba(111,150,232,.14)}
.row-past .tt,.row-past .tm{color:var(--dim)}
.tt{color:var(--hi)}
.tm{color:var(--fg)}
.st-done{color:var(--dim)} .st-now{color:var(--lime);font-weight:700} .st-next{color:var(--head);font-weight:700} .st-planned{color:var(--dim)} .st-tbc{color:var(--amb)} .st-ok{color:var(--ok)} .st-bad{color:var(--warn);font-weight:700}
.fold{width:100%;display:grid}
.chg{color:var(--head)}
.pend{color:var(--amb)}

.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.big{font-size:20px;line-height:1.2;color:var(--hi);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);min-width:0}
.tile .k{color:var(--head);font-size:12px}
.tile .v{color:var(--hi);font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:6px;color:var(--hi);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--panel)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.btn.s{min-height:40px;padding:0 10px}
.btn.w{width:100%}
.btn.d{color:var(--dim)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acts .p{flex:1}
.lk{color:var(--head);text-decoration:underline;text-underline-offset:3px;min-height:36px;display:inline-flex;align-items:center;padding:0 2px}
.links{display:flex;flex-wrap:wrap;gap:0 14px}
.over{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.w i{background:var(--amb)} .bar.b i{background:var(--warn)}

/* info rows */
.rw.blk{display:block}
.rw.blk .l{display:flex;justify-content:space-between;gap:10px;color:var(--dim)}
.rw.blk .v{color:var(--hi);font-size:15px;margin:2px 0;overflow-wrap:anywhere;display:block;min-height:26px}
.rw.blk .v.tbc{color:var(--amb)}
.opt{display:flex;gap:10px;width:100%;min-height:40px;padding:6px 0;align-items:center;border-top:1px dashed var(--dash)}
.opt .rb{color:var(--head)}
.opt.dim{color:var(--dim)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{min-height:48px;text-align:center;color:var(--dim);font-size:14px;border-top:2px solid transparent;margin-top:-1px;position:relative}
.tab[aria-current="true"]{color:var(--hi);border-top-color:var(--lime)}
.tab i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--head);margin-left:6px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:15px;color:var(--head);font-weight:700}
.sheet h2:before{content:"> "}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.field>.lab{color:var(--dim);font-size:12px}
.field input,.field select{font:inherit;color:var(--hi);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;width:100%}
.names{display:flex;gap:8px;flex-wrap:wrap}
.nb{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:6px;color:var(--fg)}
.nb[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.stack{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--hi);color:var(--bg);padding:8px 12px;border-radius:6px;z-index:120;max-width:calc(100% - 32px);text-align:center;display:none}
.toast.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:110;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.gate>*{width:100%;max-width:420px;margin-inline:auto}
.pick{display:grid;grid-template-columns:3ch 1fr auto;gap:12px;align-items:center;min-height:56px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:16px;color:var(--hi)}
.pick small{color:var(--dim);font-size:12px}
</style>

<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet-host"></div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
'use strict';
const CREW=[{c:'SF',n:'Soff'},{c:'AR',n:'Arif'},{c:'SH',n:'Shereef'}];
const CODES=CREW.map(x=>x.c);
const NAME=Object.fromEntries(CREW.map(x=>[x.c,x.n]));
const GROUPS=['Getting there','Stay','Dive day','Getting home','People','Flights','Bookings'];
const KINDS=[['text','Text'],['address','Address'],['phone','Phone'],['ref','Reference'],['time','Time']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYOFF=[-1,0,1,2,5];
const DAYTAG=['Before','Land','Sea','Return','After'];
const PH_NAME={pre:'Before the trip',d1:'Day 1, Land',d2:'Day 2, Sea',d3:'Day 3, Return',post:'After the trip'};
const COLS=['itinerary','ledgerLines','ledgerSpends','settlements','intel','decisions'];
const TABS=[['now','Itinerary'],['ledger','Ledger'],['intel','Info']];
const BARS=['lime','rose','blue','amber','teal'];
const CACHE_KEY='bbc26.cache.v1';

function put(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){
    const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);return e;
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const n2=x=>(Math.round((+x||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const rm=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'-':'')+'RM '+a.toLocaleString('en-MY',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const pm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null};
const hmOf=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dp=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=dp(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtS=s=>{const d=dp(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const addDays=(s,n)=>{const d=dp(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const clockHM=ts=>{const d=new Date(ts+8*3600e3);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function whenStr(ts){const d=new Date(ts+8*3600e3),t=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)===t.toISOString().slice(0,10)?clockHM(ts):d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+clockHM(ts)}
function inStr(ms){const m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440),hh=Math.floor(m%1440/60);return d?d+' d '+hh+' h':hh?hh+' h '+m%60+' min':m+' min'}
const byOrder=(a,b)=>((a.order||0)-(b.order||0))||(a.id>b.id?1:-1);

const S={crew:null,trip:null,seen:null,loaded:{},pend:new Set(),liveAt:0,ro:false};
COLS.forEach(c=>S[c]={});
const UI={tab:LS.get('bbc26.tab')||'now',ov:LS.get('bbc26.phase')||'',open:{},base:{now:0,ledger:0,intel:0},focus:null,gateConfirm:null};
if(!TABS.some(t=>t[0]===UI.tab))UI.tab='now';
if(!PH_NAME[UI.ov])UI.ov='';
let db=null,user=null,uid=null,live=false;
const T0=Date.now();
const root=document.documentElement;
const app=document.getElementById('app'),tabsEl=document.getElementById('tabs'),host=document.getElementById('sheet-host'),toastEl=document.getElementById('toast'),gate=document.getElementById('gate');
if(LS.get('bbc26.theme')==='light')root.dataset.theme='light';

function loadCache(){
  try{
    const c=JSON.parse(LS.get(CACHE_KEY)||'null');if(!c)return;
    COLS.forEach(k=>{if(c[k])S[k]=c[k]});
    S.crew=c.crew||null;S.trip=c.trip||null;S.seen=c.seen||null;S.liveAt=c.liveAt||0;
    if(c.uid)uid=c.uid;
    COLS.concat(['crew','trip','seen']).forEach(k=>S.loaded[k]=true);
  }catch(e){}
}
function saveCache(){
  try{const o={crew:S.crew,trip:S.trip,seen:S.seen,liveAt:S.liveAt,uid:uid};COLS.forEach(k=>o[k]=S[k]);LS.set(CACHE_KEY,JSON.stringify(o))}catch(e){}
}

const trip=()=>S.trip||{};
const start=()=>trip().startDate||'2026-10-07';
const end=()=>trip().endDate||addDays(start(),2);
const dayDate=i=>addDays(start(),DAYOFF[i]);
const list=n=>Object.values(S[n]);
function me(){const sl=S.crew&&S.crew.slots;if(!sl||!uid)return null;return CODES.find(c=>sl[c]===uid)||null}
function sealOf(id){if(CODES.indexOf(id)>=0)return id;const sl=S.crew&&S.crew.slots;if(!sl||!id)return null;return CODES.find(c=>sl[c]===id)||null}
const who=id=>{const c=sealOf(id);return c?NAME[c]:'Someone'};
function clock(){
  const real=new Date(Date.now()+8*3600e3);
  if(!UI.ov)return real.getTime();
  const date={pre:addDays(start(),-3),d1:start(),d2:addDays(start(),1),d3:addDays(start(),2),post:addDays(start(),4)}[UI.ov];
  const [y,m,d]=date.split('-').map(Number);
  return Date.UTC(y,m-1,d,real.getUTCHours(),real.getUTCMinutes(),real.getUTCSeconds());
}
function phase(){
  if(UI.ov)return UI.ov;
  const t=clock(),s=start();
  if(t<Date.parse(s+'T07:00:00Z'))return 'pre';
  const today=new Date(t).toISOString().slice(0,10);
  if(today===s)return 'd1';
  if(today===addDays(s,1))return 'd2';
  if(today<=end())return 'd3';
  return 'post';
}
const isOffline=()=>!navigator.onLine||!db&&(Date.now()-T0>3000)||(Date.now()-T0>6000&&!live);
function dueOf(d){
  if(!d.neededBy)return null;
  const diff=Date.parse(d.neededBy+'T23:59:59Z')-clock();
  return diff<0?'late':diff<=48*3600e3?'soon':null;
}
function attentionItems(){
  const out=[];
  list('intel').forEach(d=>{if(d.status==='TBC'){const s=dueOf(d);if(s)out.push({id:d.id,label:d.label,neededBy:d.neededBy,s})}});
  list('decisions').forEach(d=>{if(d.decided==null){const s=dueOf(d);if(s)out.push({id:d.id,label:d.question,neededBy:d.neededBy,s})}});
  return out.sort((a,b)=>(a.s===b.s?0:a.s==='late'?-1:1)||(a.neededBy>b.neededBy?1:-1));
}

/* changes by other people */
const docsOf={
  now:()=>list('itinerary').concat(S.trip?[Object.assign({id:'trip'},S.trip)]:[]),
  ledger:()=>list('ledgerLines').concat(list('ledgerSpends'),list('settlements')),
  intel:()=>list('intel').concat(list('decisions'))
};
const others=d=>d&&uid&&d.updatedAt&&d.updatedBy&&d.updatedBy!=='seed'&&d.updatedBy!==uid&&d.updatedBy!==me();
const unseen=(d,ch)=>others(d)&&d.updatedAt>(UI.base[ch]||0);
const chanDot=ch=>ch!==UI.tab&&S.loaded.seen&&docsOf[ch]().some(d=>unseen(d,ch));
function meta(d,ch,path){
  const bits=[];
  if(S.pend.has(path))bits.push(h('span',{class:'pend'},'not saved yet'));
  if(unseen(d,ch))bits.push(h('span',{class:'chg'},'● '+who(d.updatedBy)+' '+ago(d.updatedAt)));
  return bits.length?h('div',{class:'sub'},bits.map((b,i)=>[i?' · ':null,b])):null;
}
function markSeen(){
  if(!uid||!db||S.ro)return;
  enqueue('data/users/'+uid+'/seen',async()=>{
    const ref=db.doc('data/users/'+uid+'/seen'),t=Date.now(),v={tabs:{now:t,ledger:t,intel:t}};
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  },true);
}

const Q={};
function enqueue(path,fn,quiet){
  const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{if(!quiet)toast(e&&e.code==='invalid_argument'?'Not saved. You may only have view access.':'Not saved. Check your signal and try again.')});
  Q[path]=p;return p;
}
function guard(){
  if(!db){toast("Can't connect. Changes are paused.");return false}
  if(S.ro){toast('View only. Ask Soff for Contributor access.');return false}
  return true;
}
const stamp=()=>({updatedBy:uid,updatedAt:Date.now()});
function upsert(path,data){
  if(!guard())return;
  return enqueue(path,async()=>{
    const ref=db.doc(path),v=Object.assign({},data,stamp());
    try{await ref.update(v)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(v);else throw e}
  });
}

let tT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2800)}
function copy(v){
  const ok=()=>toast('Copied');
  const fb=()=>{try{const t=h('textarea',{value:v,style:'position:fixed;opacity:0'});document.body.append(t);t.select();document.execCommand('copy');t.remove();ok()}catch(e){toast('Select the text to copy it')}};
  try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}
}

/* ---------- sheets ---------- */
function closeSheet(){host.replaceChildren();document.removeEventListener('keydown',escClose)}
function escClose(e){if(e.key==='Escape')closeSheet()}
function openSheet(o){
  closeSheet();
  const vals={},els=[];
  (o.fields||[]).forEach(f=>{
    vals[f.k]=f.value;
    const id='sf-'+f.k;let ctl;
    if(f.t==='seal1'||f.t==='sealN'){
      ctl=h('div',{class:'names'});
      const draw=()=>{ctl.replaceChildren(...CODES.map(c=>{
        const on=f.t==='seal1'?vals[f.k]===c:(vals[f.k]||[]).includes(c);
        return h('button',{type:'button',class:'nb','aria-pressed':on?'true':'false',onclick:()=>{
          if(f.t==='seal1')vals[f.k]=c;
          else{const a=(vals[f.k]||[]).slice(),i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);vals[f.k]=CODES.filter(x=>a.includes(x))}
          draw();
        }},NAME[c]);
      }))};
      draw();els.push(h('div',{class:'field'},h('span',{class:'lab'},f.label),ctl));return;
    }
    if(f.t==='select'){
      ctl=h('select',{id});
      f.options.forEach(([v,t])=>{const op=h('option',{value:v},t);if(String(v)===String(f.value))op.selected=true;ctl.append(op)});
      ctl.addEventListener('change',()=>vals[f.k]=ctl.value);
    }else{
      ctl=h('input',{id,type:f.t==='date'?'date':'text',value:f.value==null?'':f.value,placeholder:f.ph||'',inputmode:f.im||null,autocomplete:'off',enterkeyhint:'done'});
      ctl.addEventListener('input',()=>vals[f.k]=ctl.value);
    }
    els.push(h('div',{class:'field'},h('label',{for:id},f.label),ctl));
  });
  let armed=false;
  const delBtn=o.onDelete?h('button',{type:'button',class:'btn d',onclick:()=>{if(!armed){armed=true;delBtn.textContent='Tap again to delete';return}closeSheet();o.onDelete()}},'Delete'):null;
  const save=()=>{const err=o.validate?o.validate(vals):null;if(err){toast(err);return}closeSheet();o.onSave(vals)};

/* ---------- itinerary data ---------- */
function events(){return list('itinerary').filter(s=>s.day!=null).sort((a,b)=>(a.day-b.day)||byOrder(a,b))}
function lateFor(s){return s.day===1?(trip().lateBy||0):0}
function evAt(s,endToo){
  let m=pm(endToo?s.end:s.start);
  if(m==null){const w=(s.when||'').toLowerCase();m=w.indexOf('night')>=0?1260:w.indexOf('even')>=0?1080:w.indexOf('mid')>=0?720:540}
  return Date.parse(dayDate(s.day)+'T00:00:00Z')+(m+lateFor(s))*6e4;
}
const timeStr=s=>s.start?((s.approx?'~':'')+hmOf(pm(s.start)+lateFor(s))+(s.end?'-'+hmOf(pm(s.end)+lateFor(s)):'')):(s.when||'TBC');
function itState(){
  const ev=events(),now=clock();
  let idx=-1;ev.forEach((s,i)=>{if(evAt(s)<=now)idx=i});
  const curActive=idx>=0&&!(ev[idx].end&&evAt(ev[idx],true)<now);
  return {ev,idx,cur:curActive?ev[idx]:null,nxt:ev[idx+1]||null,now};
}
/* ---------- ledger data ---------- */
function ledgerCalc(){
  const lines=list('ledgerLines').sort(byOrder);
  const spends=list('ledgerSpends').sort((a,b)=>(b.at||0)-(a.at||0));
  const spentBy={};let spent=0;
  spends.forEach(s=>{spentBy[s.lineId]=(spentBy[s.lineId]||0)+(+s.amount||0);spent+=(+s.amount||0)});
  return {lines,spends,spentBy,spent,budget:lines.reduce((a,l)=>a+(+l.budget||0),0)};
}
function settle(){
  const net={SF:0,AR:0,SH:0};
  list('ledgerSpends').forEach(s=>{
    const a=+s.amount||0,sp=(s.splitBetween&&s.splitBetween.length?s.splitBetween:CODES).filter(c=>net[c]!==undefined);
    if(net[s.paidBy]!==undefined)net[s.paidBy]+=a;
    sp.forEach(c=>net[c]-=a/sp.length);
  });
  const done=list('settlements').filter(x=>x.settled);
  done.forEach(x=>{if(net[x.from]!==undefined)net[x.from]+=+x.amount||0;if(net[x.to]!==undefined)net[x.to]-=+x.amount||0});
  CODES.forEach(c=>net[c]=Math.round(net[c]*100)/100);
  const debt=CODES.filter(c=>net[c]<-0.005).map(c=>({c,v:-net[c]})).sort((a,b)=>b.v-a.v);
  const cred=CODES.filter(c=>net[c]>0.005).map(c=>({c,v:net[c]})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.round(Math.min(debt[i].v,cred[j].v)*100)/100;
    if(a>0)transfers.push({from:debt[i].c,to:cred[j].c,amount:a});
    debt[i].v-=a;cred[j].v-=a;
    if(debt[i].v<0.005)i++;
    if(cred[j].v<0.005)j++;
  }
  return {net,transfers,done};
}

const VIEWS={now:viewNow,ledger:viewLedger,intel:viewIntel};
function render(){
  const ph=phase(),y=window.scrollY;
  app.replaceChildren(...[].concat(offBar(),header(ph),VIEWS[UI.tab](ph)).flat(Infinity).filter(Boolean));
  window.scrollTo(0,y);
  renderTabs();renderGate();
  if(UI.focus){const f=document.getElementById('S-'+UI.focus);UI.focus=null;if(f)f.scrollIntoView({block:'center'})}
}
let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();saveCache()})}

async function boot(){
  loadCache();
  if(S.loaded.seen)TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);
  render();
  setInterval(render,30000);
  addEventListener('online',render);addEventListener('offline',render);
  setTimeout(render,6200);
  addEventListener('keydown',e=>{if(!gate.hidden&&/^[123]$/.test(e.key)){const b=gate.querySelectorAll('.pick')[+e.key-1];if(b)b.click()}});
  const C0=window.claude;
  try{user=C0&&C0.use?await C0.use('user'):null}catch(e){user=null}
  try{db=C0&&C0.use?await C0.use('db'):null}catch(e){db=null}
  if(user){
    try{const id=await user.id();if(id)uid=id}catch(e){}
    try{S.ro=(await user.can('data.write'))===false}catch(e){}
  }
  render();
  if(!db)return;
  const err=n=>e=>{if(e&&e.code==='revoked')S.ro=true;console.warn(n,e&&e.code)};
  const lv=s=>{if(!s.metadata.fromCache){live=true;S.liveAt=Date.now()}};
  db.doc('crew/members').onSnapshot(s=>{S.crew=s.exists?s.data():null;S.loaded.crew=true;lv(s);sched()},err('crew'));
  db.doc('meta/trip').onSnapshot(s=>{S.trip=s.exists?s.data():null;S.loaded.trip=true;lv(s);sched()},err('trip'));
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{
    const m={};
    for(const p of Array.from(S.pend))if(p.indexOf(n+'/')===0)S.pend.delete(p);
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data());if(d.metadata.hasPendingWrites)S.pend.add(n+'/'+d.id)});
    S[n]=m;S.loaded[n]=true;lv(snap);sched();
  },err(n)));
  if(uid)db.doc('data/users/'+uid+'/seen').onSnapshot(s=>{
    S.seen=s.exists?s.data():null;
    if(!S.seenInit){S.seenInit=true;S.loaded.seen=true;TABS.forEach(([k])=>UI.base[k]=(S.seen&&S.seen.tabs&&S.seen.tabs[k])||0);setTimeout(markSeen,2500)}
    sched();
  },err('seen'));
}
boot();
})();
</script>
