<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060d">
<title>Badsoffware CLIMB</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { position: absolute; display: block; background: #0a0d1a; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* BADSOFFWARE CLIMB, solo vertical-climb prototype.
   Serve the folder (python3 -m http.server 8123) and open /climb.html. Sprites load from art/.
   Every tunable number lives in CONFIG. Keyboard: arrows/AD move, Space/W/Up jump (twice for double jump),
   E/Shift/Down use item, M mute, P pause, R retry. */

const CONFIG = {
  W: 390, H: 844, PH: 693,                 // logical size, play area height (controls panel is the rest)
  GRAV: 1800, JUMP_V: 645, DJUMP_V: 565, JUMP_CUT: 0.45, MAX_FALL: 900,
  RUN: 230, ACC_G: 2400, ACC_A: 1500, FRIC_G: 2200, FRIC_A: 420,
  COYOTE: 0.10, BUFFER: 0.12,
  PW: 22, PHH: 44,                         // player hitbox
  CAM_AT: 0.58, CAM_LERP: 7,               // player sits this far down the play area
  PX_PER_M: 10,
  SWARM: { START_Y: 330, BASE: 34, MAX: 105, RAMP_M: 500, FAR: 480, SURGE: 1.9, NEAR: 130, STALL: 0.25, STALL_T: 1.1, STALL_CD: 7, COLS: 26, GRACE: 2.5 },
  HUNT: { FIRST_T: 16, FIRST_M: 12, EVERY: [15, 7], SPEED: [120, 175], TURN: 2.2, LIFE: 10, WARN: 0.9, HIT_STUN: 0.7, SURGE_T: 3 },
  POWER: { FREEZE_T: 4, SHOCK_PUSH: 220, JET_V: 1000, SHIELD_PUSH: 300, INVULN: 1.5 },
  PLAT: { CRUMBLE_T: 0.55, BOUNCE_V: 980 },
  TIERS: { MOVE_M: 25, BOUNCE_M: 30, CRUMBLE_M: 55, DIFF_M: 350 },
};
const C = CONFIG, W = C.W, H = C.H, PH = C.PH;
const PILOTS = ['patch', 'bolt', 'glitch', 'havoc'];
const PILOT_NAMES = { patch: 'PATCH', bolt: 'BOLT', glitch: 'GLITCH', havoc: 'HAVOC' };
const ITEMS = { freeze: { name: 'FREEZE', col: '#7fe9ff' }, shock: { name: 'SHOCK', col: '#ffd23d' }, shield: { name: 'SHIELD', col: '#6dff9c' }, jet: { name: 'JET', col: '#ff8c3d' } };

const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(i, j = 0) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const dailyKey = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);   // MYT
const dailySeed = () => Math.imul(Number(dailyKey().replace(/-/g, '')), 2654435761) >>> 0;
const store = {
  get(k, d) { try { const v = localStorage.getItem('bswclimb.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bswclimb.' + k, String(v)); } catch (e) { /* private mode */ } },
};

/* ---------- canvas + scaling ---------- */
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize); resize();

/* ---------- art ---------- */
const A = { robots: {}, drones: {}, skins: [], bgFar: null, bgMid: null, street: null, hero: null, ok: false };
function loadImg(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
async function loadArt() {
  const jobs = [];
  for (const n of PILOTS) { A.robots[n] = {}; for (const a of ['idle', 'run', 'jump', 'fall', 'land', 'tagged']) jobs.push(loadImg(`art/robots/${n}_${a}.png`).then(im => { A.robots[n][a] = im; })); }
  for (const n of ['bopster', 'grumpulator', 'sneakfolder', 'hijacker']) jobs.push(loadImg(`art/badsoffwares/${n}_hover.png`).then(im => { A.drones[n] = im; }));
  for (const s of [2, 3]) { A.skins[s] = {}; for (const t of ['left', 'mid', 'right']) jobs.push(loadImg(`art/scenery/plat_skin${s}_${t}.png`).then(im => { A.skins[s][t] = im; })); }
  jobs.push(loadImg('art/scenery/bg_far.webp').then(im => { A.bgFar = im; }), loadImg('art/scenery/bg_mid.webp').then(im => { A.bgMid = im; }),
    loadImg('art/scenery/street.webp').then(im => { A.street = im; }), loadImg('art/title/hero.webp').then(im => { A.hero = im; }));
  await Promise.all(jobs); A.ok = true;
}

/* ---------- audio (tiny synth, no files) ---------- */
const Snd = {
  ctx: null, muted: store.get('muted', '0') === '1', rum: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 46; f.type = 'lowpass'; f.frequency.value = 140; g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(this.ctx.destination); o.start(); this.rum = g;
    } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', vol = 0.06, slide = 0) {
    if (!this.ctx || this.muted) return; const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.02);
  },
  play(n) {
    ({ jump: () => this.tone(420, 0.12, 'square', 0.05, 260), djump: () => this.tone(560, 0.13, 'square', 0.05, 340), land: () => this.tone(150, 0.06, 'triangle', 0.07, -60),
      bounce: () => this.tone(300, 0.25, 'sine', 0.09, 700), pick: () => { this.tone(660, 0.08, 'square', 0.05); setTimeout(() => this.tone(990, 0.1, 'square', 0.05), 70); },
      warn: () => { this.tone(220, 0.14, 'sawtooth', 0.07); setTimeout(() => this.tone(220, 0.14, 'sawtooth', 0.07), 190); }, hit: () => this.tone(120, 0.3, 'sawtooth', 0.1, -70),
      stomp: () => this.tone(260, 0.16, 'square', 0.07, 400), power: () => this.tone(200, 0.35, 'sawtooth', 0.07, 500), die: () => this.tone(180, 0.9, 'sawtooth', 0.12, -150),
      crumble: () => this.tone(110, 0.2, 'triangle', 0.06, -40), combo: () => this.tone(700, 0.1, 'triangle', 0.06, 500) }[n] || (() => { }))();
  },
  rumble(v) { if (this.rum && this.ctx) this.rum.gain.setTargetAtTime(this.muted ? 0 : v * 0.07, this.ctx.currentTime, 0.1); },
};

/* ---------- input ---------- */
const keys = { left: 0, right: 0, jump: 0 }, touch = { left: 0, right: 0, jump: 0 };
const input = { left: 0, right: 0, jump: 0, jumpEdge: false, useEdge: false };
const CTRL = {
  left: { x: 8, y: PH + 34, w: 98, h: 112 }, right: { x: 112, y: PH + 34, w: 98, h: 112 },
  use: { cx: 244, cy: PH + 92, r: 32 }, jump: { cx: 326, cy: PH + 90, r: 54 },
};
function ctrlAt(x, y) {
  if (y < PH) return null;
  if (Math.hypot(x - CTRL.jump.cx, y - CTRL.jump.cy) < CTRL.jump.r + 14) return 'jump';
  if (Math.hypot(x - CTRL.use.cx, y - CTRL.use.cy) < CTRL.use.r + 10) return 'use';
  for (const k of ['left', 'right']) { const r = CTRL[k]; if (x >= r.x && x <= r.x + r.w && y >= r.y - 20 && y <= r.y + r.h + 10) return k; }
  return null;
}
const ptrs = new Map(); let uiBtns = [];
function pt(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function recompute() { touch.left = touch.right = touch.jump = 0; for (const k of ptrs.values()) if (k && touch[k] !== undefined) touch[k] = 1; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init(); try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ok */ }
  const [x, y] = pt(e);
  for (const b of uiBtns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (state === 'play') { const k = ctrlAt(x, y); ptrs.set(e.pointerId, k); recompute(); if (k === 'jump') input.jumpEdge = true; if (k === 'use') input.useEdge = true; }
  else if (state === 'dead' && G.deadT > 0.8) startRun();
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; const [x, y] = pt(e), k = ctrlAt(x, y), old = ptrs.get(e.pointerId);
  if (k !== old) { ptrs.set(e.pointerId, k); recompute(); if (k === 'jump') input.jumpEdge = true; }
});
const endPtr = e => { ptrs.delete(e.pointerId); recompute(); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
addEventListener('keydown', e => {
  Snd.init(); const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (k === 'jump' && !keys.jump && !e.repeat) input.jumpEdge = true; keys[k] = 1; if (state === 'title' && k === 'jump') startRun(); else if (state === 'dead' && k === 'jump' && G.deadT > 0.8) startRun(); }
  if ((e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown') && !e.repeat) { e.preventDefault(); input.useEdge = true; }
  if (e.code === 'KeyM') { Snd.muted = !Snd.muted; store.set('muted', Snd.muted ? 1 : 0); }
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'KeyR' && (state === 'play' || state === 'dead')) startRun();
  if (e.code === 'Enter' && (state === 'title' || (state === 'dead' && G.deadT > 0.8))) startRun();
  if (state === 'title' && e.code === 'KeyF') { mode = 'free'; startRun(); }
  if (state === 'title' && e.code === 'KeyT') { mode = 'daily'; startRun(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = 0; if (state === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

/* ---------- game state ---------- */
let state = 'title', mode = store.get('mode', 'daily'), pilot = store.get('pilot', 'patch'), paused = false, now = 0;
if (!PILOTS.includes(pilot)) pilot = 'patch';
let G = { t: 0, deadT: 0 }, P, sw, plats, picks, hunters, fx, rings, pops, gen, cam = { y: 0, shake: 0 }, rng, rng2, HT;
const keyFor = () => mode === 'daily' ? 'best.daily.' + dailyKey() : 'best.free';

function startRun() {
  Snd.init(); state = 'play'; paused = false; ptrs.clear(); recompute();
  const seed = mode === 'daily' ? dailySeed() : (Math.random() * 4294967296) >>> 0;
  rng = mulberry32(seed); rng2 = mulberry32(seed ^ 0x9e3779b9);
  G = { t: 0, deadT: 0, seed, maxH: 0, bonus: 0, combo: 0, lastRow: 0, lastLandT: -9, minGap: 99999, landings: 0, hunterHits: 0, stomps: 0, newBest: false, cause: '' };
  plats = [{ x: 0, y: 0, w: W, type: 'floor', row: 0, dx: 0 }]; picks = []; hunters = []; fx = []; rings = []; pops = [];
  gen = { y: 0, x: W / 2, w: W, row: 0, type: 'floor' };
  P = { x: W / 2, y: 0, vx: 0, vy: 0, f: 1, onGround: true, on: plats[0], coyote: 0, buf: 0, air: 1, jumping: false, t: 0, landT: 0, stun: 0, inv: 0, item: null, shield: false, dead: false, cx: 0 };
  sw = { y: C.SWARM.START_Y, t: 0, freeze: 0, stall: 0, stallCD: 3, surge: 0, started: false };
  HT = C.HUNT.FIRST_T; cam.y = -C.PH * C.CAM_AT; cam.shake = 0;
  genUp(-1500);
  addPop('CLIMB', W / 2, 330, '#ffffff');
}

/* ---------- level generation ---------- */
function genUp(limitY) { while (gen.y > limitY) genRow(); }
function pickKind() { const r = rng(); return r < 0.3 ? 'freeze' : r < 0.55 ? 'shock' : r < 0.8 ? 'shield' : 'jet'; }
function genRow() {
  const R = rng, hM = Math.max(0, -gen.y / C.PX_PER_M), d = Math.min(1, hM / C.TIERS.DIFF_M);
  const dy = clamp(lerp(72, 138, d) + (R() - 0.5) * 20, 64, 150);
  let w = Math.round(lerp(150, 104, d) + (R() - 0.5) * 30);
  const gapMax = lerp(40, 105, d), reach = gen.w / 2 + w / 2 + gapMax * (R() * 0.6 + 0.4), dir = R() < 0.5 ? -1 : 1;
  let type = 'static'; const r = R();
  const pm = hM > C.TIERS.MOVE_M ? 0.08 + 0.2 * d : 0, pb = hM > C.TIERS.BOUNCE_M ? 0.07 : 0, pc = hM > C.TIERS.CRUMBLE_M ? 0.08 + 0.2 * d : 0;
  if (r < pm) type = 'move'; else if (r < pm + pb && gen.type !== 'bounce') type = 'bounce'; else if (r < pm + pb + pc && gen.type !== 'crumble') type = 'crumble';
  if (type === 'move' || type === 'bounce') w = Math.max(w, 112);
  const lo = w / 2 + 10, hi = W - w / 2 - 10;
  let cxp = gen.x + dir * R() * reach; if (cxp < lo || cxp > hi) cxp = gen.x - dir * R() * reach; cxp = clamp(cxp, lo, hi);
  gen.y -= dy; gen.row++;
  const pl = { x: cxp - w / 2, bx: cxp - w / 2, y: gen.y, w, type, row: gen.row, dx: 0, cr: -1, broken: false };
  if (type === 'move') { pl.amp = Math.min(35 + R() * 35, cxp - w / 2 - 6, W - 6 - cxp - w / 2); pl.spd = 0.8 + R() * 0.7; pl.ph = R() * 6.28; if (pl.amp < 20) pl.type = 'static'; }
  plats.push(pl);
  if (R() < 0.04) picks.push({ x: cxp, y: gen.y - 30, kind: pickKind(), taken: false });
  if (hM > 10 && R() < 0.3) {               // greedy side platform, sometimes with a drone to catch
    const w2 = 96, c2 = clamp(cxp < W / 2 ? cxp + 150 + R() * 40 : cxp - 150 - R() * 40, w2 / 2 + 10, W - w2 / 2 - 10), y2 = gen.y + (R() < 0.5 ? -45 : 35);
    plats.push({ x: c2 - w2 / 2, bx: c2 - w2 / 2, y: y2, w: w2, type: 'static', row: gen.row, dx: 0, cr: -1, broken: false, extra: true });
    if (R() < 0.6) picks.push({ x: c2, y: y2 - 30, kind: pickKind(), taken: false });
  }
  gen.x = cxp; gen.w = w; gen.type = type;
}

/* ---------- swarm ---------- */
const colW = () => W / C.SWARM.COLS;
function colOff(i, t) { return -(14 + 12 * Math.sin(t * 1.3 + i * 2.1) + 8 * Math.sin(t * 2.7 + i * 0.9) + 10 * hash(i)); }
function frontAt(x) { const i = clamp(Math.floor(((x % W) + W) % W / colW()), 0, C.SWARM.COLS - 1); return sw.y + colOff(i, sw.t); }
function swarmSpeed(hM) { return lerp(C.SWARM.BASE, C.SWARM.MAX, Math.min(1, hM / C.SWARM.RAMP_M)); }
function updateSwarm(dt) {
  const S = C.SWARM; sw.t += dt;
  if (!sw.started && (P.y < -20 || G.t > S.GRACE)) sw.started = true;
  if (!sw.started || state !== 'play') { if (state === 'dead') sw.y -= 260 * dt; return; }
  const dist = sw.y - P.y; let mult = 1;
  if (dist > S.FAR) mult = 1 + (S.SURGE - 1) * Math.min(1, (dist - S.FAR) / 150);
  sw.stallCD -= dt;
  if (dist < S.NEAR && sw.stall <= 0 && sw.stallCD <= 0) { sw.stall = S.STALL_T; sw.stallCD = S.STALL_CD; addPop('REBUILDING...', W / 2, 250, '#ff7ac8'); }
  if (sw.stall > 0) { mult *= S.STALL; sw.stall -= dt; }
  if (sw.surge > 0) { mult *= 1.55; sw.surge -= dt; }
  if (sw.freeze > 0) { mult = 0; sw.freeze -= dt; }
  sw.y -= swarmSpeed(G.maxH) * mult * dt;
}

/* ---------- hunter drone ---------- */
function updateHunters(dt) {
  const HU = C.HUNT, d = Math.min(1, G.maxH / C.TIERS.DIFF_M);
  if (!hunters.length && sw.started && state === 'play') {
    HT -= dt;
    if (HT <= 0 && G.maxH >= HU.FIRST_M) {
      hunters.push({ x: clamp(P.x + (rng2() - 0.5) * 160, 30, W - 30), y: sw.y + 20, vx: 0, vy: 0, st: 'warn', t: 0, life: HU.LIFE });
      Snd.play('warn'); addPop('HUNTER!', W / 2, 270, '#ff3d71');
    }
  }
  for (let i = hunters.length - 1; i >= 0; i--) {
    const h = hunters[i]; h.t += dt; let gone = false;
    if (h.st === 'warn') {
      h.y = lerp(sw.y + 20, sw.y - 60, Math.min(1, h.t / HU.WARN)); if (h.t >= HU.WARN) { h.st = 'hunt'; h.vy = -80; }
    } else if (h.st === 'hunt' || h.st === 'leave') {
      const frozen = sw.freeze > 0;
      if (h.st === 'hunt') {
        const spd = lerp(HU.SPEED[0], HU.SPEED[1], d) * (frozen ? 0 : 1), tx = P.x, ty = P.y - 22, dx = tx - h.x, dy = ty - h.y, dd = Math.hypot(dx, dy) || 1, k = 1 - Math.exp(-HU.TURN * dt);
        h.vx += (dx / dd * spd - h.vx) * k; h.vy += (dy / dd * spd - h.vy) * k;
        if (!frozen) { h.life -= dt; if (h.life <= 0) h.st = 'leave'; }
      } else { h.vy += 600 * dt; h.vx *= 0.98; if (h.y > sw.y + 10) gone = true; }
      h.x += h.vx * dt; h.y += h.vy * dt;
      if (h.st === 'hunt' && !P.dead && P.inv <= 0 && Math.hypot(P.x - h.x, P.y - 22 - h.y) < 26) {
        if (P.vy > 60 && P.y < h.y - 2) { killHunter(h, 'STOMP +25'); G.bonus += 25; G.stomps++; P.vy = -520; P.air = 1; P.jumping = false; Snd.play('stomp'); gone = true; }
        else if (P.shield) { P.shield = false; killHunter(h, 'SHIELD BROKE'); Snd.play('hit'); gone = true; }
        else { const s = P.x >= h.x ? 1 : -1; P.stun = HU.HIT_STUN; P.vx = s * 240; P.vy = 160; P.onGround = false; sw.surge = HU.SURGE_T; G.hunterHits++; killHunter(h, 'GRABBED! SWARM SURGING'); cam.shake = 14; Snd.play('hit'); gone = true; }
      }
    }
    if (gone) { hunters.splice(i, 1); HT = lerp(HU.EVERY[0], HU.EVERY[1], d) * (0.8 + rng2() * 0.4); }
  }
}
function killHunter(h, text) { burst(h.x, h.y, '#38e1ff', 14, 160); rings.push({ x: h.x, y: h.y, r: 4, t: 0, col: '#38e1ff' }); addPop(text, h.x, h.y - 20, '#ffffff'); }

/* ---------- items ---------- */
function usePower() {
  if (!P.item || P.dead) return; const it = P.item; P.item = null; Snd.play('power'); rings.push({ x: P.x, y: P.y - 22, r: 6, t: 0, col: ITEMS[it].col });
  if (it === 'freeze') { sw.freeze = C.POWER.FREEZE_T; addPop('SWARM FROZEN', W / 2, 270, ITEMS.freeze.col); }
  else if (it === 'shock') { sw.y += C.POWER.SHOCK_PUSH; for (const h of hunters) killHunter(h, ''); hunters.length = 0; HT = 6; cam.shake = 10; addPop('SHOCKWAVE', W / 2, 270, ITEMS.shock.col); }
  else if (it === 'jet') { P.vy = -C.POWER.JET_V; P.onGround = false; P.on = null; P.air = 1; P.jumping = false; burst(P.x, P.y, '#ff8c3d', 16, 220); }
}

/* ---------- player ---------- */
function supports(pl, x) { const a = x - C.PW / 2, b = x + C.PW / 2; return b > pl.x && a < pl.x + pl.w; }
function landOn(pl, p) {
  p.y = pl.y; p.vy = 0; p.onGround = true; p.on = pl; p.air = 1; p.jumping = false; p.landT = 0.12; Snd.play('land');
  burst(p.x, p.y, '#9fb4d9', 4, 60);
  if (pl.type === 'crumble' && pl.cr < 0) { pl.cr = C.PLAT.CRUMBLE_T; Snd.play('crumble'); }
  if (pl.row > 0 || G.landings === 0) {
    const diff = pl.row - G.lastRow;
    if (diff >= 2) { G.combo++; const b = G.combo * 3; G.bonus += b; addPop(`SKIP x${G.combo}  +${b}`, p.x, p.y - 60, '#ffd23d'); Snd.play('combo'); }
    else if (diff < 0 || G.t - G.lastLandT > 2) G.combo = 0;
    if (pl.row > G.lastRow) G.lastRow = pl.row;
