<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Badsoffware</title>
<style>
  :root { --hud: 48px; --panel: 240px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #060810; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #e8f4ff; }
  #stage { position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform-origin: top left; background: #060810; }
  #cv { position: absolute; top: 0; left: 0; width: 390px; height: 844px; display: block; background: #0a0d1a; }
  #rotate { position: fixed; inset: 0; background: #060810; display: none; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 24px; }
  #rotate.show { display: flex; }
  #rotate div { font-size: 15px; letter-spacing: .04em; color: #9fb3d1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="rotate"><div>ROTATE YOUR PHONE<br><span style="font-size:12px;opacity:.7">BADSOFFWARE IS PLAYED IN PORTRAIT</span></div></div>
<div id="stage">
  <canvas id="cv" width="390" height="844"></canvas>
</div>
<script>
'use strict';
/* =====================================================================
   BADSOFFWARE v2  |  single file game, milestone 1: portrait greybox
   Physics ported unchanged from v1. Tower, networking, Badsoffware
   power-ups and real art land in later commits (see PRD.md, DECISIONS.md).
   Every tunable lives in CONFIG.
   ===================================================================== */
const CONFIG = {
  W: 390, H: 844, HUD_H: 48, PANEL_H: 240, RENDER_SCALE_CAP: 2,
  STEP: 1 / 60, MAX_STEPS: 5,
  // round
  ROUND_MS: 120000, COUNTDOWN_MS: 3000, GO_MS: 900,
  FREEZE_MS: 1000, TAG_COOLDOWN_MS: 1000, TAG_TOL: 24, LOCAL_TAG_SLACK: 2,
  HIT_W: 28, HIT_H: 40,
  MAX_SLOTS: 4,
  // movement (unchanged from v1 PRD section 5)
  RUN: 220, ACCEL: 1800, FRICTION: 2400, AIR_CONTROL: 0.7, AIR_DRAG: 420, SKID: 2.2,
  GRAVITY: 1800, JUMP_V: 645, DJUMP_V: 565, JUMP_CUT: 0.45, JUMP_CUT_AFTER: 0.05, MAX_FALL: 900,
  COYOTE_MS: 80, BUFFER_MS: 100, DROP_MS: 220,
  BOING_VX: 380, BOING_VY: 520, BOING_LOCK: 0.32,
  // touch controls (logical px, panel coordinates: panel origin is y = HUD_H + playfield height)
  JOY: { x: 78, y: 150, r: 49, knob: 19, dead: 0.18, full: 0.75, drop: 0.6 },
  PWRBTN: { x: 312, y: 86, r: 36 },
  JUMPBTN: { x: 312, y: 170, w: 90, h: 78 },
  // bot
  BOT: { reactMs: 380, speedScale: 0.82, thinkMs: 130 },
  // palette
  C: { bg: '#0a0d14', pan: '#0d1420', bd: '#1c3350', dk: '#141e30', md: '#223a56', lt: '#e8f4ff', t2: '#8a90b0', t3: '#c0c8e0',
       cyan: '#3de6ff', magenta: '#ff00ff' },
  // roster: index = robot id on the wire (S.rob). Cosmetic only: every robot shares the same physics and hitbox.
  ROBOTS: [
    { id: 'patch',  name: 'PATCH',  col: '#3df5c4' },
    { id: 'bolt',   name: 'BOLT',   col: '#4db8ff' },
    { id: 'glitch', name: 'GLITCH', col: '#b48cff' },
    { id: 'havoc',  name: 'HAVOC',  col: '#ff4d6a' }],
};
const CC = CONFIG.C;
const VW = CONFIG.W, VH = CONFIG.H;
const PLAY_Y0 = CONFIG.HUD_H, PLAY_H = VH - CONFIG.HUD_H - CONFIG.PANEL_H, FLOOR = PLAY_Y0 + PLAY_H - 4;
const PANEL_Y0 = PLAY_Y0 + PLAY_H;
const QS = new URLSearchParams(location.search);
const DEBUG_BOTS = parseInt(QS.get('bots'), 10);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
function wdx(a, b) { let d = b - a; if (d > VW / 2) d -= VW; else if (d < -VW / 2) d += VW; return d; }
function wrapX(x) { return x < 0 ? x + VW : x >= VW ? x - VW : x; }
function hitGap(ax, ay, bx, by) { const dx = Math.abs(wdx(ax, bx)) - CONFIG.HIT_W, dy = Math.abs(ay - by) - CONFIG.HIT_H; return Math.hypot(dx > 0 ? dx : 0, dy > 0 ? dy : 0); }
function mulberry(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
function fmtClock(ms) { return (ms / 1000).toFixed(1) + 's'; }
function tryDo(f) { try { return f(); } catch (e) { return undefined; } }

/* ---------- scaling: logical 390x844, letterboxed, DPR capped ---------- */
const stage = $('stage'), cv = $('cv'), cx = cv.getContext('2d', { alpha: false });
const view = { s: 1, ox: 0, oy: 0, bs: 1 };
function doLayout() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const portrait = ih >= iw;
  $('rotate').classList.toggle('show', !portrait);
  const s = Math.min(iw / VW, ih / VH);
  view.s = s; view.ox = (iw - VW * s) / 2; view.oy = (ih - VH * s) / 2;
  stage.style.transform = 'translate(' + view.ox + 'px,' + view.oy + 'px) scale(' + s + ')';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const bs = Math.max(0.5, Math.min(CONFIG.RENDER_SCALE_CAP, s * dpr));
  view.bs = bs;
  cv.width = Math.round(VW * bs); cv.height = Math.round(VH * bs);
}
window.addEventListener('resize', doLayout);
window.addEventListener('orientationchange', () => setTimeout(doLayout, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', doLayout);
doLayout();
['gesturestart', 'gesturechange', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- audio: synthesised chiptune (subset ported from v1) ---------- */
const Snd = {
  ctx: null, master: null, muted: store.get('bsw_mute', '0') === '1', nbuf: null,
  init() {
    tryDo(() => {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate * 0.5, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.nbuf = b;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    });
  },
  setMute(m) { this.muted = m; store.set('bsw_mute', m ? '1' : '0'); if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(f0, f1, dur, type, vol, delay) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.18, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, delay, freq) {
    if (!this.ctx || this.muted || !this.nbuf) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf; f.type = 'bandpass'; f.frequency.value = freq || 1200;
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  play(n) { const f = SFX[n]; if (f && this.ctx && !this.muted) tryDo(f); }
};
const SFX = {
  jump() { Snd.tone(280, 620, 0.12, 'square', 0.12); },
  djump() { Snd.tone(420, 940, 0.14, 'square', 0.12); Snd.noise(0.08, 0.06, 0, 3000); },
  land() { Snd.noise(0.07, 0.12, 0, 400); Snd.tone(120, 60, 0.07, 'triangle', 0.15); },
  tag() { Snd.tone(900, 120, 0.28, 'sawtooth', 0.2); Snd.noise(0.2, 0.18, 0, 1800); Snd.tone(1320, 1320, 0.06, 'square', 0.14, 0.04); },
  frozen() { for (let i = 0; i < 6; i++) Snd.tone(rnd(500, 1800), rnd(300, 1500), 0.05, 'square', 0.07, i * 0.05); Snd.noise(0.3, 0.1, 0, 6000); },
  cd() { Snd.tone(440, 440, 0.14, 'square', 0.18); },
  go() { Snd.tone(880, 1320, 0.3, 'square', 0.2); },
  tick() { Snd.tone(1500, 1500, 0.03, 'square', 0.1); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => Snd.tone(f, f, 0.14, 'square', 0.16, i * 0.12)); },
  draw() { Snd.tone(440, 440, 0.2, 'square', 0.15); Snd.tone(440, 440, 0.3, 'square', 0.15, 0.25); },
  ui() { Snd.tone(660, 660, 0.05, 'square', 0.1); }
};

/* ---------- input: touch (multi-touch by identifier) + keyboard ---------- */
const K = {};
let jumpEdge = false;
const touch = { joyId: -1, jx: 0, jy: 0, jumpId: -1 };
function toLogical(t) { return { x: (t.clientX - view.ox) / view.s, y: (t.clientY - view.oy) / view.s }; }
function joyUpdate(p) {
  const J = CONFIG.JOY; let dx = p.x - J.x, dy = p.y - (PANEL_Y0 + J.y); const d = Math.hypot(dx, dy);
  if (d > J.r) { dx = dx / d * J.r; dy = dy / d * J.r; }
  touch.jx = dx; touch.jy = dy;
}
cv.addEventListener('touchstart', e => {
  e.preventDefault(); Snd.init();
  for (const t of e.changedTouches) {
    const p = toLogical(t);
    if (p.y < PANEL_Y0) continue;
    if (touch.joyId < 0 && p.x < VW / 2) { touch.joyId = t.identifier; joyUpdate(p); }
    else if (touch.jumpId < 0) { touch.jumpId = t.identifier; jumpEdge = true; }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touch.joyId) joyUpdate(toLogical(t));
}, { passive: false });
function tend(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) { touch.joyId = -1; touch.jx = 0; touch.jy = 0; }
    if (t.identifier === touch.jumpId) touch.jumpId = -1;
  }
}
cv.addEventListener('touchend', tend, { passive: false });
cv.addEventListener('touchcancel', tend, { passive: false });
const JUMPKEYS = { ArrowUp: 1, KeyW: 1, Space: 1 };
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (!e.repeat) {
    if (JUMPKEYS[e.code]) jumpEdge = true;
    if (e.code === 'KeyM') Snd.setMute(!Snd.muted);
  }
  K[e.code] = true; Snd.init();
});
window.addEventListener('keyup', e => { K[e.code] = false; });
window.addEventListener('blur', () => { for (const k in K) K[k] = false; });

const _in = { move: 0, held: false, press: false, down: false };
function readHumanInput() {
  let l = K.ArrowLeft || K.KeyA, r = K.ArrowRight || K.KeyD, held = K.ArrowUp || K.KeyW || K.Space, down = K.ArrowDown || K.KeyS;
  let move = (r ? 1 : 0) - (l ? 1 : 0);
  if (touch.joyId >= 0) {
    const J = CONFIG.JOY, nx = touch.jx / J.r, ny = touch.jy / J.r, ax = Math.abs(nx);
    if (ax > J.dead) move = Math.sign(nx) * Math.min(1, (ax - J.dead) / (J.full - J.dead));
    if (ny > J.drop) down = true;
  }
  if (touch.jumpId >= 0) held = true;
  _in.move = move; _in.held = !!held; _in.down = !!down;
  _in.press = jumpEdge; jumpEdge = false;
  return _in;
}

/* ---------- physics for a locally controlled robot (ported unchanged from v1) ---------- */
function mkPlayer(slot) {
  return {
    slot, active: false, isBot: false, robot: slot, x: 60 + slot * 90, y: FLOOR, vx: 0, vy: 0, f: 1, a: 0,
    onGround: true, coyote: 0, jumpBuf: 0, canDbl: true, jumping: false, dropT: 0, noCtl: 0, t: Math.random() * 6,
    it: false, itClock: 0, frozen: 0, tagCd: 0, lastTaggedBy: -1,
  };
}
function resetPlayer(p, slot, n) {
  p.x = ((slot + 0.5) / Math.max(1, n)) * (VW - 60) + 30; p.y = FLOOR; p.vx = 0; p.vy = 0; p.f = 1; p.onGround = true;
  p.canDbl = true; p.jumping = false; p.coyote = 0; p.jumpBuf = 0; p.dropT = 0; p.noCtl = 0; p.a = 0;
  p.it = false; p.itClock = 0; p.frozen = 0; p.tagCd = 0; p.lastTaggedBy = -1;
}
function stepPlayer(p, inp, dt, active) {
  const C = CONFIG, prevY = p.y, ground = p.onGround;
  p.t += dt;
  if (p.noCtl > 0) p.noCtl -= dt;
  const ctl = active && p.noCtl <= 0;
  const moveX = ctl ? inp.move : 0;
  if (moveX !== 0) { p.f = moveX > 0 ? 1 : -1; const tgt = moveX * C.RUN; const a = ground ? C.ACCEL : C.ACCEL * C.AIR_CONTROL; p.vx = approach(p.vx, tgt, a * dt); }
  else { const fr = ground ? C.FRICTION * (Math.sign(p.vx) !== 0 && Math.sign(p.vx) !== Math.sign(moveX) ? C.SKID : 1) : C.AIR_DRAG; p.vx = approach(p.vx, 0, fr * dt); }
  if (ground) { p.coyote = C.COYOTE_MS; p.canDbl = true; } else p.coyote -= dt * 1000;
  if (ctl && inp.press) p.jumpBuf = C.BUFFER_MS; else p.jumpBuf -= dt * 1000;
  let doJump = 0;
  if (p.jumpBuf > 0 && (ground || p.coyote > 0)) { doJump = 1; p.jumpBuf = 0; p.coyote = 0; }
  else if (p.jumpBuf > 0 && !ground && p.canDbl) { doJump = 2; p.jumpBuf = 0; p.canDbl = false; }
  if (doJump) { p.vy = -(doJump === 1 ? C.JUMP_V : C.DJUMP_V); p.onGround = false; p.jumping = true; Snd.play(doJump === 1 ? 'jump' : 'djump'); }
  if (ctl && !inp.held && p.jumping && p.vy < -C.JUMP_V * C.JUMP_CUT_AFTER * 4) { } // reserved for variable-jump release shaping
  if (p.jumping && ctl && !inp.held && p.vy < 0) p.vy = Math.max(p.vy, -Math.abs(p.vy) * C.JUMP_CUT);
  p.vy = Math.min(p.vy + C.GRAVITY * dt, C.MAX_FALL);
  p.x = wrapX(p.x + p.vx * dt);
  p.y += p.vy * dt;
  if (p.y >= FLOOR) { p.y = FLOOR; if (p.vy > 40) Snd.play('land'); p.vy = 0; p.onGround = true; p.jumping = false; }
  else p.onGround = false;
  p.a += dt * (Math.abs(p.vx) > 10 ? 10 : 4);
  if (p.frozen > 0) { p.frozen -= dt * 1000; if (p.frozen < 0) p.frozen = 0; }
  if (p.tagCd > 0) p.tagCd -= dt * 1000;
  if (p.it && p.active) p.itClock += dt * 1000;
}

/* ---------- bots: simple chase/flee stub (full AI lands in a later commit) ---------- */
function botThink(p, players) {
  if (p.frozen > 0) return { move: 0, held: false, press: false, down: false };
  const others = players.filter(o => o !== p && o.active);
  if (!others.length) return { move: 0, held: false, press: false, down: false };
  let target;
  if (p.it) { target = others.reduce((a, b) => Math.abs(wdx(p.x, a.x)) < Math.abs(wdx(p.x, b.x)) ? a : b); }
  else { const itP = others.find(o => o.it); target = itP || others[0]; }
  const dx = target ? wdx(p.x, target.x) : 0;
  const flee = !p.it;
  let move = Math.sign(dx) * (flee ? -1 : 1);
  if (Math.abs(dx) < 20) move = 0;
  return { move: move * CONFIG.BOT.speedScale, held: false, press: Math.random() < 0.01, down: false };
}

/* ---------- session: up to 4 players, It-clock scoring, local/practice for now ---------- */
const P = [mkPlayer(0), mkPlayer(1), mkPlayer(2), mkPlayer(3)];
const S = { ph: 'title', n: 0, roundMs: CONFIG.ROUND_MS, t: 0, cdT: 0 };

function startLocal(nBots) {
  const n = clamp(1 + (Number.isFinite(nBots) ? nBots : 2), 2, CONFIG.MAX_SLOTS);
  S.n = n;
  for (let i = 0; i < CONFIG.MAX_SLOTS; i++) {
    const p = P[i];
    p.active = i < n; p.isBot = i > 0; p.robot = i;
    if (p.active) resetPlayer(p, i, n);
  }
  P[0].isBot = false;
  S.t = CONFIG.COUNTDOWN_MS; S.ph = 'countdown';
  const live = P.filter(p => p.active);
  live.forEach(p => p.it = false);
  live[Math.floor(Math.random() * live.length)].it = true;
  Snd.play('cd');
}

function tagAllowed(by, target) { return by.active && target.active && by !== target && by.it && !target.it && by.frozen <= 0 && target.frozen <= 0 && by.tagCd <= 0 && target.tagCd <= 0; }
function applyTag(by, target) {
  by.it = false; target.it = true; target.frozen = CONFIG.FREEZE_MS; target.noCtl = CONFIG.FREEZE_MS / 1000;
  by.tagCd = target.tagCd = CONFIG.TAG_COOLDOWN_MS; target.lastTaggedBy = by.slot;
  Snd.play('tag');
}
function detectTags() {
  const live = P.filter(p => p.active);
  const itP = live.find(p => p.it); if (!itP) return;
  for (const other of live) {
    if (!tagAllowed(itP, other)) continue;
    if (hitGap(itP.x, itP.y, other.x, other.y) <= CONFIG.LOCAL_TAG_SLACK) { applyTag(itP, other); break; }
  }
}

function endRound() {
  S.ph = 'over';
  const ranked = P.filter(p => p.active).slice().sort((a, b) => a.itClock - b.itClock);
  S.ranked = ranked;
  const lowest = ranked[0].itClock;
  S.winners = ranked.filter(p => Math.abs(p.itClock - lowest) <= 100);
  Snd.play(S.winners.length > 1 ? 'draw' : 'win');
}

function tick(dtms) {
  const dt = dtms / 1000;
  if (S.ph === 'countdown') {
    S.t -= dtms;
    if (S.t <= 0) { S.ph = 'play'; S.t = S.roundMs; Snd.play('go'); }
    return;
  }
  if (S.ph !== 'play') return;
  S.t -= dtms;
  const live = P.filter(p => p.active);
  for (const p of live) {
    const inp = p.isBot ? botThink(p, live) : readHumanInput();
    stepPlayer(p, inp, dt, true);
  }
  detectTags();
  if (S.t <= 0) { S.t = 0; endRound(); }
}

/* ---------- render: greybox robots (real BSWV21 sprites land in a later commit) ---------- */
function drawRobot(c, p) {
  if (!p.active) return;
  const r = CONFIG.ROBOTS[p.robot] || CONFIG.ROBOTS[0];
  const x = p.x, yb = p.y, w = CONFIG.HIT_W, h = CONFIG.HIT_H;
  c.save();
  c.translate(x, yb - h);
  if (p.f < 0) c.scale(-1, 1);
  c.fillStyle = r.col; c.globalAlpha = p.frozen > 0 ? 0.55 : 1;
  const bob = p.onGround ? Math.sin(p.a) * 2 : 0;
  c.fillRect(-w / 2, bob, w, h);
  c.strokeStyle = CC.dk; c.lineWidth = 2; c.strokeRect(-w / 2, bob, w, h);
  c.globalAlpha = 1;
  c.restore();
  c.fillStyle = CC.t3; c.font = '600 11px system-ui'; c.textAlign = 'center';
  c.fillText(r.name, x, yb - h - (p.it ? 22 : 8));
  if (p.it) { c.fillStyle = '#ffd23d'; c.font = '700 11px system-ui'; c.fillText('IT', x, yb - h - 8); }
}

function drawHUD(c) {
  c.fillStyle = CC.pan; c.fillRect(0, 0, VW, CONFIG.HUD_H);
  c.strokeStyle = CC.bd; c.beginPath(); c.moveTo(0, CONFIG.HUD_H); c.lineTo(VW, CONFIG.HUD_H); c.stroke();
  c.fillStyle = CC.lt; c.font = '700 20px ui-monospace, monospace'; c.textAlign = 'center';
  c.fillText(S.ph === 'countdown' ? Math.ceil(S.t / 1000) : fmtTime(S.t), VW / 2, 31);
  c.textAlign = 'left'; c.font = '600 11px system-ui';
  let lx = 10;
  for (const p of P) { if (!p.active) continue; c.fillStyle = CONFIG.ROBOTS[p.robot].col; c.fillText(fmtClock(p.itClock), lx, 31); lx += 46; }
}

function drawPanel(c) {
  c.fillStyle = CC.pan; c.fillRect(0, PANEL_Y0, VW, CONFIG.PANEL_H);
  c.strokeStyle = CC.bd; c.beginPath(); c.moveTo(0, PANEL_Y0); c.lineTo(VW, PANEL_Y0); c.stroke();
  const J = CONFIG.JOY;
  c.strokeStyle = CC.bd; c.lineWidth = 3; c.beginPath(); c.arc(J.x, PANEL_Y0 + J.y, J.r, 0, 7); c.stroke();
  c.fillStyle = CC.md; c.beginPath(); c.arc(J.x + touch.jx, PANEL_Y0 + J.y + touch.jy, J.knob, 0, 7); c.fill();
  const JB = CONFIG.JUMPBTN;
  c.fillStyle = touch.jumpId >= 0 ? CC.md : CC.dk; c.strokeStyle = CC.bd; c.lineWidth = 2;
  c.beginPath(); c.roundRect(JB.x - JB.w / 2, PANEL_Y0 + JB.y - JB.h / 2, JB.w, JB.h, 16); c.fill(); c.stroke();
  c.fillStyle = CC.t3; c.font = '700 13px system-ui'; c.textAlign = 'center'; c.fillText('JUMP', JB.x, PANEL_Y0 + JB.y + 4);
}

function drawPlayfield(c) {
  c.fillStyle = CC.bg; c.fillRect(0, PLAY_Y0, VW, PLAY_H);
  c.strokeStyle = CC.dk; c.beginPath(); c.moveTo(0, FLOOR + 4); c.lineTo(VW, FLOOR + 4); c.stroke();
  for (const p of P) drawRobot(c, p);
  if (S.ph === 'countdown') { c.fillStyle = CC.lt; c.font = '700 48px system-ui'; c.textAlign = 'center'; c.fillText(Math.ceil(S.t / 1000) || 'GO!', VW / 2, PLAY_Y0 + PLAY_H / 2); }
  if (S.ph === 'over') {
    c.fillStyle = 'rgba(6,8,16,0.82)'; c.fillRect(0, PLAY_Y0, VW, PLAY_H);
    c.fillStyle = CC.lt; c.font = '700 22px system-ui'; c.textAlign = 'center';
    const label = S.winners.length > 1 ? 'SHARED WIN' : CONFIG.ROBOTS[S.winners[0].robot].name + ' WINS';
    c.fillText(label, VW / 2, PLAY_Y0 + 60);
    c.font = '600 13px system-ui';
    S.ranked.forEach((p, i) => { c.fillStyle = CONFIG.ROBOTS[p.robot].col; c.fillText(CONFIG.ROBOTS[p.robot].name + '  ' + fmtClock(p.itClock) + ' as It', VW / 2, PLAY_Y0 + 100 + i * 24); });
    c.fillStyle = CC.t2; c.font = '600 12px system-ui'; c.fillText('TAP TO PLAY AGAIN', VW / 2, PLAY_Y0 + PLAY_H - 40);
  }
  if (S.ph === 'title') {
    c.fillStyle = CC.lt; c.font = '700 28px system-ui'; c.textAlign = 'center'; c.fillText('BADSOFFWARE', VW / 2, PLAY_Y0 + PLAY_H / 2 - 10);
    c.font = '600 13px system-ui'; c.fillStyle = CC.t2; c.fillText('TAP TO PLAY', VW / 2, PLAY_Y0 + PLAY_H / 2 + 20);
  }
}

cv.addEventListener('pointerdown', () => {
  if (S.ph === 'title' || S.ph === 'over') startLocal(DEBUG_BOTS >= 0 ? DEBUG_BOTS : 2);
});

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dtms = now - last; last = now; if (dtms > 250) dtms = 250;
  acc += dtms;
  while (acc >= 1000 / 60) { tick(1000 / 60); acc -= 1000 / 60; }
  const c = cx; c.save(); c.scale(view.bs, view.bs);
  c.fillStyle = '#060810'; c.fillRect(0, 0, VW, VH);
  drawPlayfield(c); drawHUD(c); drawPanel(c);
  c.restore();
}
requestAnimationFrame(frame);

/* ---------- test hook: exposes state for automated tests only ---------- */
window.__bsw = { CONFIG, P, S, stepPlayer, resetPlayer, startLocal, tick, applyTag, tagAllowed, detectTags, endRound, hitGap, wrapX, wdx, FLOOR, VW, VH };
</script>
