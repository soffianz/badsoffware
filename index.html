const CC = CONFIG.C;
// unified power registry: drone-type ids (Drones mode) and character power ids (Character Powers
// mode) resolve through the same table, so usePower/the HUD panel/networking don't need to care
// which mode granted the held power. kind: 'self' = actor's own movement, applied instantly on
// the actor's own client (host or guest) then just claimed to the host for replication; 'aoe' =
// affects other robots, host-authoritative only (guest sends a claim, host applies it).
const POWERS = {
  bopster:     { name: 'BOPSTER',     col: '#ff5ec8', kind: 'self' },
  grumpulator: { name: 'GRUMPULATOR', col: '#ff8a3d', kind: 'aoe' },
  sneakfolder: { name: 'SNEAKFOLDER', col: '#ffc93d', kind: 'self' },
  patchcable:  { name: 'PATCH CABLE', col: '#3df5c4', kind: 'self' },
  zappulse:    { name: 'ZAP PULSE',   col: '#4db8ff', kind: 'aoe' },
  phaseblink:  { name: 'PHASE BLINK', col: '#b48cff', kind: 'self' },
  popbomb:     { name: 'POP-UP BOMB', col: '#ff4d6a', kind: 'aoe' },
};
const VW = CONFIG.W;
// VH/PLAY_H/PANEL_Y0 are mutable: doLayout() adapts the logical canvas height to the device's
// real aspect ratio (width stays fixed at 390 - the control panel/joystick are tuned for it) so
// the game fills the actual screen instead of letterboxing a fixed 390x844 into whatever aspect
// ratio the phone actually has. HUD_H and PANEL_H stay fixed in px; PLAY_H (and so how much of
// the world is visible at once) is what grows or shrinks.
let VH = CONFIG.H;
const PLAY_Y0 = CONFIG.HUD_H;
let PLAY_H = VH - CONFIG.HUD_H - CONFIG.PANEL_H;
let PANEL_Y0 = PLAY_Y0 + PLAY_H;
// world space: a fixed tower CONFIG.WORLD_H tall (390 wide, 2 screens of PLAY_H). FLOOR is the
// world ground (street level, where every robot spawns); the camera scrolls PLAY_H of it into view.
const WORLD_H = CONFIG.WORLD_H, FLOOR = WORLD_H - CONFIG.GROUND_MARGIN;
const QS = new URLSearchParams(location.search);
const DEBUG_BOTS = parseInt(QS.get('bots'), 10);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }

    c.globalAlpha = clamp(p.life / p.maxLife, 0, 1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, sy, p.size, 0, 7); c.fill();
  }

    c.globalAlpha = 1 - t; c.strokeStyle = r.col; c.lineWidth = 3; c.beginPath(); c.arc(r.x, sy, r.maxR * t, 0, 7); c.stroke();
  }

function usePower(p) {
  if (!p.held || S.ph !== 'play') return;
  // every other power needs the actor free to act; Patch Cable is the one exception - clearing
  // your own stun/frozen state is the whole point of it, so it has to be usable WHILE stunned.
  if (p.held !== 'patchcable' && (p.frozen > 0 || p.stun > 0)) return;
  const type = p.held; p.held = null; const C = CONFIG;
  if (type === 'bopster') { p.dashT = C.DASH_S; p.dashVX = C.DASH_V * (p.f || 1); p.boostT = C.DASH_BOOST_MS / 1000; Snd.play('dash'); burst(p.x, p.y - 18, '#ff5ec8', 6, 100); }
  else if (type === 'grumpulator') {
    const live = P.filter(o => o.active && o !== p);
    for (const o of live) if (Math.hypot(wdx(p.x, o.x), p.y - o.y) <= C.SLAM_R) { o.stun = C.SLAM_MS; burst(o.x, o.y - 20, '#ffd23d', 5, 70); }
    Snd.play('slam'); ring(p.x, p.y - 10, '#ff8a3d', C.SLAM_R, 0.4); shake(6, 0.25);
  } else if (type === 'sneakfolder' || type === 'phaseblink') {
    const col = POWERS[type].col;
    burst(p.x, p.y - 18, col, 7, 90);
    p.decoy = { x: p.x, y: p.y, f: p.f, t: C.DECOY_MS / 1000 };
    p.x = wrapX(p.x + C.BLINK_D * (p.f || 1));
    burst(p.x, p.y - 18, col, 7, 90);
    Snd.play('blink');
  } else if (type === 'patchcable') {
    p.stun = 0; p.frozen = 0; p.boostT = C.PATCH_BOOST_MS / 1000;
    Snd.play('dash'); burst(p.x, p.y - 18, POWERS.patchcable.col, 6, 90); ring(p.x, p.y - 10, POWERS.patchcable.col, 40, 0.3);

    const live = P.filter(o => o.active && o !== p);
    for (const o of live) if (Math.hypot(wdx(p.x, o.x), p.y - o.y) <= C.ZAP_R) { o.stun = C.ZAP_MS; burst(o.x, o.y - 20, POWERS.zappulse.col, 5, 70); }
    Snd.play('slam'); ring(p.x, p.y - 10, POWERS.zappulse.col, C.ZAP_R, 0.3); shake(4, 0.15);
  } else if (type === 'popbomb') {
    S.bombs.push({ id: ++S.bombSeq, x: p.x, y: p.y, t: C.BOMB_FUSE_MS, owner: p.slot });

}
function bombsStep(dtms) {
  for (let i = S.bombs.length - 1; i >= 0; i--) {
    const b = S.bombs[i]; b.t -= dtms;
    if (b.t <= 0) {
      const live = P.filter(p => p.active);
      for (const o of live) if (Math.hypot(wdx(b.x, o.x), b.y - o.y) <= CONFIG.BOMB_R) { o.stun = CONFIG.BOMB_STUN_MS; burst(o.x, o.y - 20, POWERS.popbomb.col, 6, 90); }
      Snd.play('slam'); ring(b.x, b.y - 10, POWERS.popbomb.col, CONFIG.BOMB_R, 0.4); shake(6, 0.25);
      S.bombs.splice(i, 1);
    }
  }
}

function endRound() {
  S.ph = 'over';
  P.forEach(p => p.held = null);
  const ranked = P.filter(p => p.active).slice().sort((a, b) => a.itClock - b.itClock);
  S.ranked = ranked;
  const lowest = ranked[0].itClock;
  S.winners = ranked.filter(p => Math.abs(p.itClock - lowest) <= 100);
  const mySlot = NET.mode === 'local' ? 0 : NET.mySlot, iWon = S.winners.some(p => p.slot === mySlot);
  Snd.play(S.winners.length > 1 ? 'draw' : (iWon ? 'win' : 'lose'));
}

function tick(dtms) {
  const dt = dtms / 1000;
  if (NET.mode !== 'local') { netTick(dtms); return; }
  if (S.ph === 'countdown') {
    S.t -= dtms;
    if (S.t <= 0) { S.ph = 'play'; S.t = S.roundMs; Snd.play('go'); }
    return;
  }
  if (S.ph !== 'play') return;
  S.t -= dtms;
  const live = P.filter(p => p.active);
  for (const p of live) {
    const inp = p.isBot ? botThink(p, live) : readHumanInput();
    stepPlayer(p, inp, dt, true);
    if (p.isBot ? botWantsPower(p, live) : inp.pwr) usePower(p);
  }
  detectTags();
  dronesStep(dtms);
  bombsStep(dtms);
  camStep(dt); fxStep(dt);
  if (S.t <= 0) { S.t = 0; endRound(); }
}

/* ---------- networked tick: each phone steps only its own robot; the host alone runs
   round/drone/It-clock bookkeeping and validates claims; everyone else just applies what
   the host broadcasts (section 11) ---------- */
function netTick(dtms) {
  const dt = dtms / 1000, now = performance.now();
  NET.lastSentT += dtms;
  if (NET.lastSentT >= 1000 / CONFIG.STATE_HZ) { NET.lastSentT = 0; Net.send(myStateMsg()); }

  if (S.ph === 'play') {
    const me = P[NET.mySlot];
    if (me && me.active) {
      const inp = readHumanInput();
      stepPlayer(me, inp, dt, true);
      if (inp.pwr && me.held) {
        if (NET.isHost) usePower(me);
        else {
          const type = me.held;
          if (POWERS[type].kind === 'self') usePower(me);   // self-movement: client-authoritative, instant
          else me.held = null;                              // aoe: no self movement, host applies the effect
          Net.send({ type: 'claim_power', slot: NET.mySlot, power: type, x: me.x, y: me.y });
        }
      }
      if (me.it) {
        const others = P.filter(p => p.active && p !== me);
        for (const o of others) {
          if (!tagAllowed(me, o)) continue;
          if (hitGap(me.x, me.y, o.x, o.y) <= CONFIG.LOCAL_TAG_SLACK) {
            if (NET.isHost) applyTag(me, o); else Net.send({ type: 'claim_tag', by: NET.mySlot, target: o.slot, x: me.x, y: me.y });
            break;
          }
        }
      }
      for (const d of S.drones) {
        if (Math.hypot(wdx(me.x, d.x), me.y - d.y) > CONFIG.CATCH_R) continue;
        if (NET.isHost) catchBadsoff(me, d); else Net.send({ type: 'claim_catch', slot: NET.mySlot, droneId: d.id, x: me.x, y: me.y });
        break;
      }
    }
  }

  if (NET.isHost) {
    if (S.ph === 'countdown') { S.t -= dtms; if (S.t <= 0) { S.ph = 'play'; S.t = S.roundMs; Snd.play('go'); } }
    else if (S.ph === 'play') {
      S.t -= dtms;
      const itP = P.find(p => p.active && p.it); if (itP) itP.itClock += dt * 1000;
      dronesStep(dtms);
      bombsStep(dtms);
      if (S.t <= 0) { S.t = 0; endRound(); }
    }
    for (let i = 1; i < CONFIG.MAX_SLOTS; i++) {
      const peer = NET.peers[i];
      if (!peer || !peer.connected) continue;
      if (now - peer.lastSeen > CONFIG.PEER_TIMEOUT_MS) {
        peer.connected = false;
        if (P[i].active && P[i].it && S.ph === 'play') { const pool = P.filter(p => p.active && p !== P[i]); if (pool.length) { P[i].it = false; pool[Math.floor(Math.random() * pool.length)].it = true; } }
        P[i].active = false;
        if (P.filter(p => p.active).length <= 1 && S.ph === 'play') endRound();
      }
    }
    NET.lastSharedT += dtms;
    if (NET.lastSharedT >= 1000 / CONFIG.SHARED_HZ) { NET.lastSharedT = 0; Net.send(sharedSnapshot()); }
  }
  camStep(dt); fxStep(dt);
}

/* ---------- art: the processed BSWV21 pack (tools/process_bswv21.py + embed_art_v2.py), embedded

   loaded/`?noart=1` - the game must never depend on art to run (PRD section 15). ---------- */
const NOART = QS.get('noart') === '1';

  for (const name in ART_DATA.badsoffwares) { Art.badsoffwares[name] = { anims: {} }; for (const anim in ART_DATA.badsoffwares[name].anims) specs.push(['badsoffwares', name, anim]); }
  if (!specs.length) return;

    const d = ART_DATA[cat][name].anims[anim];
    loadStrip(d.src, im => { if (im) Art[cat][name].anims[anim] = { img: im, frames: d.frames }; loaded++; if (loaded === specs.length) Art.ready = true; });
  });

initArt();
/* ---------- scenery: BSWV21 Page tileset (tools/process_page.py + embed_scenery.py). Same
   never-depend-on-art rule as the characters: falls back to flat colour / plain bars. ---------- */
const Scenery = { ready: false, bgFar: null, bgMid: null, bgFarH: 0, bgMidH: 0, street: null, streetH: 0, platformSkins: [], props: {} };
function initScenery() {
  if (!SCENERY_DATA || NOART) return;
  const jobs = [];
  jobs.push(cb => loadStrip(SCENERY_DATA.bgFar, im => { Scenery.bgFar = im; cb(); }));
  jobs.push(cb => loadStrip(SCENERY_DATA.bgMid, im => { Scenery.bgMid = im; cb(); }));
  jobs.push(cb => loadStrip(SCENERY_DATA.street, im => { Scenery.street = im; cb(); }));
  Scenery.bgFarH = SCENERY_DATA.bgFarH; Scenery.bgMidH = SCENERY_DATA.bgMidH; Scenery.streetH = SCENERY_DATA.streetH;
  SCENERY_DATA.platformSkins.forEach((skin, i) => {
    Scenery.platformSkins[i] = {};
    skin.forEach(p => jobs.push(cb => loadStrip(p.src, im => { Scenery.platformSkins[i][p.tag] = { img: im, w: p.w, h: p.h }; cb(); })));
  });
  for (const name in SCENERY_DATA.props) {
    const p = SCENERY_DATA.props[name];
    jobs.push(cb => loadStrip(p.src, im => { Scenery.props[name] = { img: im, w: p.w, h: p.h }; cb(); }));
  }

initScenery();
const ANIM_FPS = { idle: 6, run: 14, jump: 10, fall: 10, land: 14, tagged: 8 };
function pickRobotAnim(p) {
  if (p.frozen > 0) return 'tagged';
  if (!p.onGround) return p.vy < 0 ? 'jump' : 'fall';
  if (p.landT > 0) return 'land';
  if (Math.abs(p.vx) > 15) return 'run';
  return 'idle';
}
function drawRobotArt(c, p, robotDef, anim) {
  const a = robotDef.anims[anim] || robotDef.anims.idle; if (!a) return false;
  const fps = ANIM_FPS[anim] || 10, frame = Math.floor(p.t * fps) % a.frames;
  const fw = a.img.width / a.frames, fh = a.img.height;
  let ox = 0, oy = 0;
  if (a.frames === 1 && anim === 'idle') oy = Math.sin(p.t * 3.5) * 1.4;        // code-driven bob (stopgap idle)
  if (a.frames === 1 && anim === 'tagged') ox = Math.sin(p.t * 32) * 1.6;       // code-driven shake (stopgap tagged)
  c.imageSmoothingEnabled = false;
  c.drawImage(a.img, frame * fw, 0, fw, fh, -42 + ox, -82 + oy, 84, 84);
  return true;

/* ---------- render: backdrop, robots, Badsoffwares and the tower ---------- */
function mod(a, b) { return ((a % b) + b) % b; }
function drawBg(c) {
  if (!Scenery.ready) { c.fillStyle = CC.bg; c.fillRect(-10, PLAY_Y0 - 10, VW + 20, PLAY_H + 20); return; }
  c.fillStyle = '#060a14'; c.fillRect(-10, PLAY_Y0 - 10, VW + 20, PLAY_H + 20);
  const farY = -mod(cam.y * 0.15, Scenery.bgFarH);
  for (let y = farY - Scenery.bgFarH; y < PLAY_H + 20; y += Scenery.bgFarH) c.drawImage(Scenery.bgFar, 0, PLAY_Y0 + y, VW, Scenery.bgFarH);
  const midY = -mod(cam.y * 0.45, Scenery.bgMidH);
  for (let y = midY - Scenery.bgMidH; y < PLAY_H + 20; y += Scenery.bgMidH) c.drawImage(Scenery.bgMid, 0, PLAY_Y0 + y, VW, Scenery.bgMidH);
}
const PLAT_COLS = ['#2d4560', '#2d5660', '#3d4a60', '#39606a'];
function drawPlatformArt(c, pl, sy) {
  const skin = Scenery.platformSkins[pl.colIdx % Scenery.platformSkins.length];
  if (!skin || !skin.mid) return false;
  const leftW = skin.left ? skin.left.w : 0, rightW = skin.right ? skin.right.w : 0;
  const midAvail = Math.max(4, pl.w - leftW - rightW), mw = skin.mid.w;
  c.imageSmoothingEnabled = false;

    c.drawImage(skin.mid.img, 0, 0, skin.mid.img.width * (drawW / mw), skin.mid.img.height, mx, sy, drawW, skin.mid.h);
    mx += mw;

  if (skin.right) c.drawImage(skin.right.img, pl.x + pl.w - rightW, sy, rightW, skin.right.h);
  return true;
}
function drawPlatforms(c) {
  const artOk = Scenery.ready && !NOART;
  for (const pl of L.plats) {
    const sy = pl.y - cam.y + PLAY_Y0;
    if (sy < PLAY_Y0 - 70 || sy > PLAY_Y0 + PLAY_H + 70) continue;
    let drew = false;
    if (artOk) {
      // flat dark offset slab instead of a real shadowBlur (which tanked frame rate when drawn
      // per tile piece every frame) - same "lifts off the background" read, costs one fillRect
      c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(pl.x - 1, sy + 3, pl.w + 2, pl.h);
      drew = drawPlatformArt(c, pl, sy);

        c.strokeStyle = 'rgba(145,235,255,0.65)'; c.lineWidth = 1;
        c.strokeRect(pl.x + 0.5, sy + 0.5, pl.w - 1, pl.h - 1);
        c.fillStyle = 'rgba(145,235,255,0.9)'; c.fillRect(pl.x, sy, pl.w, 1.5);
      }
    }
    if (!drew) {
      c.fillStyle = PLAT_COLS[pl.colIdx % PLAT_COLS.length]; c.fillRect(pl.x, sy, pl.w, pl.h);
      c.fillStyle = CC.cyan; c.fillRect(pl.x, sy, pl.w, 2);
    }
  }
  const bbProp = artOk ? Scenery.props.billboard : null;
  for (const b of L.billboards) {
    const sy = b.y - cam.y + PLAY_Y0;
    if (sy < PLAY_Y0 - 70 || sy > PLAY_Y0 + PLAY_H + 70) continue;
    if (bbProp) { c.imageSmoothingEnabled = false; c.drawImage(bbProp.img, b.x - bbProp.w / 2, sy - bbProp.h * 0.55, bbProp.w, bbProp.h); }
    else { c.strokeStyle = CC.bd; c.lineWidth = 2; c.strokeRect(b.x - 18, sy - 14, 36, 28); c.fillStyle = CC.dk; c.fillRect(b.x - 18, sy - 14, 36, 28); }
  }

    const street = artOk ? Scenery.street : null;
    if (street) { c.imageSmoothingEnabled = false; c.drawImage(street, 0, fy + 4 - Scenery.streetH, VW, Scenery.streetH); }
    // bright ground line, drawn over the art/backstop so the floor boundary always pops
    c.fillStyle = 'rgba(145,235,255,0.9)'; c.fillRect(0, fy + 2, VW, 2.5);
    c.strokeStyle = CC.cyan; c.lineWidth = 1; c.globalAlpha = 0.5;
    c.beginPath(); c.moveTo(0, fy + 4); c.lineTo(VW, fy + 4); c.stroke(); c.globalAlpha = 1;
  }
}
const SPAWN_ANIM_S = 0.4;
function drawDrones(c) {

    const sy = d.y - cam.y + PLAY_Y0;
    if (sy < PLAY_Y0 - 30 || sy > PLAY_Y0 + PLAY_H + 30) continue;
    const def = CONFIG.BADSOFF[d.type], artDef = (Art.ready && !NOART) ? Art.badsoffwares[d.type] : null;
    const spawning = d.spawnT > 0;
    let drew = false;
    if (artDef) {

      const a = artDef.anims[animName];
      if (a) {

          ? clamp(Math.floor((1 - d.spawnT / SPAWN_ANIM_S) * a.frames), 0, a.frames - 1)
          : Math.floor((d.age / 1000) * 8) % a.frames;
        const fw = a.img.width / a.frames, fh = a.img.height;

      c.strokeStyle = CC.dk; c.lineWidth = 1.5; c.stroke();

  }
}
function drawBombs(c) {

}

  c.save(); c.globalAlpha = clamp(p.decoy.t / (CONFIG.DECOY_MS / 1000), 0, 1) * 0.5;

const MINI = { w: 10, inset: 6 };

function menuBtn(c, x, y, w, h, label, sub, iconFn, col) {
  c.save();

  c.globalAlpha = 1;

// drawBattleSettings; the selected tile is highlighted, every tile's rect is returned for hit-testing
function segRow(c, x, y, w, h, labels, selIdx, fontPx) {
  const gap = 8, n = labels.length, bw = (w - gap * (n - 1)) / n, rects = [];
  labels.forEach((label, i) => {
    const bx = x + i * (bw + gap), sel = i === selIdx;
    c.strokeStyle = sel ? CC.cyan : CC.bd; c.lineWidth = sel ? 2.5 : 2; c.fillStyle = sel ? CC.md : CC.pan;
    c.beginPath(); c.roundRect(bx, y, bw, h, 8); c.fill(); c.stroke();
    c.fillStyle = sel ? CC.lt : CC.t2; c.font = '700 ' + (fontPx || 13) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(label, bx + bw / 2, y + h / 2 + (fontPx || 13) * 0.36);
    rects.push({ x: bx, y, w: bw, h });
  });
  return rects;
}

        S.gameMode = NET.gameMode;
        buildLayout(Math.floor(Math.random() * LAYOUTS.length));
        P.forEach(p => { if (p.active) resetPlayer(p, p.slot, CONFIG.MAX_SLOTS); });

function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
