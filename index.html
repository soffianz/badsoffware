const WORLD_H = CONFIG.WORLD_H, FLOOR = WORLD_H - CONFIG.GROUND_MARGIN;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
function wdx(a, b) { let d = b - a; if (d > VW / 2) d -= VW; else if (d < -VW / 2) d += VW; return d; }
function wrapX(x) { return x < 0 ? x + VW : x >= VW ? x - VW : x; }
function hitGap(ax, ay, bx, by) { const dx = Math.abs(wdx(ax, bx)) - CONFIG.HIT_W, dy = Math.abs(ay - by) - CONFIG.HIT_H; return Math.hypot(dx > 0 ? dx : 0, dy > 0 ? dy : 0); }
function mulberry(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
function fmtClock(ms) { return (ms / 1000).toFixed(1) + 's'; }
function tryDo(f) { try { return f(); } catch (e) { return undefined; } }
function ivGap(ax, aw, bx, bw) {                 // wrap-aware edge-to-edge gap between two x-intervals, 0 if overlapping
  let best = 1e9;
  for (let k = -1; k <= 1; k++) { const bxw = bx + k * VW; const d = Math.max(0, ax - (bxw + bw), bxw - (ax + aw)); if (d < best) best = d; }
  return best;
}
function overlapX(px, pl) {                      // robot hitbox (feet x) over a platform's x-interval, wrap aware
  const a0 = px - CONFIG.HIT_W / 2, a1 = px + CONFIG.HIT_W / 2;
  for (let k = -1; k <= 1; k++) { const o = k * VW; if (a1 + o > pl.x && a0 + o < pl.x + pl.w) return true; }
  return false;

/* ---------- tower layouts ----------
   Platform format {x, y (top surface, world space), w, h, zone, col}. Built from fixed seeds with
   no Math.random, so every phone builds the identical tower. Reachability (every platform gets a
   path from the floor: climbing needs rise <= RISE_MAX and gap <= GAP_MAX; falling only needs

  openTabs(code) { this.kind = 'tabs'; this.chan = new BroadcastChannel('bsw-net-' + code); this.chan.onmessage = e => this.onMsg && this.onMsg(e.data); },
  send(msg) {                                       // from a guest: to the host only. from the host: to everyone.
    msg.from = this.clientId;
    if (this.kind === 'tabs' && this.chan) this.chan.postMessage(msg);
    else if (this.kind === 'peer') this._peerSend(msg);
  },
  close() { tryDo(() => this.chan && this.chan.close()); this.chan = null; tryDo(() => this.peer && this.peer.destroy()); this.peer = null; this.conns = {}; this.kind = 'none'; },
  // PeerJS implementation (section 11): loaded lazily from cdnjs, pinned per DECISIONS.md. Not
  // exercised by the automated tests in this sandbox (no real network peer to dial) - the tabs
  // transport above is what test/v2_net.mjs actually drives; this path is code-complete but
  // unverified against a real PeerJS broker, same caveat v1's DECISIONS.md already carries.
  _peerLib: null,
  loadPeerLib(cb) {
    if (window.Peer) { this._peerLib = window.Peer; return cb(true); }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
    s.onload = () => { this._peerLib = window.Peer; cb(!!window.Peer); };
    s.onerror = () => cb(false);
    document.head.appendChild(s);
  },
  hostPeer(code, cb) {
    this.loadPeerLib(ok => {
      if (!ok) return cb(false);
      this.kind = 'peer';
      this.peer = new this._peerLib('bsw-' + code, { config: { iceServers: CONFIG.ICE_SERVERS } });
      this.peer.on('open', () => cb(true));
      this.peer.on('error', () => cb(false, 'taken'));
      this.peer.on('connection', c => { this.conns[c.peer] = c; c.on('data', d => this.onMsg && this.onMsg(d)); });
    });
  },
  joinPeer(code, cb) {
    this.loadPeerLib(ok => {
      if (!ok) return cb(false);
      this.kind = 'peer';
      this.peer = new this._peerLib(undefined, { config: { iceServers: CONFIG.ICE_SERVERS } });
      this.peer.on('open', () => {
        const c = this.peer.connect('bsw-' + code);
        c.on('open', () => { this.conns.host = c; cb(true); });
        c.on('data', d => this.onMsg && this.onMsg(d));
        c.on('error', () => cb(false));
      });
      this.peer.on('error', () => cb(false));
    });
  },
  _peerSend(msg) {
    if (NET.isHost) { for (const id in this.conns) tryDo(() => this.conns[id].send(msg)); }
    else if (this.conns.host) tryDo(() => this.conns.host.send(msg));
  },
};

/* host/guest session bookkeeping, layered on top of the local-session state (P, S, L) */
const NET = {
  mode: 'local',             // 'local' | 'host' | 'guest'
  isHost: false, mySlot: 0, code: '',
  peers: [{ connected: true, lastSeen: 0, token: '' }, null, null, null],   // host bookkeeping, index = slot
  tokens: {},                 // slot -> reconnect token (host-side)
  myToken: '', lastSentT: 0, lastSharedT: 0, picks: [0, 1, 2, 3], ready: [false, false, false, false],
  roundLenMin: 2,
};
function netReset() {
  NET.mode = 'local'; NET.isHost = false; NET.mySlot = 0; NET.code = '';
  NET.peers = [{ connected: true, lastSeen: 0, token: '' }, null, null, null];
  NET.tokens = {}; NET.picks = [0, 1, 2, 3]; NET.ready = [false, false, false, false]; NET.roundLenMin = 2;
  Net.close();
}
function sharedSnapshot() {
  return {
    type: 'shared', ph: S.ph, t: S.t, roundMs: S.roundMs, layoutIdx: L.idx, cdSeed: L.idx,
    drones: S.drones.map(d => ({ id: d.id, type: d.type, x: d.x, y: d.y, bb: L.billboards.indexOf(d.billboard), age: d.age, spawnT: d.spawnT })),
    billboardsOccupied: L.billboards.map(b => b.occupied), feed: S.feed.map(f => f.msg),
    picks: NET.picks.slice(), ready: NET.ready.slice(), roundLenMin: NET.roundLenMin,
    robots: P.map(p => ({ active: p.active, it: p.it, itClock: p.itClock, frozen: p.frozen, tagCd: p.tagCd, held: p.held, stun: p.stun })),

}
function applySharedSnapshot(m) {
  S.ph = m.ph; S.t = m.t; S.roundMs = m.roundMs; S.feed = m.feed.map(msg => ({ msg, t: 3 }));
  if (L.idx !== m.layoutIdx) buildLayout(m.layoutIdx);
  L.billboards.forEach((b, i) => b.occupied = m.billboardsOccupied[i]);
  const haveIds = new Set(S.drones.map(d => d.id));
  S.drones = m.drones.map(d => {
    const existing = S.drones.find(x => x.id === d.id);
    return existing ? Object.assign(existing, { x: d.x, y: d.y, age: d.age }) : { id: d.id, type: d.type, x: d.x, y: d.y, billboard: L.billboards[d.bb], age: d.age, spawnT: d.spawnT };
  });
  NET.picks = m.picks.slice(); NET.ready = m.ready.slice(); NET.roundLenMin = m.roundLenMin;
  // frozen/tagCd/held/stun are host-owned regardless of who controls movement - a client needs
  // its own values too (stepPlayer reads them to gate control), so these are never skipped for self.
  m.robots.forEach((r, i) => {
    const p = P[i]; p.active = r.active; p.it = r.it; p.itClock = r.itClock;
    p.frozen = r.frozen; p.tagCd = r.tagCd; p.held = r.held; p.stun = r.stun;
  });
}
function myStateMsg() {
  const p = P[NET.mySlot];
  return { type: 'state', slot: NET.mySlot, x: p.x, y: p.y, f: p.f, a: p.a, onGround: p.onGround, robot: p.robot };
}
function applyStateMsg(m) {
  if (m.slot === NET.mySlot) return;
  const p = P[m.slot]; if (!p) return;
  p.x = m.x; p.y = m.y; p.f = m.f; p.a = m.a; p.onGround = m.onGround; p.robot = m.robot;
  if (NET.isHost && NET.peers[m.slot]) NET.peers[m.slot].lastSeen = performance.now();
}
function netOnMessage(m) {
  if (m.from === Net.clientId) return;
  if (m.to && m.to !== Net.clientId) return;    // tabs transport broadcasts to everyone; targeted messages filter here
  if (NET.isHost) {
    if (m.type === 'join') { hostAdmitGuest(m); return; }
    if (m.type === 'state') { applyStateMsg(m); Net.send(Object.assign({}, m)); return; }   // relay to the others
    if (m.type === 'ready') { NET.ready[m.slot] = m.ready; return; }
    if (m.type === 'pick') { NET.picks[m.slot] = m.robot; return; }
    if (m.type === 'claim_tag') { hostHandleTagClaim(m); return; }
    if (m.type === 'claim_catch') { hostHandleCatchClaim(m); return; }
    if (m.type === 'claim_power') { hostHandleClaimPower(m); return; }
    if (m.type === 'start') { return; }
    if (m.type === 'ping') { Net.send({ type: 'pong', to: m.from, t: m.t }); return; }
  } else {
    if (m.type === 'welcome') {
      NET.mySlot = m.slot; NET.myToken = m.token; S.connecting = false;
      P[NET.mySlot].active = true; P[NET.mySlot].robot = NET.mySlot;
      tryDo(() => sessionStorage.setItem('bsw_token_' + NET.code, m.token));
      return;
    }
    if (m.type === 'full') { S.connecting = false; S.connectError = 'ROOM FULL'; return; }
    if (m.type === 'shared') { applySharedSnapshot(m); return; }
    if (m.type === 'state') { applyStateMsg(m); return; }
  }
}
Net.onMsg = netOnMessage;

function hostAdmitGuest(m) {
  let slot = -1;
  if (m.token && NET.tokens[m.token] !== undefined) slot = NET.tokens[m.token];
  else { for (let i = 1; i < CONFIG.MAX_SLOTS; i++) if (!NET.peers[i] || !NET.peers[i].connected) { slot = i; break; } }
  if (slot < 0) { Net.send({ type: 'full', to: m.from }); return; }
  const token = m.token || (Math.random().toString(36).slice(2, 10));
  NET.tokens[token] = slot; NET.peers[slot] = { connected: true, lastSeen: performance.now(), token };
  P[slot].active = true; P[slot].robot = slot; if (!NET.ready[slot]) NET.ready[slot] = false; NET.picks[slot] = slot;
  Net.send({ type: 'welcome', to: m.from, slot, token, code: NET.code });
}
function hostHandleTagClaim(m) {
  const by = P[m.by], target = P[m.target]; if (!by || !target) return;
  if (!tagAllowed(by, target)) return;
  if (hitGap(m.x, m.y, target.x, target.y) <= CONFIG.TAG_TOL) applyTag(by, target);
}
function hostHandleCatchClaim(m) {
  const p = P[m.slot], d = S.drones.find(d => d.id === m.droneId); if (!p || !d) return;
  if (Math.hypot(wdx(m.x, d.x), m.y - d.y) <= CONFIG.CATCH_R + 20) catchBadsoff(p, d);
}
function hostHandleClaimPower(m) {
  // Dash Burst / Phase Blink are self-movement: the actor's own phone already applied them
  // (section 11, "the user's phone applies self-movement at once"). Ground Slam has no self
  // movement, so the host applies its area effect here, using the actor's reported position.
  if (m.power !== 'grumpulator') return;
  const p = P[m.slot]; if (!p) return;
  const live = P.filter(o => o.active && o !== p);
  for (const o of live) if (Math.hypot(wdx(m.x, o.x), m.y - o.y) <= CONFIG.SLAM_R) o.stun = CONFIG.SLAM_MS;
}

/* ---------- session: up to 4 players, It-clock scoring, local/practice for now ---------- */
const P = [mkPlayer(0), mkPlayer(1), mkPlayer(2), mkPlayer(3)];
const S = { ph: 'title', n: 0, roundMs: CONFIG.ROUND_MS, t: 0, cdT: 0, drones: [], droneSeq: 0, spawnT: 0, feed: [],
  codeBuf: '', connecting: false, connectError: '' };

function startLocal(nBots) {
  const n = clamp(1 + (Number.isFinite(nBots) ? nBots : 2), 2, CONFIG.MAX_SLOTS);
  S.n = n;
  buildLayout(Math.floor(Math.random() * LAYOUTS.length));
  for (let i = 0; i < CONFIG.MAX_SLOTS; i++) {
    const p = P[i];
    p.active = i < n; p.isBot = i > 0; p.robot = i;
    if (p.active) resetPlayer(p, i, n);
  }
  P[0].isBot = false;
  S.t = CONFIG.COUNTDOWN_MS; S.ph = 'countdown';
  S.drones = []; S.droneSeq = 0; S.spawnT = CONFIG.SPAWN_FIRST_MS; S.feed = [];
  L.billboards.forEach(b => b.occupied = false);
  const live = P.filter(p => p.active);
  live.forEach(p => p.it = false);
  live[Math.floor(Math.random() * live.length)].it = true;
  camSnap();
  Snd.play('cd');
}

function tagAllowed(by, target) { return by.active && target.active && by !== target && by.it && !target.it && by.frozen <= 0 && target.frozen <= 0 && by.tagCd <= 0 && target.tagCd <= 0; }
function applyTag(by, target) {
  by.it = false; target.it = true; target.frozen = CONFIG.FREEZE_MS; target.noCtl = CONFIG.FREEZE_MS / 1000;
  by.tagCd = target.tagCd = CONFIG.TAG_COOLDOWN_MS; target.lastTaggedBy = by.slot;
  Snd.play('tag'); burst(target.x, target.y - 20, '#fff', 8, 140); ring(target.x, target.y - 20, '#ff4d6a', 36, 0.3); shake(4, 0.15);
}
function detectTags() {
  const live = P.filter(p => p.active);
  const itP = live.find(p => p.it); if (!itP) return;
  for (const other of live) {
    if (!tagAllowed(itP, other)) continue;
    if (hitGap(itP.x, itP.y, other.x, other.y) <= CONFIG.LOCAL_TAG_SLACK) { applyTag(itP, other); break; }
  }
}

/* ---------- Badsoffware power-ups (PRD section 8) ---------- */
const BADSOFF_IDS = Object.keys(CONFIG.BADSOFF);
function pickWeighted(excludeHijack) {
  const pool = BADSOFF_IDS.filter(id => !(excludeHijack && id === 'hijacker'));
  const total = pool.reduce((s, id) => s + CONFIG.BADSOFF[id].weight, 0);
  let r = Math.random() * total;
  for (const id of pool) { r -= CONFIG.BADSOFF[id].weight; if (r <= 0) return id; }
  return pool[pool.length - 1];
}
function pushFeed(msg) { S.feed.push({ msg, t: 3 }); if (S.feed.length > 3) S.feed.shift(); }
function trySpawnBadsoff() {
  if (S.drones.length >= CONFIG.SPAWN_MAX) return;
  const hijackersAlive = S.drones.filter(d => d.type === 'hijacker').length;
  const type = pickWeighted(hijackersAlive >= CONFIG.SPAWN_MAX_HIJACK);
  const live = P.filter(p => p.active);
  const free = L.billboards.filter(b => !b.occupied && live.every(p => Math.hypot(wdx(p.x, b.x), p.y - b.y) > CONFIG.SPAWN_AVOID));
  if (!free.length) return;
  const b = free[Math.floor(Math.random() * free.length)];
  b.occupied = true;
  S.drones.push({ id: ++S.droneSeq, type, x: b.x, y: b.y, billboard: b, age: 0, spawnT: 0.4 });
}
function applyHijack(catcher) {
  const live = P.filter(p => p.active), oldIt = live.find(p => p.it);
  const pool = live.filter(p => p !== oldIt); if (!pool.length) return;
  const newIt = pool[Math.floor(Math.random() * pool.length)];
  if (oldIt) { oldIt.it = false; oldIt.tagCd = CONFIG.TAG_COOLDOWN_MS; }
  newIt.it = true; newIt.frozen = CONFIG.FREEZE_MS; newIt.noCtl = CONFIG.FREEZE_MS / 1000; newIt.tagCd = CONFIG.TAG_COOLDOWN_MS;
  pushFeed(CONFIG.ROBOTS[catcher.robot].name + ' HIJACKED IT TO ' + CONFIG.ROBOTS[newIt.robot].name);
  Snd.play('hijack'); ring(newIt.x, newIt.y - 20, '#3de6ff', 46, 0.4); burst(newIt.x, newIt.y - 20, '#3de6ff', 10, 110); shake(5, 0.2);
}
function catchBadsoff(p, d) {
  S.drones.splice(S.drones.indexOf(d), 1); d.billboard.occupied = false;
  const def = CONFIG.BADSOFF[d.type];
  if (!def.holdable) { applyHijack(p); return; }
  p.held = d.type;
  pushFeed(CONFIG.ROBOTS[p.robot].name + ' CAUGHT ' + def.name);
  Snd.play('catch_'); burst(p.x, p.y - 20, def.col, 6, 90);
}
function dronesStep(dtms) {
  const dt = dtms / 1000, live = P.filter(p => p.active);
  S.spawnT -= dtms;
  if (S.spawnT <= 0) { trySpawnBadsoff(); S.spawnT = CONFIG.SPAWN_MS; }
  for (let i = S.drones.length - 1; i >= 0; i--) {
    const d = S.drones[i];
    d.age += dtms; if (d.spawnT > 0) d.spawnT -= dt;
    if (d.age >= CONFIG.GLITCH_MS) { S.drones.splice(i, 1); d.billboard.occupied = false; burst(d.x, d.y, CONFIG.BADSOFF[d.type].col, 5, 50); continue; }
    d.y = d.billboard.y + Math.sin((d.age / 1000) * 2 + d.id) * 6;   // simple hover bob
    for (const p of live) if (Math.hypot(wdx(p.x, d.x), p.y - d.y) <= CONFIG.CATCH_R) { catchBadsoff(p, d); break; }
  }
  for (let i = S.feed.length - 1; i >= 0; i--) { S.feed[i].t -= dt; if (S.feed[i].t <= 0) S.feed.splice(i, 1); }
}
/* ---------- effects: pooled particles, expanding rings, light screen shake ---------- */
const FX = { parts: [], rings: [], shakeT: 0, shakeMag: 0 };
const PART_POOL = 220;
function spawnPart(x, y, vx, vy, life, size, col) {
  if (FX.parts.length >= PART_POOL) FX.parts.shift();
  FX.parts.push({ x, y, vx, vy, life, maxLife: life, size, col });
}
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = spd * (0.5 + Math.random() * 0.5); spawnPart(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.35 + Math.random() * 0.3, 2 + Math.random() * 2, col); }
}
function ring(x, y, col, maxR, life) { FX.rings.push({ x, y, col, t: 0, life, maxR }); }
function shake(mag, t) { FX.shakeT = Math.max(FX.shakeT, t); FX.shakeMag = Math.max(FX.shakeMag, mag); }
function fxStep(dt) {
  for (let i = FX.parts.length - 1; i >= 0; i--) { const p = FX.parts[i]; p.life -= dt; if (p.life <= 0) { FX.parts.splice(i, 1); continue; } p.x = wrapX(p.x + p.vx * dt); p.y += p.vy * dt; p.vy += 400 * dt; }
  for (let i = FX.rings.length - 1; i >= 0; i--) { const r = FX.rings[i]; r.t += dt; if (r.t >= r.life) FX.rings.splice(i, 1); }
  if (FX.shakeT > 0) { FX.shakeT -= dt; if (FX.shakeT <= 0) FX.shakeMag = 0; }
}
function fxDraw(c) {
  for (const p of FX.parts) {
    const sy = p.y - cam.y + PLAY_Y0; if (sy < PLAY_Y0 - 20 || sy > PLAY_Y0 + PLAY_H + 20) continue;
    c.globalAlpha = clamp(p.life / p.maxLife, 0, 1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, sy, p.size, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  for (const r of FX.rings) {
    const sy = r.y - cam.y + PLAY_Y0, t = r.t / r.life;
    c.globalAlpha = 1 - t; c.strokeStyle = r.col; c.lineWidth = 3; c.beginPath(); c.arc(r.x, sy, r.maxR * t, 0, 7); c.stroke();
  }
  c.globalAlpha = 1;
}

function usePower(p) {
  if (!p.held || S.ph !== 'play' || p.frozen > 0 || p.stun > 0) return;
  const type = p.held; p.held = null; const C = CONFIG;
  if (type === 'bopster') { p.dashT = C.DASH_S; p.dashVX = C.DASH_V * (p.f || 1); p.boostT = C.DASH_BOOST_MS / 1000; Snd.play('dash'); burst(p.x, p.y - 18, '#ff5ec8', 6, 100); }
  else if (type === 'grumpulator') {
    const live = P.filter(o => o.active && o !== p);
    for (const o of live) if (Math.hypot(wdx(p.x, o.x), p.y - o.y) <= C.SLAM_R) { o.stun = C.SLAM_MS; burst(o.x, o.y - 20, '#ffd23d', 5, 70); }
    Snd.play('slam'); ring(p.x, p.y - 10, '#ff8a3d', C.SLAM_R, 0.4); shake(6, 0.25);
  } else if (type === 'sneakfolder') {
    burst(p.x, p.y - 18, '#ffc93d', 7, 90);
    p.decoy = { x: p.x, y: p.y, f: p.f, t: C.DECOY_MS / 1000 };
    p.x = wrapX(p.x + C.BLINK_D * (p.f || 1));
    burst(p.x, p.y - 18, '#ffc93d', 7, 90);
    Snd.play('blink');
  }
}

function endRound() {
  S.ph = 'over';
  P.forEach(p => p.held = null);
  const ranked = P.filter(p => p.active).slice().sort((a, b) => a.itClock - b.itClock);
  S.ranked = ranked;
  const lowest = ranked[0].itClock;
  S.winners = ranked.filter(p => Math.abs(p.itClock - lowest) <= 100);
  const mySlot = NET.mode === 'local' ? 0 : NET.mySlot, iWon = S.winners.some(p => p.slot === mySlot);
  Snd.play(S.winners.length > 1 ? 'draw' : (iWon ? 'win' : 'lose'));
}

function tick(dtms) {
  const dt = dtms / 1000;
  if (NET.mode !== 'local') { netTick(dtms); return; }
  if (S.ph === 'countdown') {
    S.t -= dtms;
    if (S.t <= 0) { S.ph = 'play'; S.t = S.roundMs; Snd.play('go'); }
    return;
  }
  if (S.ph !== 'play') return;
  S.t -= dtms;
  const live = P.filter(p => p.active);
  for (const p of live) {
    const inp = p.isBot ? botThink(p, live) : readHumanInput();
    stepPlayer(p, inp, dt, true);
    if (p.isBot ? botWantsPower(p, live) : inp.pwr) usePower(p);
  }
  detectTags();
  dronesStep(dtms);
  camStep(dt); fxStep(dt);
  if (S.t <= 0) { S.t = 0; endRound(); }
}

/* ---------- networked tick: each phone steps only its own robot; the host alone runs
   round/drone/It-clock bookkeeping and validates claims; everyone else just applies what
   the host broadcasts (section 11) ---------- */
function netTick(dtms) {
  const dt = dtms / 1000, now = performance.now();
  NET.lastSentT += dtms;
  if (NET.lastSentT >= 1000 / CONFIG.STATE_HZ) { NET.lastSentT = 0; Net.send(myStateMsg()); }

  if (S.ph === 'play') {
    const me = P[NET.mySlot];
    if (me && me.active) {
      const inp = readHumanInput();
      stepPlayer(me, inp, dt, true);
      if (inp.pwr && me.held) {
        if (NET.isHost) usePower(me);
        else {
          const type = me.held;
          if (type === 'bopster' || type === 'sneakfolder') usePower(me);   // self-movement: client-authoritative, instant
          else me.held = null;                                             // grumpulator: no self movement, host applies the AoE
          Net.send({ type: 'claim_power', slot: NET.mySlot, power: type, x: me.x, y: me.y });
        }
      }
      if (me.it) {
        const others = P.filter(p => p.active && p !== me);
        for (const o of others) {
          if (!tagAllowed(me, o)) continue;
          if (hitGap(me.x, me.y, o.x, o.y) <= CONFIG.LOCAL_TAG_SLACK) {
            if (NET.isHost) applyTag(me, o); else Net.send({ type: 'claim_tag', by: NET.mySlot, target: o.slot, x: me.x, y: me.y });
            break;
          }
        }
      }
      for (const d of S.drones) {
        if (Math.hypot(wdx(me.x, d.x), me.y - d.y) > CONFIG.CATCH_R) continue;
        if (NET.isHost) catchBadsoff(me, d); else Net.send({ type: 'claim_catch', slot: NET.mySlot, droneId: d.id, x: me.x, y: me.y });
        break;
      }
    }
  }

  if (NET.isHost) {
    if (S.ph === 'countdown') { S.t -= dtms; if (S.t <= 0) { S.ph = 'play'; S.t = S.roundMs; Snd.play('go'); } }
    else if (S.ph === 'play') {
      S.t -= dtms;
      const itP = P.find(p => p.active && p.it); if (itP) itP.itClock += dt * 1000;
      dronesStep(dtms);
      if (S.t <= 0) { S.t = 0; endRound(); }
    }
    for (let i = 1; i < CONFIG.MAX_SLOTS; i++) {
      const peer = NET.peers[i];
      if (!peer || !peer.connected) continue;
      if (now - peer.lastSeen > CONFIG.PEER_TIMEOUT_MS) {
        peer.connected = false;

/* ---------- scenery: BSWV21 Page tileset (tools/process_page.py + embed_scenery.py). Same

        UI.lobby.ready = { x: row.x + row.w * 0.55, y: row.y, w: row.w * 0.45, h: row.h };
      }
    } else { c.fillStyle = CC.t2; c.font = '600 11px system-ui'; c.textAlign = 'center'; c.fillText('OPEN SLOT', row.x + row.w / 2, row.y + 25); }
    ry += 48;
  }
  if (NET.isHost) {
    UI.lobby.roundLen = btn(c, 30, ry + 6, VW - 60, 40, 'ROUND LENGTH: ' + NET.roundLenMin + ' MIN');
    ry += 56;
    const connected = P.filter(p => p.active).length, allReady = P.filter(p => p.active).every(p => NET.ready[p.slot]);
    UI.lobby.start = btn(c, 30, ry, VW - 60, 48, connected >= 2 && allReady ? 'START' : 'NEED 2+ PLAYERS READY');
  } else {
    c.fillStyle = CC.t2; c.font = '600 11px system-ui'; c.fillText('TAP YOUR ROW TO SWAP ROBOT, TAP READY', VW / 2, ry + 20);
  }
  c.strokeStyle = CC.bd; c.lineWidth = 1.5; c.beginPath(); c.roundRect(10, PLAY_Y0 + 6, 50, 24, 6); c.stroke();
  c.fillStyle = CC.t2; c.font = '600 10px system-ui'; c.textAlign = 'center'; c.fillText('BACK', 35, PLAY_Y0 + 21);
  UI.lobby.back = { x: 10, y: PLAY_Y0 + 6, w: 50, h: 24 };
}

/* ---------- lobby / title / code-entry flow (section 10) ---------- */
function startHost() {
  netReset(); NET.mode = 'host'; NET.isHost = true; NET.mySlot = 0; NET.code = store.get('bsw_lastcode', genCode());
  Net.openTabs(NET.code);
  P.forEach((p, i) => { p.active = i === 0; p.robot = i; p.isBot = false; });
  resetPlayer(P[0], 0, 1);
  NET.ready = [false, false, false, false]; NET.picks = [0, 1, 2, 3];
  S.ph = 'lobby'; S.connecting = false;
  store.set('bsw_lastcode', NET.code);
}
function startGuest(code) {
  netReset(); NET.mode = 'guest'; NET.isHost = false; NET.code = code;
  Net.openTabs(code);
  const stored = tryDo(() => sessionStorage.getItem('bsw_token_' + code));
  Net.send({ type: 'join', token: stored || undefined });
  S.ph = 'lobby'; S.connecting = true;
}
function backToTitle() { netReset(); S.ph = 'title'; S.codeBuf = ''; }
const KEYROWS = ['ABCDEFGH', 'JKMNPQRS', 'TUVWXYZ2', '3456789'];
cv.addEventListener('pointerdown', e => {
  const t = toLogical(e); Snd.init();
  if (S.ph === 'title') {
    if (UI.title.host && inRect(t, UI.title.host)) return startHost();
    if (UI.title.join && inRect(t, UI.title.join)) { S.ph = 'enterCode'; S.codeBuf = ''; return; }
    if (UI.title.practice && inRect(t, UI.title.practice)) return startLocal(DEBUG_BOTS >= 0 ? DEBUG_BOTS : 2);
    return;
  }
  if (S.ph === 'enterCode') {
    if (UI.code.back && inRect(t, UI.code.back)) { S.ph = 'title'; return; }
    for (const k of UI.code.keys || []) {
      if (inRect(t, k.r)) {
        if (k.ch === '⌫') S.codeBuf = S.codeBuf.slice(0, -1);
        else if (S.codeBuf.length < 4) S.codeBuf += k.ch;
        if (S.codeBuf.length === 4) startGuest(S.codeBuf);
        return;
      }
    }
    return;
  }
  if (S.ph === 'lobby') {
    if (UI.lobby.back && inRect(t, UI.lobby.back)) return backToTitle();
    if (UI.lobby.ready && inRect(t, UI.lobby.ready)) {
      NET.ready[NET.mySlot] = !NET.ready[NET.mySlot];
      if (NET.isHost) { /* host's own ready is local, applied below on next frame */ }
      else Net.send({ type: 'ready', slot: NET.mySlot, ready: NET.ready[NET.mySlot] });
      return;
    }
    if (UI.lobby.pick && inRect(t, UI.lobby.pick)) {
      NET.picks[NET.mySlot] = (NET.picks[NET.mySlot] + 1) % CONFIG.ROBOTS.length;
      P[NET.mySlot].robot = NET.picks[NET.mySlot];
      if (!NET.isHost) Net.send({ type: 'pick', slot: NET.mySlot, robot: NET.picks[NET.mySlot] });
      return;
    }
    if (NET.isHost && UI.lobby.roundLen && inRect(t, UI.lobby.roundLen)) { NET.roundLenMin = NET.roundLenMin % 3 + 1; return; }
    if (NET.isHost && UI.lobby.start && inRect(t, UI.lobby.start)) {
      const connected = P.filter(p => p.active).length;
      if (connected >= 2 && P.filter(p => p.active).every((p, i) => NET.ready[p.slot])) {
        S.roundMs = NET.roundLenMin * 60000;
        buildLayout(Math.floor(Math.random() * LAYOUTS.length));
        P.forEach(p => { if (p.active) resetPlayer(p, p.slot, CONFIG.MAX_SLOTS); });
        const live = P.filter(p => p.active); live[Math.floor(Math.random() * live.length)].it = true;
        S.drones = []; S.droneSeq = 0; S.spawnT = CONFIG.SPAWN_FIRST_MS; S.feed = [];
        L.billboards.forEach(b => b.occupied = false);
        S.t = CONFIG.COUNTDOWN_MS; S.ph = 'countdown'; camSnap(); Snd.play('cd');
      }
      return;
    }
    return;
  }
  if (S.ph === 'over') {
    if (NET.mode === 'local') return startLocal(DEBUG_BOTS >= 0 ? DEBUG_BOTS : 2);
    if (NET.isHost) { S.ph = 'lobby'; NET.ready = NET.ready.map(() => false); }
  }
});
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
const UI = { title: {}, code: {}, lobby: {} };

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dtms = now - last; last = now; if (dtms > 250) dtms = 250;
  acc += dtms;
  while (acc >= 1000 / 60) { tick(1000 / 60); acc -= 1000 / 60; }
  const c = cx; c.save(); c.scale(view.bs, view.bs);
  c.fillStyle = '#060810'; c.fillRect(0, 0, VW, VH);
  const menuPh = S.ph === 'title' || S.ph === 'enterCode' || S.ph === 'lobby';
  drawPlayfield(c);
  if (!menuPh) { drawHUD(c); drawPanel(c); }
  c.restore();
}
requestAnimationFrame(frame);

/* ---------- test hook: exposes state for automated tests only ---------- */
window.__bsw = { CONFIG, P, S, L, cam, LAYOUTS, stepPlayer, resetPlayer, startLocal, tick, applyTag, tagAllowed, detectTags,
  endRound, hitGap, wrapX, wdx, buildLayout, checkReach, camSnap, camStep, botThink, botWantsPower,
  trySpawnBadsoff, catchBadsoff, applyHijack, usePower, dronesStep, FLOOR, WORLD_H, VW, VH, PLAY_H,
  Net, NET, startHost, startGuest, backToTitle, myStateMsg, applyStateMsg, sharedSnapshot, applySharedSnapshot, netTick,
  Art, pickRobotAnim, FX, fxStep, burst, ring, shake, Scenery, UI, touch };
