<title>CiaoBella Protocol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one chat column (full width on phone, 760px centred on tablet); header, scrolling conversation, composer. Matrix green-blue skin, single dark look by choice. */
:root{
  --bg:#03100c; --ln:#0e3a2c; --lb:#4fa8ff; --v:#7dffc4; --dim:#3d7a63; --al:#ff5c7a;
  --panel:#061a14; --lbbg:#0a2540;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --fs:15px; color-scheme:dark;
}
@media (min-width:768px){:root{--fs:16px}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--v);font:var(--fs)/1.5 var(--mono);overflow:hidden;-webkit-text-size-adjust:100%;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;
  background:repeating-linear-gradient(0deg,var(--v) 0 1px,transparent 1px 4px);animation:drift 9s linear infinite}
@keyframes drift{to{background-position:0 40px}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--lb);outline-offset:2px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--ln);background:var(--bg)}
.orb{width:40px;height:40px;position:relative;flex:none}
.orb i{position:absolute;border-radius:50%;display:block}
.orb .r1{inset:0;border:1px solid var(--v);border-top-color:transparent;animation:spin 14s linear infinite}
.orb .r2{inset:7px;border:1px solid var(--lb);border-bottom-color:transparent;animation:spin 22s linear infinite reverse;opacity:.8}
.orb .d{inset:15px;background:var(--v);box-shadow:0 0 10px var(--v);animation:breathe 4s ease-in-out infinite}
.orb.thinking .r1{animation-duration:2s}.orb.thinking .r2{animation-duration:2.6s;animation-direction:normal}
.orb.replying .r1{border-style:dotted;border-top-color:var(--v)}
.orb.pulse .d{animation:chunk .25s ease-out}
.orb.offline i{border-color:var(--dim);background:transparent;box-shadow:none;animation:none}
.orb.offline .d{background:var(--dim)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.55);opacity:.6}}
@keyframes chunk{from{transform:scale(1.6)}to{transform:scale(1)}}
.hd{flex:1;min-width:0}
.hd b{display:block;letter-spacing:.2em;font-size:1.05em}
.hd small{display:block;color:var(--dim);font-size:.62em;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small em{color:var(--al);font-style:normal}
.cnt{color:var(--dim);font-size:.8em;white-space:nowrap}
.btn{min-height:44px;min-width:44px;padding:0 10px;color:var(--lb);letter-spacing:.05em;border:1px solid var(--ln);border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.btn.arm{color:var(--al);border-color:var(--al)}

/* conversation */
#conv{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{animation:rise .3s ease-out both;max-width:100%}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.u{align-self:flex-end;max-width:86%;background:var(--lbbg);border:1px solid var(--lb);color:var(--lb);padding:8px 12px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.n{white-space:pre-wrap;overflow-wrap:anywhere}
.n .pre{color:var(--dim)}
.n.stream .body::after{content:"\2588";margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.s{color:var(--dim);font-size:.85em;overflow-wrap:anywhere}
.s.err{color:var(--al)}
.send.s.live{animation:shim 1.4s ease-in-out infinite}
@keyframes shim{50%{opacity:.35}}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:84px;height:84px;border:1px solid var(--ln);border-radius:4px;overflow:hidden;background:var(--panel);padding:0;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(8px) saturate(0);opacity:.6}
.th.ok img{animation:sharpen .9s steps(4) forwards}
@keyframes sharpen{to{filter:blur(0) saturate(1);opacity:1}}
.th.ok::after{content:"";position:absolute;left:0;right:0;height:14px;top:-14px;background:linear-gradient(transparent,rgba(125,255,196,.45),transparent);animation:scan 1s linear 1 forwards}
@keyframes scan{to{top:100%}}
.th b{position:absolute;left:0;bottom:0;background:rgba(3,16,12,.82);color:var(--v);font-size:.72em;padding:1px 5px;font-weight:400}
.more{align-self:center;color:var(--dim);font-size:.85em}
.card{border:1px solid var(--ln);background:var(--panel);border-radius:6px;padding:12px;position:relative;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border:1px solid var(--v);border-radius:6px;pointer-events:none;clip-path:inset(0 100% 100% 0);animation:draw 1.1s ease-out forwards}
@keyframes draw{40%{clip-path:inset(0 0 100% 0)}70%{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 0);opacity:.35}}
.card h4{margin:0;font-size:1em;color:var(--lb);font-weight:700;overflow-wrap:anywhere}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.card li{display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.card li .strip{gap:6px}.card li .th{width:56px;height:56px}
.card .del{color:var(--al)}
.acts{display:flex;gap:10px}
.acts .btn{flex:1}
.acts .y{color:var(--v);border-color:var(--v)}.acts .nn{color:var(--al);border-color:var(--al)}
.card.done .acts{display:none}
.card .st{display:none;letter-spacing:.1em;font-size:.85em}
.card.done .st{display:block}
.card.approved{animation:flash .7s ease-out}
@keyframes flash{from{background:rgba(125,255,196,.3)}}
.card.declined{opacity:.45;transition:opacity .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--ln);border-radius:22px;color:var(--lb);text-align:left}
.chip:active{background:var(--lbbg)}

/* composer */
.focus{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.focus:empty{display:none}
.fc{min-height:32px;padding:0 10px;border:1px solid var(--lb);color:var(--lb);border-radius:16px;font-size:.85em}
footer{border-top:1px solid var(--ln);background:var(--bg);padding-bottom:8px}
.comp{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
textarea{flex:1;min-width:0;resize:none;background:var(--panel);color:var(--v);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;font:16px/1.4 var(--mono);max-height:132px;min-height:44px;caret-color:var(--v)}
textarea:focus{outline:0;border-color:var(--v);box-shadow:0 0 12px rgba(125,255,196,.35)}
textarea::placeholder{color:var(--dim)}
#plus{font-size:1.5em}
#go.stop{color:var(--al);border-color:var(--al)}
#fi{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{cursor:pointer;-webkit-user-select:none;user-select:none}

/* viewer */
#vw{position:fixed;inset:0;z-index:50;background:rgba(3,16,12,.97);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#vw[hidden]{display:none}
.vtop{display:flex;justify-content:space-between;align-items:center;padding-block:6px}
.vimg{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y;display:flex;align-items:center;justify-content:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .25s;user-select:none;-webkit-user-drag:none}
.vnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(3,16,12,.6);border:1px solid var(--ln);border-radius:4px;color:var(--lb);min-width:44px;min-height:44px}
.vnav.l{left:max(8px,env(safe-area-inset-left,0px))}.vnav.r{right:max(8px,env(safe-area-inset-right,0px))}
.vdet{padding-block:10px;font-size:.85em;max-height:34%;overflow-y:auto;border-top:1px solid var(--ln)}
.vdet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.vdet dt{color:var(--lb)}.vdet dd{margin:0;overflow-wrap:anywhere}

/* launch */
#boot{position:fixed;inset:0;z-index:99;background:var(--bg);pointer-events:none;animation:bootout .9s ease-out forwards}
#boot::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--v);box-shadow:0 0 18px var(--v);animation:sweep .7s linear forwards}
@keyframes sweep{from{top:0}to{top:100%}}
@keyframes bootout{0%,60%{opacity:1}to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #boot{display:none}.th img{filter:none;opacity:1}
}
</style>

<div id="boot" aria-hidden="true"></div>
<div id="app">
  <header class="gut">
    <div class="orb idle" id="orb" aria-hidden="true"><i class="r1"></i><i class="r2"></i><i class="d"></i></div>
    <div class="hd"><b>NANA</b><small id="stat">CIAOBELLA PROTOCOL // ONLINE</small></div>
    <span class="cnt" id="cnt">0 ITEMS</span>
    <button class="btn" id="new" type="button" aria-label="New chat">[NEW]</button>
  </header>
  <main id="conv" class="gut" aria-live="polite"></main>
  <footer class="gut">
    <div class="focus" id="focus"></div>
    <div class="comp">
      <label class="btn" id="plus" for="fi" role="button" tabindex="0" aria-label="Add photos">+</label>
      <textarea id="msg" rows="1" placeholder="Ask Nana" aria-label="Message to Nana" enterkeyhint="send"></textarea>
      <button class="btn" id="go" type="button" aria-label="Send">SEND</button>
    </div>
    <input id="fi" type="file" accept="image/*" multiple>
  </footer>
</div>
<div id="vw" hidden>
  <div class="vtop gut"><span class="s" id="vt"></span><button class="btn" id="vx" type="button">[X]</button></div>
  <div class="vimg" id="vi"><button class="vnav l" id="vp" type="button" aria-label="Previous">&lt;</button><img id="vimg" alt=""><button class="vnav r" id="vn" type="button" aria-label="Next">&gt;</button></div>
  <div class="vdet gut"><dl id="vd"></dl><div class="acts" style="margin-top:10px"><button class="btn y" id="va" type="button">[ASK]</button></div></div>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clean=s=>String(s||"").replace(/\s*[—–]\s*/g,", ").replace(/\*\*|__|^#+\s/gm,"");
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fdate=ms=>{if(!ms)return"unknown";const d=new Date(ms);return d.getDate()+" "+MON[d.getMonth()].slice(0,3)+" "+d.getFullYear()};
const enc=new TextEncoder(),dec=new TextDecoder();
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- storage: IndexedDB "cbp" (rec, blob, sys); memory fallback ---------- */
const mem={rec:new Map(),blob:new Map(),sys:new Map()};
let db=null;
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open("cbp",1);
  r.onupgradeneeded=()=>{["rec","blob","sys"].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}})}
function tx(store,mode,fn){return new Promise((res,rej)=>{try{const t=db.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})}
async function sGet(st,k){if(!db)return mem[st].get(k);try{return await tx(st,"readonly",s=>s.get(k))}catch(e){return mem[st].get(k)}}
async function sPut(st,k,v){if(!db){mem[st].set(k,v);return}try{await tx(st,"readwrite",s=>s.put(v,k))}catch(e){mem[st].set(k,v)}}
async function sDel(st,k){mem[st].delete(k);if(!db)return;try{await tx(st,"readwrite",s=>s.delete(k))}catch(e){}}
async function sAll(st){const out=new Map(mem[st]);if(!db)return out;try{await new Promise((res,rej)=>{const t=db.transaction(st,"readonly");const c=t.objectStore(st).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.set(cur.key,cur.value);cur.continue()}};t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}return out}

/* ---------- crypto: WebCrypto AES-GCM, 256-bit key on this device ---------- */
let KEY=null;
async function initKey(){
  let k=null;
  try{k=await sGet("sys","key");if(k&&!(k instanceof CryptoKey))k=null}catch(e){}
  if(k){KEY=k;return}
  try{const raw=localStorage.getItem("cbp-key");if(raw){KEY=await crypto.subtle.importKey("raw",Uint8Array.from(atob(raw),c=>c.charCodeAt(0)),"AES-GCM",false,["encrypt","decrypt"]);return}}catch(e){}
  try{k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    if(db){await tx("sys","readwrite",s=>s.put(k,"key"));KEY=k;return}}catch(e){}
  try{const raw=crypto.getRandomValues(new Uint8Array(32));
    try{localStorage.setItem("cbp-key",btoa(String.fromCharCode(...raw)))}catch(e){}
    KEY=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"])}catch(e){KEY=null}
}
async function seal(buf){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},KEY,buf));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o.buffer}
async function open(buf){const b=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12))}
const putRec=async(id,o)=>sPut("rec",id,await seal(enc.encode(JSON.stringify(o))));
const getRecs=async()=>{const all=await sAll("rec");const out=new Map();for(const[k,v]of all){try{out.set(k,JSON.parse(dec.decode(await open(v))))}catch(e){}}return out};
const putBlob=async(id,blob)=>sPut("blob",id,await seal(await blob.arrayBuffer()));
const getBlob=async(id,type)=>{const v=await sGet("blob",id);if(!v)return null;try{return new Blob([await open(v)],{type:type||"image/jpeg"})}catch(e){return null}};

/* ---------- state ---------- */
const S={cases:new Map(),items:new Map(),props:new Map(),chat:[],turns:[],meta:{next:1},notes:[],focus:[],busy:false,ctl:null,sample:null,imgMax:0,online:false};
const byNo=n=>{n=+n;for(const i of S.items.values())if(i.no===n)return i;return null};
const caseOf=i=>i.case?S.cases.get(i.case):null;
const findCase=name=>{name=String(name||"").trim().toLowerCase();if(!name)return null;for(const c of S.cases.values())if(c.name.toLowerCase()===name||c.id===name)return c;return null};
const saveItem=i=>putRec("i:"+i.id,i);
const saveCase=c=>putRec("c:"+c.id,c);
const saveProp=p=>putRec("p:"+p.id,p);
let chatT=null;
const saveChat=()=>{clearTimeout(chatT);chatT=setTimeout(()=>{putRec("chat",S.chat);putRec("turns",S.turns);putRec("meta",S.meta)},250)};
const unsorted=()=>[...S.items.values()].filter(i=>!i.case);
const unread=()=>[...S.items.values()].filter(i=>!i.read);
const waiting=()=>[...S.props.values()].filter(p=>p.status==="proposed");

/* ---------- header / status ---------- */
function status(){
  const w=waiting().length;
  $("stat").replaceChildren(document.createTextNode("CIAOBELLA PROTOCOL // "+(S.online?"ONLINE":"OFFLINE")));
  if(w){const e=document.createElement("em");e.textContent=" ["+w+" WAITING]";$("stat").append(e)}
  const n=S.items.size;$("cnt").textContent=n+(n===1?" ITEM":" ITEMS");
}
let orbT=null;
function orb(st){const o=$("orb");o.className="orb "+(S.online||st==="offline"?st:"offline")}
function pulse(){const o=$("orb");o.classList.remove("pulse");void o.offsetWidth;o.classList.add("pulse")}

/* ---------- thumbnails ---------- */
const urls=new Map();
async function thumbURL(id){if(urls.has(id))return urls.get(id);const it=S.items.get(id);const b=await getBlob("t:"+id,"image/jpeg");if(!b)return null;const u=URL.createObjectURL(b);urls.set(id,u);return u}
function thumb(id,opts={}){
  const it=S.items.get(id);const b=el("button","th");b.type="button";
  if(!it){b.append(el("b",null,"gone"));return b}
  const im=document.createElement("img");im.alt="Item "+it.no+(it.caption?": "+it.caption:"");b.append(im,el("b",null,"#"+it.no));
  thumbURL(id).then(u=>{if(u){im.src=u;im.onload=()=>b.classList.add("ok")}});
  if(!opts.static)b.onclick=()=>openViewer(opts.list||[id],(opts.list||[id]).indexOf(id));
  return b;
}
function stripEl(ids,list){const w=el("div","strip");for(const id of ids.slice(0,30))w.append(thumb(id,{list:list||ids}));return w}

/* ---------- conversation rendering ---------- */
const conv=$("conv");
const bottom=()=>requestAnimationFrame(()=>{conv.scrollTop=conv.scrollHeight});
function describe(c){
  const nums=(c.numbers||[]).map(n=>"#"+n).join(", ");
  switch(c.kind){
    case"move_items":return"Move "+nums+" to "+(findCase(c.case)?"":"new case ")+'"'+c.case+'"';
    case"rename_case":return'Rename case "'+c.case+'" to "'+c.new_name+'"';
    case"remove_case":return'Remove case "'+c.case+'" (its items become unsorted)';
    case"rename_item":return"Rename #"+c.number+" to "+c.new_name;
    case"delete_items":return"Delete "+nums;
    default:return c.kind}
}
function cardEl(p){
  const c=el("div","msg card"+(p.status!=="proposed"?" done "+p.status:""));
  c.append(el("h4",null,p.headline||"Proposed changes"));
  const ul=el("ul");
  for(const ch of p.changes){
    const li=el("li");const t=el("span",ch.kind==="delete_items"||ch.kind==="remove_case"?"del":"",describe(ch));li.append(t);
    const ids=(ch.numbers||(ch.number?[ch.number]:[])).map(n=>byNo(n)?.id).filter(Boolean);
    if(ids.length){const s=el("div","strip");ids.slice(0,6).forEach(id=>s.append(thumb(id,{static:true})));if(ids.length>6)s.append(el("span","more","+"+(ids.length-6)));li.append(s)}
    ul.append(li)}
  const st=el("div","st",p.status==="approved"?"[Y] APPROVED":"[N] DECLINED");
  const a=el("div","acts");const y=el("button","btn y","[Y] APPROVE"),n=el("button","btn nn","[N] DECLINE");y.type=n.type="button";
  y.onclick=()=>answer(p,true,c);n.onclick=()=>answer(p,false,c);a.append(y,n);
  c.append(ul,a,st);return c;
}
function render(ev){
  let n;
  switch(ev.t){
    case"u":n=el("div","msg u",ev.text);if(ev.ids&&ev.ids.length){const w=el("div","msg strip");w.style.alignSelf="flex-end";ev.ids.forEach(i=>w.append(thumb(i)));conv.append(n);conv.append(w);return w}break;
    case"n":n=el("div","msg n");n.append(el("span","pre","NANA> "),el("span","body",clean(ev.text)));break;
    case"s":n=el("div","msg s"+(ev.err?" err":""),ev.text);break;
    case"strip":n=el("div","msg");if(ev.label)n.append(el("div","s",ev.label));n.append(stripEl(ev.ids));break;
    case"card":{const p=S.props.get(ev.pid);if(!p)return null;n=cardEl(p);break}
    case"send":n=el("div","msg s send"+(ev.live?" live":""),(ev.live?"↑ SENDING ":"↑ SENT ")+ev.n+(ev.n===1?" IMAGE":" IMAGES"));ev.node=n;break;
    default:return null}
  conv.append(n);return n;
}
function add(ev,persist=true){
  if(persist){S.chat.push(ev);if(S.chat.length>300)S.chat.splice(0,S.chat.length-300);saveChat()}
  const n=render(ev);bottom();return n;
}
function sys(text,err){return add({t:"s",text,err:!!err})}
function clearChips(){conv.querySelectorAll(".chips").forEach(c=>c.remove())}
function chips(list){
  clearChips();if(!list.length)return;const w=el("div","msg chips");
  for(const[label,fn]of list){const b=el("button","chip",label);b.type="button";b.onclick=()=>{clearChips();fn()};w.append(b)}
  conv.append(w);bottom();
}

/* ---------- viewer ---------- */
let VL=[],VI=0,zoom=false,vUrl=null;
async function openViewer(list,i){VL=list.filter(id=>S.items.has(id));if(!VL.length)return;VI=Math.max(0,i);$("vw").hidden=false;showV()}
async function showV(){
  const id=VL[VI],it=S.items.get(id);if(!it)return;zoom=false;$("vimg").style.transform="";
  $("vt").textContent="#"+it.no+"  ("+(VI+1)+"/"+VL.length+")";
  const base=await thumbURL(id);$("vimg").src=base||"";$("vimg").alt=it.caption||("Item "+it.no);
  const d=$("vd");d.replaceChildren();
  const row=(k,v)=>{if(v==null||v==="")return;d.append(el("dt",null,k),el("dd",null,String(v)))};
  const c=caseOf(it);
  row("Case",c?c.name:"Unsorted");row("Type",it.type);row("File",it.filename);row("Taken",it.taken?fdate(it.taken):"unknown");row("Imported",fdate(it.imported));

function exif(buf){

    while(o<v.byteLength-4){const m=v.getUint16(o);if(m===0xFFE1){if(v.getUint32(o+4)!==0x45786966)return{};return tiff(v,o+10)}if((m&0xFF00)!==0xFF00)break;o+=2+v.getUint16(o+2)}}catch(e){}

}
function tiff(v,b){
  const le=v.getUint16(b)===0x4949,u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le),res={};
  const ifd=off=>{const out={},n=u16(b+off);for(let i=0;i<n;i++){const e=b+off+2+i*12;out[u16(e)]={count:u32(e+4),vo:e+8}}return out};

  const i0=ifd(u32(b+4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo)),d=ex[0x9003]||ex[0x9004];
    if(d){const m=str(d).match(/(\d+):(\d+):(\d+) (\d+):(\d+):(\d+)/);if(m)res.taken=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime()}}

    if(g[2]&&g[4]){const la=rat(g[2]),lo=rat(g[4]);let lat=la[0]+la[1]/60+la[2]/3600,lon=lo[0]+lo[1]/60+lo[2]/3600;

}

    else if(c.kind==="remove_case"){const cs=findCase(c.case);if(cs){for(const i of S.items.values())if(i.case===cs.id){i.case=null;saveItem(i)}S.cases.delete(cs.id);sDel("rec","c:"+cs.id)}}
    else if(c.kind==="rename_item"){const i=byNo(c.number);if(i&&c.new_name){i.filename=String(c.new_name).slice(0,120);saveItem(i)}}
    else if(c.kind==="delete_items"){for(const n of c.numbers||[]){const i=byNo(n);if(i){S.items.delete(i.id);sDel("rec","i:"+i.id);sDel("blob","f:"+i.id);sDel("blob","t:"+i.id);urls.delete(i.id)}}}
  }
  for(const cs of[...S.cases.values()])if(![...S.items.values()].some(i=>i.case===cs.id)&&p.changes.some(c=>c.kind==="delete_items")){/* keep empty cases until removed explicitly */}
}
function answer(p,yes,node){
  if(p.status!=="proposed")return;
  p.status=yes?"approved":"declined";if(yes)applyChanges(p);saveProp(p);
  S.notes.push("Soff "+(yes?"approved":"declined")+" the card \""+p.headline+"\"."+(yes?" The changes have been applied.":" Nothing was changed."));
  node.classList.add("done",p.status);node.querySelector(".st").textContent=yes?"[Y] APPROVED":"[N] DECLINED";
  status();sys(yes?"Applied.":"Dropped. Nothing changed.");
}

/* ---------- composer ---------- */
function setBusy(b){const g=$("go");g.textContent=b?"STOP":"SEND";g.classList.toggle("stop",b);g.setAttribute("aria-label",b?"Stop":"Send")}
function offlineSearch(q){
  const r=search({query:q});
  if(!r.total){add({t:"n",text:"No matches for \""+q+"\"."});return}
  add({t:"strip",ids:r.items.map(i=>i.id),label:r.total+" match"+(r.total===1?"":"es")+(r.total>30?", showing 30":"")+" (plain search)"});
}
async function send(){
  if(S.busy){S.ctl&&S.ctl.abort();return}
  const t=$("msg").value.trim();if(!t)return;
  $("msg").value="";fit();clearChips();
  add({t:"u",text:t,ids:S.focus.slice()});
  if(!S.online||!S.sample){offlineSearch(t);S.focus=[];drawFocus();return}
  await ask(t);
}
$("go").onclick=send;
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();send()}});
function fit(){const m=$("msg");m.style.height="auto";m.style.height=Math.min(m.scrollHeight,132)+"px"}
$("msg").addEventListener("input",fit);
$("plus").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fi").click()}});
$("fi").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  if(S.busy){sys("Nana is busy. Add them again in a moment.",true);return}
  clearChips();S.busy=true;let ids=[];
  try{ids=await importFiles(files)}catch(err){sys("Import failed: "+(err&&err.message||"unknown error"),true)}
  S.busy=false;
  try{if(ids.length){if(S.online&&S.sample)await intake(ids);else sys("Nana is offline. Saved unsorted.")}}catch(err){sys("Reading stopped: "+(err&&err.message||"unknown error"),true)}
  S.busy=false;setBusy(false);status();
};
let armT=null;
$("new").onclick=()=>{
  const b=$("new");
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="[SURE?]";clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove("arm");b.textContent="[NEW]"},3000);return}
  clearTimeout(armT);b.classList.remove("arm");b.textContent="[NEW]";
  if(S.ctl)S.ctl.abort();
  S.chat=[];S.turns=[];S.notes=[];S.focus=[];drawFocus();conv.replaceChildren();
  for(const p of waiting())S.chat.push({t:"card",pid:p.id});
  saveChat();for(const ev of S.chat)render(ev);welcome();
};
{const vv=window.visualViewport;
 if(vv){const f=()=>{const kb=innerHeight-vv.height>120;$("app").style.height=kb?vv.height+"px":"";if(kb)scrollTo(0,0);bottom()};vv.addEventListener("resize",f);vv.addEventListener("scroll",()=>{if(innerHeight-vv.height>120)scrollTo(0,0)})}}

/* ---------- welcome + boot ---------- */
function welcome(){
  const n=S.items.size,u=unsorted().length,w=waiting().length,r=unread().length;
  const t="Welcome back, Soff. "+(n?n+(n===1?" item":" items")+" on file, "+u+" unsorted, "+w+(w===1?" card":" cards")+" waiting.":"The archive is empty. Tap + to add photos, screenshots or maps.");
  const m=el("div","msg n");m.append(el("span","pre","NANA> "),el("span","body",t));conv.append(m);
  const list=[];
  if(S.online){
    if(r)list.push(["Read "+r+" unread",readUnread]);
    if(u)list.push(["Show unsorted",()=>{$("msg").value="Show me everything that is unsorted";send()}]);
    if(n){list.push(["What cases do I have?",()=>{$("msg").value="What cases do I have?";send()}]);list.push(["Latest additions",()=>{$("msg").value="Show my 10 most recent items";send()}])}
  }else if(n){list.push(["Show recent",()=>{const ids=[...S.items.values()].sort((a,b)=>b.imported-a.imported).slice(0,12).map(i=>i.id);add({t:"strip",ids,label:"Most recent"})}])}
  chips(list);bottom();
}
async function boot(){
  try{db=await openDB()}catch(e){db=null}
  await initKey();
  if(!KEY){sys("This browser cannot do encryption, so nothing can be stored.",true);return}
  const recs=await getRecs();
  for(const[k,v]of recs){
    if(k.startsWith("c:"))S.cases.set(v.id,v);else if(k.startsWith("i:"))S.items.set(v.id,v);else if(k.startsWith("p:"))S.props.set(v.id,v);
    else if(k==="chat"&&Array.isArray(v))S.chat=v;else if(k==="turns"&&Array.isArray(v))S.turns=v;else if(k==="meta")S.meta=v;
  }
  const max=Math.max(0,...[...S.items.values()].map(i=>i.no));if(S.meta.next<=max)S.meta.next=max+1;
  try{S.sample=window.claude&&claude.use?await claude.use("sample"):null}catch(e){S.sample=null}
  if(S.sample){try{const l=await S.sample.limits();S.imgMax=(l.images&&l.images.maxCount)||0}catch(e){S.imgMax=0}}
  S.online=!!S.sample;orb(S.online?"idle":"offline");
  for(const ev of S.chat)if(ev.t==="send"&&ev.live)ev.live=false;
  for(const ev of S.chat)render(ev);
  for(const p of waiting())if(!S.chat.some(e=>e.t==="card"&&e.pid===p.id)){const ev={t:"card",pid:p.id};S.chat.push(ev);render(ev)}
  status();welcome();
}
boot();
